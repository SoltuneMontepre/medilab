version: "3"

set: [pipefail]

dotenv:
  - '{{.MEDILAB_SETUP_DOTENV | default "src/core/.env.local"}}'
  - '{{.MEDILAB_SETUP_DOTENV | default "tools/infrastructure/.env"}}'

vars:
  DOPPLER_PROJECT: medilab
  DOPPLER_CONFIG: dev
  DOPPLER_RUN: doppler run --project {{.DOPPLER_PROJECT}} --config {{.DOPPLER_CONFIG}} --

includes:
  ai:
    taskfile: tools/taskfiles/ai.taskfile.yml
    dir: .
    flatten: true
  ansible:
    taskfile: tools/taskfiles/ansible.taskfile.yml
    dir: .
    flatten: true
  app:
    taskfile: tools/taskfiles/app.taskfile.yml
    dir: .
    flatten: true
  dev:
    taskfile: tools/taskfiles/dev.taskfile.yml
    dir: .
    flatten: true
  tf:
    taskfile: tools/taskfiles/tf.taskfile.yml
    dir: .
    flatten: true
  setup:
    taskfile: tools/taskfiles/setup.taskfile.yml
    dir: .
    flatten: true
  onlyoffice:
    taskfile: tools/taskfiles/onlyoffice.taskfile.yml
    dir: .
    flatten: true
  sync:
    taskfile: tools/taskfiles/sync.taskfile.yml
    dir: .
    flatten: true
  test:
    taskfile: tools/taskfiles/test.taskfile.yml
    dir: .
    flatten: true

tasks:
  default:
    cmds:
      - task --list
    silent: true

  setup:
    desc: "Set up and verify Odoo, ONLYOFFICE and native Sync development"
    silent: true
    interactive: true
    env:
      MEDILAB_SETUP_MODULES: '{{.MODULES | default "all"}}'
    preconditions:
      - sh: python -c "import sys; raise SystemExit(sys.version_info < (3, 12))"
        msg: "Python 3.12+ is required on PATH. Install Python for Linux or Windows, disable Windows Store aliases if needed, and reopen the terminal. See README.md."
    cmds:
      - python tools/scripts/local_setup.py setup
