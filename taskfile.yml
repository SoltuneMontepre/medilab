version: "3"

set: [pipefail]

dotenv: [src/core/.env.local, tools/infrastructure/.env]

vars:
  DOPPLER_PROJECT: medilab
  DOPPLER_CONFIG: dev
  DOPPLER_RUN: doppler run --project {{.DOPPLER_PROJECT}} --config {{.DOPPLER_CONFIG}} --

includes:
  ai:
    taskfile: tools/taskfiles/ai.taskfile.yml
    dir: .
    flatten: true
  ansible:
    taskfile: tools/taskfiles/ansible.taskfile.yml
    dir: .
    flatten: true
  app:
    taskfile: tools/taskfiles/app.taskfile.yml
    dir: .
    flatten: true
  dev:
    taskfile: tools/taskfiles/dev.taskfile.yml
    dir: .
    flatten: true
  tf:
    taskfile: tools/taskfiles/tf.taskfile.yml
    dir: .
    flatten: true
  test:
    taskfile: tools/taskfiles/test.taskfile.yml
    dir: .
    flatten: true

tasks:
  default:
    cmds:
      - task --list
    silent: true

  setup:
    desc: "Set up repository & start the app"
    silent: true
    cmds:
      - python tools/scripts/demo_bootstrap.py check-normal
      - task: doppler
      - task: dev:setup
      - task: ai:setup
      - task: upgrade

  setup:fresh:
    desc: "Create an isolated fresh local database, seed demo data with private report assets, then start the app"
    silent: true
    cmds:
      - task: dev:setup
      - task: ai:setup
      - . tools/scripts/log.sh && log_step "Fresh local demo setup"
      - python tools/scripts/demo_bootstrap.py setup
      - . tools/scripts/log.sh && log_ok "Fresh local demo setup is ready."

  setup:fresh:select:
    desc: "Select a new, empty isolated local demo project for this worktree"
    silent: true
    requires:
      vars: [PROJECT]
    env:
      MEDILAB_SELECTED_PROJECT: '{{.PROJECT}}'
    cmds:
      - python tools/scripts/demo_bootstrap.py select

  setup:fresh:switch:
    desc: "Switch between a verified completed demo project and a new isolated one"
    silent: true
    requires:
      vars: [PROJECT]
    env:
      MEDILAB_SELECTED_PROJECT: '{{.PROJECT}}'
    cmds:
      - python tools/scripts/demo_bootstrap.py switch

  setup:fresh:switch:recover:
    desc: "Resolve an interrupted project switch after verifying both saved selections"
    silent: true
    cmds:
      - python tools/scripts/demo_bootstrap.py switch-recover

  setup:fresh:recover:
    desc: "Discard a failed fresh local bootstrap after verifying its isolated resource ownership"
    silent: true
    interactive: true
    cmds:
      - . tools/scripts/log.sh && log_step "Recover fresh local demo setup"
      - python tools/scripts/demo_bootstrap.py recover
