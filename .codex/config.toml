[mcp_servers.odoo]
command = "uv"
args = ["run", "--no-project", "python", "-c", "import runpy; from pathlib import Path; runpy.run_path(str(next(p / 'tools/odoo-intelligence/run.py' for p in [Path.cwd(), *Path.cwd().parents] if (p / 'tools/odoo-intelligence/run.py').is_file())), run_name='__main__')", "mcp"]
startup_timeout_sec = 60
tool_timeout_sec = 660

[mcp_servers.serena]
command = "uv"
args = ["run", "--no-project", "python", "-c", "import runpy; from pathlib import Path; runpy.run_path(str(next(p / 'tools/odoo-intelligence/run.py' for p in [Path.cwd(), *Path.cwd().parents] if (p / 'tools/odoo-intelligence/run.py').is_file())), run_name='__main__')", "serena", "start-mcp-server", "--context", "ide", "--project", ".", "--enable-web-dashboard", "false", "--enable-gui-log-window", "false"]
startup_timeout_sec = 180
tool_timeout_sec = 180
