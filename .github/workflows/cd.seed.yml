name: cd-seed

permissions:
  contents: read

concurrency:
  group: medilab-cd-seed
  cancel-in-progress: false

on:
  push:
    branches:
      - main
    paths:
      - "tools/scripts/cloud_seed.py"
      - "tools/dockerfiles/seed.dockerfile"
      - "tools/taskfiles/cloud.taskfile.yml"
      - ".github/workflows/cd.seed.yml"
  # Every night at 02:00 in Vietnam
  schedule:
    - cron: "0 19 * * *"
  workflow_dispatch:

env:
  IMAGE: ghcr.io/soltunemontepre/medilab-seed
  SEED_DIR: .local/cloud-seed

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Set up Task
        uses: arduino/setup-task@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Seed the demo database
        run: task cloud:seed CLOUD_SEED_DIR="$SEED_DIR"

      - name: Set up Docker Build
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,format=long
            type=raw,value=latest

      - name: Build and push seed image
        uses: docker/build-push-action@v7
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: ${{ env.SEED_DIR }}
          file: tools/dockerfiles/seed.dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: false
