name: cd-cleanup

permissions:
  contents: read

concurrency:
  group: medilab-cd-cleanup
  cancel-in-progress: false

on:
  pull_request:
    types: [closed]
  workflow_run:
    workflows: [cd-core]
    types: [completed]
  workflow_dispatch:

jobs:
  cleanup:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork != true)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
      pull-requests: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Find open pull requests
        id: open
        run: |
          set -euo pipefail
          {
            echo "numbers=$(gh pr list --state open --limit 1000 --json number --jq '[.[].number] | join(" ")')"
            echo "branches=$(gh pr list --state open --limit 1000 --json headRefName --jq '[.[].headRefName] | join(" ")')"
          } >> "$GITHUB_OUTPUT"

      - name: Delete artifacts of closed pull requests
        env:
          OPEN: ${{ steps.open.outputs.branches }}
        run: |
          set -euo pipefail
          gh api --paginate "repos/$GH_REPO/actions/artifacts" \
            --jq '.artifacts[] | select(.workflow_run.head_branch != "main") | [.id, .name, .workflow_run.head_branch] | @tsv' |
          while IFS=$'\t' read -r id name branch; do
            [[ " $OPEN " == *" $branch "* ]] && continue
            echo "Deleting artifact $id ($name from $branch)"
            gh api --method DELETE "repos/$GH_REPO/actions/artifacts/$id"
          done

      - name: Delete caches of closed pull requests
        if: ${{ !cancelled() }}
        env:
          OPEN: ${{ steps.open.outputs.numbers }}
        run: |
          set -euo pipefail
          gh cache list --limit 1000 --json ref --jq '[.[].ref | select(startswith("refs/pull/"))] | unique | .[]' |
          while read -r ref; do
            number=${ref#refs/pull/}
            number=${number%%/*}
            [[ " $OPEN " == *" $number "* ]] && continue
            echo "Deleting caches of $ref"
            gh cache delete --all --ref "$ref" --succeed-on-no-caches
          done

  branch:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork != true && github.head_ref != github.event.repository.default_branch
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      contents: write
      pull-requests: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      BRANCH: ${{ github.head_ref }}
    steps:
      - name: Delete the closed pull request branch
        run: |
          set -euo pipefail
          if [[ -n "$(gh pr list --state open --head "$BRANCH" --json number --jq '.[].number')" ]]; then
            echo "Keeping $BRANCH: another open pull request uses it"
            exit 0
          fi
          if gh api --silent "repos/$GH_REPO/git/ref/heads/$BRANCH" 2>/dev/null; then
            echo "Deleting branch $BRANCH"
            gh api --method DELETE "repos/$GH_REPO/git/refs/heads/$BRANCH"
          else
            echo "Branch $BRANCH is already deleted"
          fi

  images:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_run'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      packages: write
    steps:
      - name: Delete old images
        uses: dataaxiom/ghcr-cleanup-action@v1
        with:
          owner: soltunemontepre
          package: medilab
          keep-n-tagged: 5
          delete-untagged: true
