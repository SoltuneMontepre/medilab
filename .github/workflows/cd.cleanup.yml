name: cd-cleanup

permissions:
  contents: read

concurrency:
  group: medilab-cd-cleanup
  cancel-in-progress: false

on:
  pull_request:
    types: [closed]
  workflow_dispatch:
    inputs:
      pull_request:
        description: "Pull request number to clean up; leave empty to delete only untagged images"
        required: false
        type: string

jobs:
  cleanup:
    if: github.event.pull_request.head.repo.fork != true
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
      packages: write
      pull-requests: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      PACKAGE: orgs/${{ github.repository_owner }}/packages/container/medilab-odoo
      PR: ${{ github.event.pull_request.number || inputs.pull_request }}
    steps:
      - name: Find the pull request branch
        id: pr
        if: env.PR != ''
        run: echo "branch=$(gh api "repos/$GH_REPO/pulls/$PR" --jq .head.ref)" >> "$GITHUB_OUTPUT"

      - name: Delete images
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          if ! versions=$(gh api --paginate "$PACKAGE/versions" --jq '.[] | [.id, (.metadata.container.tags | join(","))] | @tsv' 2>/dev/null); then
            echo "No medilab-odoo package, nothing to delete."
            exit 0
          fi
          tagged=$(awk -F'\t' '$2 != ""' <<< "$versions" | wc -l)
          if [[ -n "$PR" && "$tagged" -eq 1 ]] && awk -F'\t' -v t="pr-$PR" '$2 == t' <<< "$versions" | grep -q .; then
            echo "pr-$PR is the only tagged image; deleting the package."
            gh api --method DELETE "$PACKAGE"
            exit 0
          fi
          while IFS=$'\t' read -r id tags; do
            if [[ -z "$tags" || ( -n "$PR" && "$tags" == "pr-$PR" ) ]]; then
              echo "Deleting image version $id (${tags:-untagged})"
              gh api --method DELETE "$PACKAGE/versions/$id"
            fi
          done <<< "$versions"

      - name: Delete artifacts
        if: ${{ !cancelled() && steps.pr.outputs.branch != '' }}
        env:
          BRANCH: ${{ steps.pr.outputs.branch }}
        run: |
          set -euo pipefail
          gh api --paginate "repos/$GH_REPO/actions/artifacts" \
            --jq ".artifacts[] | select(.workflow_run.head_branch == \"$BRANCH\") | [.id, .name] | @tsv" |
          while IFS=$'\t' read -r id name; do
            echo "Deleting artifact $id ($name)"
            gh api --method DELETE "repos/$GH_REPO/actions/artifacts/$id"
          done

      - name: Delete caches
        if: ${{ !cancelled() && env.PR != '' }}
        run: gh cache delete --all --ref "refs/pull/$PR/merge" --succeed-on-no-caches
