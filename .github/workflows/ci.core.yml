name: ci-core

permissions:
  contents: read

concurrency:
  group: medilab-ci-core-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
  workflow_dispatch:

env:
  MEDILAB_ODOO_IMAGE: medilab-odoo:ci

jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      contents: read
      pull-requests: read
    outputs:
      relevant: ${{ steps.result.outputs.relevant }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Detect changed files
        id: filter
        uses: dorny/paths-filter@v4
        with:
          list-files: shell
          filters: |
            core:
              - "src/core/**"
              - "tools/dockerfiles/**"
              - ".github/actions/odoo-lint/**"
              - ".github/workflows/ci.core.yml"

      - name: Ignore Markdown under src/core
        id: result
        env:
          FILES: ${{ steps.filter.outputs.core_files }}
        run: |
          relevant=false
          for f in $FILES; do
            case "$f" in
              src/core/*.md) ;;
              *) relevant=true ;;
            esac
          done
          echo "relevant=$relevant" >> "$GITHUB_OUTPUT"

  lint:
    needs: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          sparse-checkout: |
            src/core/modules
            .github/actions/odoo-lint
            tools/lint

      - name: Odoo lint
        if: needs.changes.outputs.relevant == 'true' || github.event_name == 'workflow_dispatch'
        uses: ./.github/actions/odoo-lint
        with:
          addons-path: src/core/modules

  build:
    needs: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        if: needs.changes.outputs.relevant == 'true' || github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v7
        with:
          sparse-checkout: |
            src/core
            tools/dockerfiles

      - name: Set up Docker Build
        if: needs.changes.outputs.relevant == 'true' || github.event_name == 'workflow_dispatch'
        uses: docker/setup-buildx-action@v4

      - name: Build image
        if: needs.changes.outputs.relevant == 'true' || github.event_name == 'workflow_dispatch'
        uses: docker/build-push-action@v7
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: .
          file: tools/dockerfiles/prod.dockerfile
          tags: ${{ env.MEDILAB_ODOO_IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          sbom: false

  test:
    needs: [changes, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        if: needs.changes.outputs.relevant == 'true' || github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v7

      - name: Set up Task
        if: needs.changes.outputs.relevant == 'true' || github.event_name == 'workflow_dispatch'
        uses: arduino/setup-task@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Build
        if: needs.changes.outputs.relevant == 'true' || github.event_name == 'workflow_dispatch'
        uses: docker/setup-buildx-action@v4

      - name: Build image from cache
        if: needs.changes.outputs.relevant == 'true' || github.event_name == 'workflow_dispatch'
        uses: docker/build-push-action@v7
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: .
          file: tools/dockerfiles/prod.dockerfile
          tags: ${{ env.MEDILAB_ODOO_IMAGE }}
          load: true
          cache-from: type=gha
          provenance: false
          sbom: false

      - name: Odoo module tests
        if: needs.changes.outputs.relevant == 'true' || github.event_name == 'workflow_dispatch'
        run: task test:core

      - name: Upload coverage report
        if: always() && (needs.changes.outputs.relevant == 'true' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: src/core/modules/coverage.xml
          if-no-files-found: ignore
          retention-days: 1

  sonarqube:
    needs: [changes, test]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - name: Reject fork pull request
        if: github.event.pull_request.head.repo.fork == true
        run: |
          echo "::error::SonarQube Cloud needs repository secrets, which fork pull requests cannot read. Push the branch to this repository and open the pull request from it."
          exit 1

      - name: Checkout
        if: github.event.pull_request.head.repo.fork != true && (needs.changes.outputs.relevant == 'true' || github.event_name == 'workflow_dispatch')
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download coverage report
        if: github.event.pull_request.head.repo.fork != true && (needs.changes.outputs.relevant == 'true' || github.event_name == 'workflow_dispatch')
        uses: actions/download-artifact@v8
        with:
          name: coverage
          path: src/core/modules

      - name: SonarQube Cloud scan
        if: github.event.pull_request.head.repo.fork != true && (needs.changes.outputs.relevant == 'true' || github.event_name == 'workflow_dispatch')
        uses: SonarSource/sonarqube-scan-action@v8.3.0
        env:
          SONAR_HOST_URL: https://sonarcloud.io
        with:
          args: >
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=300
