name: ci-core

permissions:
  contents: read

concurrency:
  group: medilab-ci-core-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    paths:
      - "src/core/**"
      - "!src/core/**/*.md"
      - "tools/dockerfiles/**"
      - ".github/workflows/ci.core.yml"
  workflow_dispatch:

jobs:
  build:
    name: "ci-build"
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          sparse-checkout: |
            src/core
            tools/dockerfiles

      - name: Set up Docker Build
        uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: tools/dockerfiles/prod.dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          sbom: false
