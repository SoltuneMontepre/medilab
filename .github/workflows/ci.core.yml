name: ci-core

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: medilab-ci-core-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    paths:
      - "src/core/**"
      - "!src/core/**/*.md"
      - "tools/dockerfiles/**"
      - ".github/workflows/ci.core.yml"
    types: [opened, synchronize, reopened]

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          sparse-checkout: |
            src/core
            tools/dockerfiles

      - name: Set up Docker Build
        uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: tools/dockerfiles/prod.dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          sbom: false

  sonar:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    if: github.event.pull_request.head.repo.full_name == github.repository
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - name: Checkout
        if: steps.token.outputs.present == 'true'
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: SonarQube Cloud scan
        if: steps.token.outputs.present == 'true'
        uses: SonarSource/sonarqube-scan-action@v8.3.0
        env:
          SONAR_HOST_URL: https://sonarcloud.io
        with:
          args: >
            -Dsonar.organization=soltunemontepre
            -Dsonar.projectKey=SoltuneMontepre_medilab
