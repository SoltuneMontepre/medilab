name: ci-core

permissions:
  contents: read

concurrency:
  group: medilab-ci-core-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
  workflow_dispatch:

env:
  MEDILAB_ODOO_IMAGE: medilab-odoo:ci

jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      contents: read
      pull-requests: read
    outputs:
      relevant: ${{ steps.result.outputs.relevant }}
      scan: ${{ steps.result.outputs.relevant == 'true' || steps.filter.outputs.ai == 'true' }}
      tooling: ${{ steps.filter.outputs.tooling }}
      e2e: ${{ steps.result.outputs.relevant == 'true' || steps.filter.outputs.e2e == 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Detect changed files
        id: filter
        uses: dorny/paths-filter@v4
        with:
          list-files: shell
          filters: |
            core:
              - "src/core/**"
              - "tools/dockerfiles/**"
              - "tools/typecheck/**"
              - "tools/taskfiles/dev.taskfile.yml"
              - "tools/taskfiles/test.taskfile.yml"
              - "tools/scripts/**"
              - "tools/infrastructure/docker-compose.yml"
              - "pyrightconfig.json"
              - ".github/actions/odoo-lint/**"
              - ".github/workflows/ci.core.yml"
            tooling:
              - "tools/typecheck/**"
              - ".github/workflows/ci.core.yml"
            e2e:
              - "src/tests/**"
            ai:
              - "tools/odoo-intelligence/**"
              - "tools/taskfiles/ai.taskfile.yml"
              - ".github/workflows/ci.ai.yml"

      - name: Ignore Markdown under src/core
        id: result
        env:
          FILES: ${{ steps.filter.outputs.core_files }}
        run: |
          relevant=false
          for f in $FILES; do
            case "$f" in
              src/core/*.md) ;;
              *) relevant=true ;;
            esac
          done
          echo "relevant=$relevant" >> "$GITHUB_OUTPUT"

  lint:
    needs: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          sparse-checkout: |
            src/core
            .github/actions/odoo-lint
            tools/lint
            tools/scripts
            tools/taskfiles
            tools/typecheck

      - name: Set up uv
        if: needs.changes.outputs.relevant == 'true' || github.event_name == 'workflow_dispatch'
        uses: astral-sh/setup-uv@v10.3.0

      - name: Set up Task
        if: needs.changes.outputs.relevant == 'true' || github.event_name == 'workflow_dispatch'
        uses: arduino/setup-task@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Python environment and Odoo source
        if: needs.changes.outputs.relevant == 'true' || github.event_name == 'workflow_dispatch'
        run: task dev:setup

      - name: Typecheck
        if: needs.changes.outputs.relevant == 'true' || github.event_name == 'workflow_dispatch'
        run: task typecheck

      - name: Typecheck tests
        if: needs.changes.outputs.relevant == 'true' || github.event_name == 'workflow_dispatch'
        run: task test:typecheck

      - name: Odoo lint
        if: needs.changes.outputs.relevant == 'true' || github.event_name == 'workflow_dispatch'
        uses: ./.github/actions/odoo-lint
        with:
          addons-path: src/core/modules

  tooling:
    name: tooling (${{ matrix.label }})
    needs: changes
    strategy:
      matrix:
        include:
          - os: ubuntu-24.04
            label: Linux
          - os: windows-2025
            label: Windows
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        if: needs.changes.outputs.tooling == 'true' || github.event_name == 'workflow_dispatch'
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Addon link safety tests
        if: needs.changes.outputs.tooling == 'true' || github.event_name == 'workflow_dispatch'
        run: python -m unittest discover -s tools/typecheck -p test_link_addons.py

      - name: Pyright report tests
        if: needs.changes.outputs.tooling == 'true' || github.event_name == 'workflow_dispatch'
        run: python -m unittest discover -s tools/typecheck -p test_pyright_report.py

  build:
    needs: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        if: needs.changes.outputs.relevant == 'true' || github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v7
        with:
          sparse-checkout: |
            src/core
            tools/dockerfiles

      - name: Set up Docker Build
        if: needs.changes.outputs.relevant == 'true' || github.event_name == 'workflow_dispatch'
        uses: docker/setup-buildx-action@v4

      - name: Build image
        if: needs.changes.outputs.relevant == 'true' || github.event_name == 'workflow_dispatch'
        uses: docker/build-push-action@v7
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: .
          file: tools/dockerfiles/prod.dockerfile
          tags: ${{ env.MEDILAB_ODOO_IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          sbom: false

  test-runner:
    name: test (${{ matrix.part }})
    needs: [changes, build]
    if: needs.changes.outputs.relevant == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - part: 1/3
            args: RUNNER=1 RUNNERS=3 EXCLUDE=sol_demo INSTALL_COVERAGE=false
          - part: 2/3
            args: RUNNER=2 RUNNERS=3 EXCLUDE=sol_demo INSTALL_COVERAGE=false
          - part: 3/3
            args: RUNNER=3 RUNNERS=3 EXCLUDE=sol_demo INSTALL_COVERAGE=false
          - part: install
            args: TEST_MODULES=sol_demo
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Task
        uses: arduino/setup-task@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Build
        uses: docker/setup-buildx-action@v4

      - name: Build image from cache
        uses: docker/build-push-action@v7
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: .
          file: tools/dockerfiles/prod.dockerfile
          tags: ${{ env.MEDILAB_ODOO_IMAGE }}
          load: true
          cache-from: type=gha
          provenance: false
          sbom: false

      - name: Odoo module tests
        run: task test:core ${{ matrix.args }} COVERAGE_DIR=.local/coverage

      - name: Upload coverage data
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-data-${{ strategy.job-index }}
          path: .local/coverage
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 1

  e2e:
    needs: [changes, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      COMPOSE_FILE: tools/infrastructure/docker-compose.yml
      NO_COLOR: 1
    steps:
      - name: Checkout
        if: needs.changes.outputs.e2e == 'true' || github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v7

      - name: Set up Task
        if: needs.changes.outputs.e2e == 'true' || github.event_name == 'workflow_dispatch'
        uses: arduino/setup-task@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Bun
        if: needs.changes.outputs.e2e == 'true' || github.event_name == 'workflow_dispatch'
        uses: oven-sh/setup-bun@v2

      - name: Set up Docker Build
        if: needs.changes.outputs.e2e == 'true' || github.event_name == 'workflow_dispatch'
        uses: docker/setup-buildx-action@v4

      - name: Build image from cache
        if: needs.changes.outputs.e2e == 'true' || github.event_name == 'workflow_dispatch'
        uses: docker/build-push-action@v7
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: .
          file: tools/dockerfiles/prod.dockerfile
          tags: ${{ env.MEDILAB_ODOO_IMAGE }}
          load: true
          cache-from: type=gha
          provenance: false
          sbom: false

      - name: Start Odoo with demo data
        if: needs.changes.outputs.e2e == 'true' || github.event_name == 'workflow_dispatch'
        run: task test:e2e:app

      - name: Browser tests
        if: needs.changes.outputs.e2e == 'true' || github.event_name == 'workflow_dispatch'
        run: task test:e2e

      - name: Odoo log
        if: failure() && (needs.changes.outputs.e2e == 'true' || github.event_name == 'workflow_dispatch')
        run: docker compose logs --no-color odoo

  test:
    needs: [changes, test-runner, e2e]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Check the test runners
        if: needs.changes.outputs.relevant == 'true' || github.event_name == 'workflow_dispatch'
        env:
          RESULT: ${{ needs.test-runner.result }}
        run: |
          if [ "$RESULT" != success ]; then
            echo "::error::The test runners finished with result $RESULT."
            exit 1
          fi

      - name: Check the browser tests
        env:
          RESULT: ${{ needs.e2e.result }}
        run: |
          if [ "$RESULT" != success ]; then
            echo "::error::The browser tests finished with result $RESULT."
            exit 1
          fi

  coverage:
    needs: [changes, test-runner]
    if: needs.changes.outputs.relevant == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Task
        uses: arduino/setup-task@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download coverage data
        uses: actions/download-artifact@v8
        with:
          pattern: coverage-data-*
          merge-multiple: true
          path: .local/coverage

      - name: Combine coverage
        run: task test:core:coverage COVERAGE_DIR=.local/coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: src/core/modules/coverage.xml
          retention-days: 1

  sonarqube:
    needs: [changes, test, coverage]
    if: ${{ !cancelled() && needs.test.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - name: Reject fork pull request
        if: github.event.pull_request.head.repo.fork == true
        run: |
          echo "::error::SonarQube Cloud needs repository secrets, which fork pull requests cannot read. Push the branch to this repository and open the pull request from it."
          exit 1

      - name: Checkout
        if: github.event.pull_request.head.repo.fork != true && (needs.changes.outputs.scan == 'true' || github.event_name == 'workflow_dispatch')
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download coverage report
        if: github.event.pull_request.head.repo.fork != true && (needs.changes.outputs.relevant == 'true' || github.event_name == 'workflow_dispatch')
        uses: actions/download-artifact@v8
        with:
          name: coverage
          path: src/core/modules

      - name: SonarQube Cloud scan
        if: github.event.pull_request.head.repo.fork != true && (needs.changes.outputs.scan == 'true' || github.event_name == 'workflow_dispatch')
        uses: SonarSource/sonarqube-scan-action@v8.3.0
        env:
          SONAR_HOST_URL: https://sonarcloud.io
        with:
          args: >
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=300
