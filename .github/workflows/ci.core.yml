name: ci-core

permissions:
  contents: read

concurrency:
  group: medilab-ci-core-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
  workflow_dispatch:

jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      contents: read
      pull-requests: read
    outputs:
      relevant: ${{ steps.result.outputs.relevant }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Detect changed files
        id: filter
        uses: dorny/paths-filter@v4
        with:
          list-files: shell
          filters: |
            core:
              - "src/core/**"
              - "tools/dockerfiles/**"
              - ".github/actions/odoo-lint/**"
              - ".github/workflows/ci.core.yml"

      - name: Ignore Markdown under src/core
        id: result
        env:
          FILES: ${{ steps.filter.outputs.core_files }}
        run: |
          relevant=false
          for f in $FILES; do
            case "$f" in
              src/core/*.md) ;;
              *) relevant=true ;;
            esac
          done
          echo "relevant=$relevant" >> "$GITHUB_OUTPUT"

  lint:
    needs: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          sparse-checkout: |
            src/core/modules
            .github/actions/odoo-lint
            tools/lint

      - name: Odoo lint
        if: needs.changes.outputs.relevant == 'true' || github.event_name == 'workflow_dispatch'
        uses: ./.github/actions/odoo-lint
        with:
          addons-path: src/core/modules

  build:
    needs: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        if: needs.changes.outputs.relevant == 'true' || github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v7
        with:
          sparse-checkout: |
            src/core
            tools/dockerfiles

      - name: Set up Docker Build
        if: needs.changes.outputs.relevant == 'true' || github.event_name == 'workflow_dispatch'
        uses: docker/setup-buildx-action@v4

      - name: Build image
        if: needs.changes.outputs.relevant == 'true' || github.event_name == 'workflow_dispatch'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: tools/dockerfiles/prod.dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          sbom: false

  sonarqube:
    needs: changes
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - name: Checkout
        if: needs.changes.outputs.relevant == 'true' || github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: SonarQube Cloud scan
        if: needs.changes.outputs.relevant == 'true' || github.event_name == 'workflow_dispatch'
        uses: SonarSource/sonarqube-scan-action@v8.3.0
        env:
          SONAR_HOST_URL: https://sonarcloud.io
