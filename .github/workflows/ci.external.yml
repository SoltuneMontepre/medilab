name: ci-external

permissions:
  contents: read

concurrency:
  group: medilab-ci-external-${{ github.ref }}
  cancel-in-progress: true

on:
  merge_group:

jobs:
  gitguardian:
    name: GitGuardian Security Checks
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Rely on the pull request check
        run: echo "GitGuardian Security Checks passed on the pull request."

  naming-branch:
    name: Naming conventions / Branch
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Rely on the pull request check
        run: echo "Naming conventions / Branch passed on the pull request."

  naming-pull-request:
    name: Naming conventions / Pull request
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Rely on the pull request check
        run: echo "Naming conventions / Pull request passed on the pull request."
