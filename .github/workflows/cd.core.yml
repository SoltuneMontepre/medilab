name: cd-core

permissions:
  contents: read

concurrency:
  group: medilab-cd-core
  cancel-in-progress: false

on:
  push:
    branches:
      - main
    paths:
      - "src/core/**"
      - "tools/dockerfiles/**"
      - ".github/workflows/cd.core.yml"
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
    inputs:
      release:
        description: "Release the newest image at once, in either mode"
        type: boolean
        default: false

env:
  IMAGE: ghcr.io/soltunemontepre/medilab
  KUSTOMIZATION: infra/cluster/odoo/kustomization.yaml

jobs:
  publish:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          sparse-checkout: |
            src/core
            tools/dockerfiles

      - name: Set up Docker Build
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,format=long
            type=raw,value=latest

      - name: Build and push image
        uses: docker/build-push-action@v7
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: .
          file: tools/dockerfiles/prod.dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          sbom: false

  release:
    needs: publish
    if: ${{ !cancelled() && needs.publish.result != 'failure' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      packages: read
      pull-requests: read
    outputs:
      released: ${{ steps.release.outputs.released }}
      release: ${{ steps.release.outputs.release }}
      previous: ${{ steps.release.outputs.previous }}
      commit: ${{ steps.release.outputs.commit }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 50

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Release
        id: release
        env:
          EVENT: ${{ github.event_name }}
          FORCE: ${{ inputs.release || false }}
          RELEASE_MODE: ${{ vars.RELEASE_MODE || 'continuous' }}
          RELEASE_DAYS: ${{ vars.RELEASE_DAYS || 'Mon-Sun' }}
          RELEASE_HOURS: ${{ vars.RELEASE_HOURS || '23-5' }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          bash tools/scripts/cd_core_release.sh

  verify:
    needs: release
    if: needs.release.outputs.released == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Install the Argo CD CLI
        run: |
          curl -sSfL -o /usr/local/bin/argocd "https://github.com/argoproj/argo-cd/releases/download/${ARGOCD_VERSION}/argocd-linux-amd64"
          chmod +x /usr/local/bin/argocd
        env:
          ARGOCD_VERSION: v3.5.5

      - name: Wait for the release
        env:
          RELEASE_COMMIT: ${{ needs.release.outputs.commit }}
          TIMEOUT: "900"
          ARGOCD_SERVER: ${{ vars.ARGOCD_SERVER }}
          ARGOCD_AUTH_TOKEN: ${{ secrets.ARGOCD_AUTH_TOKEN }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: bash tools/scripts/cd_core_verify.sh

  rollback:
    needs: [release, verify]
    if: ${{ failure() && needs.verify.result == 'failure' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Install the Argo CD CLI
        run: |
          curl -sSfL -o /usr/local/bin/argocd "https://github.com/argoproj/argo-cd/releases/download/${ARGOCD_VERSION}/argocd-linux-amd64"
          chmod +x /usr/local/bin/argocd
        env:
          ARGOCD_VERSION: v3.5.5

      - name: Roll back
        env:
          RELEASE: ${{ needs.release.outputs.release }}
          PREVIOUS: ${{ needs.release.outputs.previous }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          IMAGE_PATHS: src/core tools/dockerfiles
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARGOCD_SERVER: ${{ vars.ARGOCD_SERVER }}
          ARGOCD_AUTH_TOKEN: ${{ secrets.ARGOCD_AUTH_TOKEN }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          bash tools/scripts/cd_core_rollback.sh
