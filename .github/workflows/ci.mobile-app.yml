name: ci-mobile-app

permissions:
  contents: read

concurrency:
  group: medilab-ci-mobile-app-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
  workflow_dispatch:

env:
  MOBILE_APP_DIR: src/applications/medilab-mobile
  NODE_VERSION: 24

jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      contents: read
      pull-requests: read
    outputs:
      relevant: ${{ steps.filter.outputs.relevant == 'true' || github.event_name == 'workflow_dispatch' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Detect relevant changes
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            relevant:
              - "src/applications/medilab-mobile/**"
              - ".github/workflows/ci.mobile-app.yml"

  lint:
    needs: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: write
    defaults:
      run:
        working-directory: ${{ env.MOBILE_APP_DIR }}
    steps:
      - name: Checkout
        if: needs.changes.outputs.relevant == 'true'
        uses: actions/checkout@v7

      - name: Set up Node
        if: needs.changes.outputs.relevant == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Set up Bun
        if: needs.changes.outputs.relevant == 'true'
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        if: needs.changes.outputs.relevant == 'true'
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Type check
        if: needs.changes.outputs.relevant == 'true'
        run: bun run typecheck

      - name: ESLint
        if: needs.changes.outputs.relevant == 'true'
        run: bun run lint

      - name: Stop the run
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run cancel ${{ github.run_id }} --repo ${{ github.repository }}

  build:
    needs: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: write
    defaults:
      run:
        working-directory: ${{ env.MOBILE_APP_DIR }}
    steps:
      - name: Checkout
        if: needs.changes.outputs.relevant == 'true'
        uses: actions/checkout@v7

      - name: Set up Node
        if: needs.changes.outputs.relevant == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Set up Bun
        if: needs.changes.outputs.relevant == 'true'
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        if: needs.changes.outputs.relevant == 'true'
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Bundle for Android and iOS
        if: needs.changes.outputs.relevant == 'true'
        run: bun x expo export --platform android --platform ios

      - name: Stop the run
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run cancel ${{ github.run_id }} --repo ${{ github.repository }}

  test:
    needs: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: write
    defaults:
      run:
        working-directory: ${{ env.MOBILE_APP_DIR }}
    steps:
      - name: Checkout
        if: needs.changes.outputs.relevant == 'true'
        uses: actions/checkout@v7

      - name: Set up Node
        if: needs.changes.outputs.relevant == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Set up Bun
        if: needs.changes.outputs.relevant == 'true'
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        if: needs.changes.outputs.relevant == 'true'
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Tests
        if: needs.changes.outputs.relevant == 'true'
        run: bun run test

      - name: Stop the run
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run cancel ${{ github.run_id }} --repo ${{ github.repository }}
