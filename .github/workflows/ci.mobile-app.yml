name: ci-mobile-app

permissions:
  contents: read

concurrency:
  group: medilab-ci-mobile-app-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
  merge_group:
  workflow_dispatch:

env:
  MOBILE_APP_DIR: src/applications/medilab-mobile
  NODE_VERSION: 24

jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      contents: read
      pull-requests: read
    outputs:
      relevant: ${{ steps.filter.outputs.relevant == 'true' || github.event_name == 'workflow_dispatch' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Detect relevant changes
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            relevant:
              - "src/applications/medilab-mobile/**"
              - ".github/workflows/ci.mobile-app.yml"

  lint:
    needs: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: write
    defaults:
      run:
        working-directory: ${{ env.MOBILE_APP_DIR }}
    steps:
      - name: Checkout
        if: needs.changes.outputs.relevant == 'true'
        uses: actions/checkout@v7

      - name: Set up Node
        if: needs.changes.outputs.relevant == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Set up Bun
        if: needs.changes.outputs.relevant == 'true'
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        if: needs.changes.outputs.relevant == 'true'
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Type check
        if: needs.changes.outputs.relevant == 'true'
        run: bun run typecheck

      - name: ESLint
        if: needs.changes.outputs.relevant == 'true'
        run: bun run lint

      - name: Stop the run
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run cancel ${{ github.run_id }} --repo ${{ github.repository }}

  compile:
    name: compile (${{ matrix.label }})
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: read
      actions: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - label: Android
            platform: android
            os: ubuntu-24.04
          - label: iOS
            platform: ios
            os: macos-26
    defaults:
      run:
        shell: bash
        working-directory: ${{ env.MOBILE_APP_DIR }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Bundle the JavaScript
        run: bun x expo export --platform ${{ matrix.platform }}

      - name: Generate the native project
        run: bun x expo prebuild --platform ${{ matrix.platform }}

      - name: Set up Java
        if: matrix.platform == 'android'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        if: matrix.platform == 'android'
        uses: gradle/actions/setup-gradle@v6

      - name: Build the Android app
        if: matrix.platform == 'android'
        working-directory: ${{ env.MOBILE_APP_DIR }}/android
        run: ./gradlew assembleDebug -PreactNativeArchitectures=arm64-v8a

      - name: Build the iOS app
        if: matrix.platform == 'ios'
        working-directory: ${{ env.MOBILE_APP_DIR }}/ios
        run: >-
          xcodebuild build -quiet
          -workspace MediLab.xcworkspace -scheme MediLab -configuration Debug
          -sdk iphonesimulator -destination "generic/platform=iOS Simulator"
          CODE_SIGNING_ALLOWED=NO

      - name: Stop the run
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run cancel ${{ github.run_id }} --repo ${{ github.repository }}

  build:
    needs: [changes, compile]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Check the change detection
        env:
          RESULT: ${{ needs.changes.result }}
        run: |
          if [ "$RESULT" != success ]; then
            echo "::error::The change detection finished with result $RESULT."
            exit 1
          fi

      - name: Check the platform builds
        if: needs.changes.outputs.relevant == 'true'
        env:
          RESULT: ${{ needs.compile.result }}
        run: |
          if [ "$RESULT" != success ]; then
            echo "::error::The platform builds finished with result $RESULT."
            exit 1
          fi

  test:
    needs: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: write
    defaults:
      run:
        working-directory: ${{ env.MOBILE_APP_DIR }}
    steps:
      - name: Checkout
        if: needs.changes.outputs.relevant == 'true'
        uses: actions/checkout@v7

      - name: Set up Node
        if: needs.changes.outputs.relevant == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Set up Bun
        if: needs.changes.outputs.relevant == 'true'
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        if: needs.changes.outputs.relevant == 'true'
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Tests
        if: needs.changes.outputs.relevant == 'true'
        run: bun run test

      - name: Stop the run
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run cancel ${{ github.run_id }} --repo ${{ github.repository }}
