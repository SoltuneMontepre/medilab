name: ci-mobile-app

permissions:
  contents: read

concurrency:
  group: medilab-ci-mobile-app-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
  workflow_dispatch:
  # The Maestro flows on an Android emulator run every night, not on pull requests.
  schedule:
    - cron: "0 19 * * *"

env:
  MOBILE_APP_DIR: src/applications/medilab-mobile
  NODE_VERSION: 24

jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      contents: read
      pull-requests: read
    outputs:
      relevant: ${{ steps.filter.outputs.relevant == 'true' || github.event_name == 'workflow_dispatch' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # A nightly run has no change to compare; it runs only the Maestro flows.
      - name: Detect relevant changes
        if: github.event_name != 'schedule'
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            relevant:
              - "src/applications/medilab-mobile/**"
              - ".github/workflows/ci.mobile-app.yml"

  lint:
    needs: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: write
    defaults:
      run:
        working-directory: ${{ env.MOBILE_APP_DIR }}
    steps:
      - name: Checkout
        if: needs.changes.outputs.relevant == 'true'
        uses: actions/checkout@v7

      - name: Set up Node
        if: needs.changes.outputs.relevant == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Set up Bun
        if: needs.changes.outputs.relevant == 'true'
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        if: needs.changes.outputs.relevant == 'true'
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Type check
        if: needs.changes.outputs.relevant == 'true'
        run: bun run typecheck

      - name: ESLint
        if: needs.changes.outputs.relevant == 'true'
        run: bun run lint

      - name: Stop the run
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run cancel ${{ github.run_id }} --repo ${{ github.repository }}

  compile:
    name: compile (${{ matrix.label }})
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: read
      actions: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - label: Android
            platform: android
            os: ubuntu-24.04
          - label: iOS
            platform: ios
            os: macos-26
    defaults:
      run:
        shell: bash
        working-directory: ${{ env.MOBILE_APP_DIR }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Bundle the JavaScript
        run: bun x expo export --platform ${{ matrix.platform }}

      - name: Generate the native project
        run: bun x expo prebuild --platform ${{ matrix.platform }}

      - name: Set up Java
        if: matrix.platform == 'android'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        if: matrix.platform == 'android'
        uses: gradle/actions/setup-gradle@v6

      - name: Build the Android app
        if: matrix.platform == 'android'
        working-directory: ${{ env.MOBILE_APP_DIR }}/android
        run: ./gradlew assembleDebug -PreactNativeArchitectures=arm64-v8a

      - name: Build the iOS app
        if: matrix.platform == 'ios'
        working-directory: ${{ env.MOBILE_APP_DIR }}/ios
        run: >-
          xcodebuild build -quiet
          -workspace MediLab.xcworkspace -scheme MediLab -configuration Debug
          -sdk iphonesimulator -destination "generic/platform=iOS Simulator"
          CODE_SIGNING_ALLOWED=NO

      - name: Stop the run
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run cancel ${{ github.run_id }} --repo ${{ github.repository }}

  build:
    needs: [changes, compile]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Check the change detection
        env:
          RESULT: ${{ needs.changes.result }}
        run: |
          if [ "$RESULT" != success ]; then
            echo "::error::The change detection finished with result $RESULT."
            exit 1
          fi

      - name: Check the platform builds
        if: needs.changes.outputs.relevant == 'true'
        env:
          RESULT: ${{ needs.compile.result }}
        run: |
          if [ "$RESULT" != success ]; then
            echo "::error::The platform builds finished with result $RESULT."
            exit 1
          fi

  test:
    needs: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: write
    defaults:
      run:
        working-directory: ${{ env.MOBILE_APP_DIR }}
    steps:
      - name: Checkout
        if: needs.changes.outputs.relevant == 'true'
        uses: actions/checkout@v7

      - name: Set up Node
        if: needs.changes.outputs.relevant == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Set up Bun
        if: needs.changes.outputs.relevant == 'true'
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        if: needs.changes.outputs.relevant == 'true'
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Tests
        if: needs.changes.outputs.relevant == 'true'
        run: bun run test

      - name: Stop the run
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run cancel ${{ github.run_id }} --repo ${{ github.repository }}

  maestro:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      COMPOSE_FILE: tools/infrastructure/docker-compose.yml
      MEDILAB_ODOO_IMAGE: medilab-odoo:ci
      NO_COLOR: 1
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Task
        uses: arduino/setup-task@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Set up Docker Build
        uses: docker/setup-buildx-action@v4

      - name: Build image from cache
        uses: docker/build-push-action@v7
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: .
          file: tools/dockerfiles/prod.dockerfile
          tags: ${{ env.MEDILAB_ODOO_IMAGE }}
          load: true
          cache-from: type=gha
          provenance: false
          sbom: false

      # Odoo checks the PayOS notifications with this key; without the other keys it never calls PayOS.
      - name: Make a PayOS checksum key
        run: echo "PAYOS_CHECKSUM_KEY=$(openssl rand -hex 32)" >> "$GITHUB_ENV"

      - name: Start Odoo with demo data
        run: task test:e2e:app

      - name: Read the lab code of the sample to scan
        run: |
          code=$(docker compose exec -T postgres psql -U root -d medilab -tAc "SELECT s.code FROM medilab_sample s JOIN ir_model_data d ON d.model = 'medilab.sample' AND d.res_id = s.id WHERE d.module = 'sol_demo' AND d.name = 'demo_sample_label_scan'")
          test -n "$code"
          echo "LAB_CODE=$code" >> "$GITHUB_ENV"

      - name: Install dependencies
        working-directory: ${{ env.MOBILE_APP_DIR }}
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Build the Android app
        working-directory: ${{ env.MOBILE_APP_DIR }}
        run: |
          bun x expo prebuild --platform android
          cd android && ./gradlew assembleDebug -PreactNativeArchitectures=x86_64

      - name: Start Metro
        working-directory: ${{ env.MOBILE_APP_DIR }}
        run: |
          nohup bun x expo start --port 8081 > metro.log 2>&1 &
          curl -fsS --retry 30 --retry-delay 5 --retry-all-errors http://localhost:8081/status

      - name: Install Maestro
        run: |
          curl -fsSL https://get.maestro.mobile.dev | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Maestro flows
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          working-directory: ${{ env.MOBILE_APP_DIR }}
          script: |
            adb reverse tcp:8069 tcp:8069
            adb reverse tcp:8081 tcp:8081
            adb install -r android/app/build/outputs/apk/debug/app-debug.apk
            maestro test --env LAB_CODE="$LAB_CODE" --debug-output maestro-output .maestro

      - name: Upload the Maestro output
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: maestro-output
          path: |
            ${{ env.MOBILE_APP_DIR }}/maestro-output
            ${{ env.MOBILE_APP_DIR }}/metro.log
          if-no-files-found: ignore
          retention-days: 1

      - name: Odoo log
        if: failure()
        run: docker compose logs --no-color odoo
