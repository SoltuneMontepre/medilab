name: ci-sync-app

permissions:
  contents: read

concurrency:
  group: medilab-ci-sync-app-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
  workflow_dispatch:

env:
  SYNC_APP_DIR: src/applications/medilab-sync

jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      contents: read
      pull-requests: read
    outputs:
      relevant: ${{ steps.filter.outputs.relevant == 'true' || github.event_name == 'workflow_dispatch' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Detect relevant changes
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            relevant:
              - "src/applications/medilab-sync/**"
              - "src/core/modules/sol_laboratory/api/openapi.yaml"
              - "src/core/modules/sol_laboratory/api/sync-updates.openapi.yaml"
              - "src/applications/medilab-mobile/**"
              - "tools/scripts/test_apps.sh"
              - "tools/scripts/host_tools.py"
              - "tools/scripts/sync*.py"
              - "tools/scripts/test_sync*.py"
              - "tools/taskfiles/sync.taskfile.yml"
              - "tools/taskfiles/test.taskfile.yml"
              - "taskfile.yml"
              - ".github/workflows/ci.sync-app.yml"

  lint:
    needs: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ${{ env.SYNC_APP_DIR }}
    steps:
      - name: Checkout
        if: needs.changes.outputs.relevant == 'true'
        uses: actions/checkout@v7

      - name: Set up Rust
        if: needs.changes.outputs.relevant == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust format
        if: needs.changes.outputs.relevant == 'true'
        run: cargo fmt --check --manifest-path src-tauri/Cargo.toml

      - name: Set up Bun
        if: needs.changes.outputs.relevant == 'true'
        uses: oven-sh/setup-bun@v2

      - name: Install frontend dependencies
        if: needs.changes.outputs.relevant == 'true'
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Frontend type check
        if: needs.changes.outputs.relevant == 'true'
        run: bun run tsc

      - name: Cache Rust build
        if: needs.changes.outputs.relevant == 'true'
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "${{ env.SYNC_APP_DIR }}/src-tauri -> target"
          key: lint

      - name: Install Linux build dependencies
        if: needs.changes.outputs.relevant == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: Stand in for the built frontend
        if: needs.changes.outputs.relevant == 'true'
        run: mkdir -p dist && touch dist/index.html

      - name: Clippy
        if: needs.changes.outputs.relevant == 'true'
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --all-features -- -D warnings

  compile:
    name: compile (${{ matrix.label }})
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: true
      matrix:
        include:
          - label: Linux
            os: ubuntu-24.04
            shell: bash
          - label: Windows
            os: windows-2025
            shell: pwsh
          - label: macOS
            os: macos-15
            shell: bash
    defaults:
      run:
        shell: ${{ matrix.shell }}
        working-directory: ${{ env.SYNC_APP_DIR }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "${{ env.SYNC_APP_DIR }}/src-tauri -> target"
          key: compile-${{ matrix.label }}

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Build the frontend
        run: bun run build

      - name: Build the app
        if: runner.os != 'Windows'
        run: cargo build --locked --manifest-path src-tauri/Cargo.toml

      - name: Set up Task for native Windows entrypoints
        if: runner.os == 'Windows'
        uses: arduino/setup-task@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Exclude external Bash from native Windows Sync checks
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $medilabBlockedShellPath = '(?i)[\\/]Git[\\/](usr[\\/]bin|bin)([\\/]|$)|[\\/]msys64[\\/]'
          foreach ($sample in @('C:\Program Files\Git\usr\bin', 'C:\Program Files\Git\bin', 'C:/Program Files/Git/usr/bin', 'C:\msys64\usr\bin')) {
            if ($sample -notmatch $medilabBlockedShellPath) { throw 'External Bash path detection failed its native path contract.' }
          }
          if ('C:\Program Files\Git\cmd' -match $medilabBlockedShellPath) { throw 'Native Git cmd must remain available.' }
          $paths = @($env:PATH -split ';' | Where-Object { $_ -notmatch $medilabBlockedShellPath })
          if (@($paths | Where-Object { $_ -match $medilabBlockedShellPath }).Count -ne 0) { throw 'Native Windows PATH still exposes external Bash directories.' }
          $guard = Join-Path $env:RUNNER_TEMP 'medilab-native-shell-guard'
          New-Item -ItemType Directory -Force $guard | Out-Null
          foreach ($name in @('bash', 'sh')) {
            Set-Content -Path (Join-Path $guard "$name.cmd") -Value '@exit /b 97'
          }
          Add-Content $env:GITHUB_ENV ('PATH=' + $guard + ';' + ($paths -join ';'))
          Add-Content $env:GITHUB_ENV 'PYTHONUTF8=1'

      - name: Set up Python for native Windows entrypoints
        if: runner.os == 'Windows'
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Check native Windows Sync through Task
        if: runner.os == 'Windows'
        working-directory: .
        run: task sync:check

      - name: Package native Windows Sync through Task
        if: runner.os == 'Windows'
        working-directory: .
        run: task sync:build

  build:
    needs: [changes, compile]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Check the change detection
        env:
          RESULT: ${{ needs.changes.result }}
        run: |
          if [ "$RESULT" != success ]; then
            echo "::error::The change detection finished with result $RESULT."
            exit 1
          fi

      - name: Check the platform builds
        if: needs.changes.outputs.relevant == 'true'
        env:
          RESULT: ${{ needs.compile.result }}
        run: |
          if [ "$RESULT" != success ]; then
            echo "::error::The platform builds finished with result $RESULT."
            exit 1
          fi

  test-runner:
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Task
        uses: arduino/setup-task@v3

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "${{ env.SYNC_APP_DIR }}/src-tauri -> target"
          key: test

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: Build the frontend
        working-directory: ${{ env.SYNC_APP_DIR }}
        run: |
          bun install --frozen-lockfile --ignore-scripts
          bun run build

      - name: Verify Rust availability
        run: cargo --version

      - name: Application tests
        run: task test:apps

  test:
    needs: [changes, test-runner]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Check the change detection
        env:
          RESULT: ${{ needs.changes.result }}
        run: |
          if [ "$RESULT" != success ]; then
            echo "::error::The change detection finished with result $RESULT."
            exit 1
          fi

      - name: Check the tests
        if: needs.changes.outputs.relevant == 'true'
        env:
          RESULT: ${{ needs.test-runner.result }}
        run: |
          if [ "$RESULT" != success ]; then
            echo "::error::The tests finished with result $RESULT."
            exit 1
          fi
