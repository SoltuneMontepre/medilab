name: ci-sync-app

permissions:
  contents: read

concurrency:
  group: medilab-ci-sync-app-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
  workflow_dispatch:

env:
  SYNC_APP_DIR: src/applications/medilab-sync

jobs:
  sync-app:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
    defaults:
      run:
        working-directory: ${{ env.SYNC_APP_DIR }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Detect relevant changes
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            relevant:
              - "src/applications/medilab-sync/**"
              - ".github/workflows/ci.sync-app.yml"

      - name: Set up Rust
        if: steps.filter.outputs.relevant == 'true' || github.event_name == 'workflow_dispatch'
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust build
        if: steps.filter.outputs.relevant == 'true' || github.event_name == 'workflow_dispatch'
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "${{ env.SYNC_APP_DIR }}/src-tauri -> target"

      - name: Rust format
        if: steps.filter.outputs.relevant == 'true' || github.event_name == 'workflow_dispatch'
        run: cargo fmt --check --manifest-path src-tauri/Cargo.toml

      - name: Install Linux build dependencies
        if: steps.filter.outputs.relevant == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: Set up Bun
        if: steps.filter.outputs.relevant == 'true' || github.event_name == 'workflow_dispatch'
        uses: oven-sh/setup-bun@v2

      - name: Install frontend dependencies
        if: steps.filter.outputs.relevant == 'true' || github.event_name == 'workflow_dispatch'
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Frontend tests
        if: steps.filter.outputs.relevant == 'true' || github.event_name == 'workflow_dispatch'
        run: bun test

      - name: Build frontend
        if: steps.filter.outputs.relevant == 'true' || github.event_name == 'workflow_dispatch'
        run: bun run build

      - name: Clippy
        if: steps.filter.outputs.relevant == 'true' || github.event_name == 'workflow_dispatch'
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --all-features -- -D warnings

      - name: Rust tests
        if: steps.filter.outputs.relevant == 'true' || github.event_name == 'workflow_dispatch'
        run: cargo test --manifest-path src-tauri/Cargo.toml
