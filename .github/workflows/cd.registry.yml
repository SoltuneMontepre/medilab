name: cd-registry

permissions:
  contents: read

concurrency:
  group: medilab-cd-registry
  cancel-in-progress: false

on:
  pull_request:
    types: [closed]
  workflow_dispatch:

jobs:
  cleanup:
    if: github.event.pull_request.head.repo.fork != true
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      packages: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PACKAGE: orgs/${{ github.repository_owner }}/packages/container/medilab-odoo
      TAG: ${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || '' }}
    steps:
      - name: Delete the pull request image and untagged images
        run: |
          set -euo pipefail
          gh api --paginate "$PACKAGE/versions" \
            --jq '.[] | [.id, (.metadata.container.tags | join(","))] | @tsv' |
          while IFS=$'\t' read -r id tags; do
            if [[ -z "$tags" || ( -n "$TAG" && "$tags" == "$TAG" ) ]]; then
              echo "Deleting version $id (${tags:-untagged})"
              gh api --method DELETE "$PACKAGE/versions/$id"
            fi
          done
