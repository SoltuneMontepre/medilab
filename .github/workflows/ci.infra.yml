name: ci-infra

permissions:
  contents: read

concurrency:
  group: medilab-ci-infra-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
  workflow_dispatch:

jobs:
  terraform:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    defaults:
      run:
        working-directory: infra
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Detect relevant changes
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            relevant:
              - "infra/**"
              - ".github/workflows/ci.infra.yml"

      - name: Setup Terraform
        if: steps.filter.outputs.relevant == 'true' || github.event_name == 'workflow_dispatch'
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.15.8
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}

      - name: Terraform fmt check
        if: steps.filter.outputs.relevant == 'true' || github.event_name == 'workflow_dispatch'
        run: terraform fmt -check -diff -recursive

      - name: Terraform init
        if: steps.filter.outputs.relevant == 'true' || github.event_name == 'workflow_dispatch'
        run: terraform init

      - name: Terraform validate
        if: steps.filter.outputs.relevant == 'true' || github.event_name == 'workflow_dispatch'
        run: terraform validate

      - name: Terraform plan
        if: steps.filter.outputs.relevant == 'true' || github.event_name == 'workflow_dispatch'
        run: terraform plan
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}

  ansible:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Detect relevant changes
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            relevant:
              - "infra/ansible/**"
              - "tools/ansible/**"
              - "tools/scripts/check_origin_isolation.sh"
              - "tools/scripts/test_origin_isolation.py"
              - ".github/workflows/ci.infra.yml"

      - name: Set up Docker Build
        if: steps.filter.outputs.relevant == 'true' || github.event_name == 'workflow_dispatch'
        uses: docker/setup-buildx-action@v4

      - name: Build Ansible image
        if: steps.filter.outputs.relevant == 'true' || github.event_name == 'workflow_dispatch'
        uses: docker/build-push-action@v7
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: .
          file: tools/ansible/ansible.dockerfile
          tags: medilab-ansible:local
          load: true
          cache-from: type=gha,scope=ansible
          cache-to: type=gha,mode=max,scope=ansible

      - name: Ansible lint
        if: steps.filter.outputs.relevant == 'true' || github.event_name == 'workflow_dispatch'
        run: docker run --rm -v "$PWD:/work" medilab-ansible:local ansible-lint

      - name: Origin isolation regression tests
        if: steps.filter.outputs.relevant == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          bash -n tools/scripts/check_origin_isolation.sh
          python3 -m unittest discover -s tools/scripts -p test_origin_isolation.py

  onlyoffice:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Detect relevant changes
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            relevant:
              - "infra/cluster/**"
              - "tools/infrastructure/onlyoffice/**"
              - "src/applications/medilab-sync/docker-compose.yml"
              - "tools/infrastructure/docker-compose.yml"
              - ".github/workflows/ci.infra.yml"

      - name: Install validation dependencies
        if: steps.filter.outputs.relevant == 'true' || github.event_name == 'workflow_dispatch'
        run: 'python3 -m pip install --only-binary :all: PyYAML==6.0.3 jsonschema==4.26.0'

      - name: Check ONLYOFFICE configuration contracts
        if: steps.filter.outputs.relevant == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          for script in tools/infrastructure/onlyoffice/*.sh infra/cluster/onlyoffice/*.sh; do bash -n "$script"; done
          python3 -m unittest discover -s tools/infrastructure/onlyoffice -p 'test_*.py'
          node --check infra/cluster/onlyoffice/worker-bootstrap.cjs
          node --test tools/infrastructure/onlyoffice/test_callback_signing.cjs
          kubectl kustomize infra/cluster/onlyoffice > /tmp/onlyoffice.yaml
          kubectl kustomize infra/cluster/onlyoffice-integration > /tmp/onlyoffice-odoo.yaml
          kubectl kustomize infra/cluster/onlyoffice-edge > /tmp/onlyoffice-edge.yaml
          kubectl kustomize infra/cluster/onlyoffice-monitor > /tmp/onlyoffice-monitor.yaml

      - name: Validate Kubernetes and custom-resource schemas
        if: steps.filter.outputs.relevant == 'true' || github.event_name == 'workflow_dispatch'
        run: bash tools/infrastructure/onlyoffice/validate.sh

      - name: Validate isolated Compose merge
        if: steps.filter.outputs.relevant == 'true' || github.event_name == 'workflow_dispatch'
        env:
          ONLYOFFICE_JWT_SECRET: ci-configuration-validation-secret-with-no-service-access
          ONLYOFFICE_TLS_DIR: /tmp/onlyoffice-tls
          ONLYOFFICE_CA_DIR: /tmp/onlyoffice-ca
        run: |
          docker compose -p onlyoffice-config-validation \
            -f tools/infrastructure/docker-compose.yml \
            -f src/applications/medilab-sync/docker-compose.yml config --quiet

  cloudbeaver:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Detect relevant changes
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            relevant:
              - "infra/cluster/cloudbeaver/**"
              - "tools/cloudbeaver/**"
              - ".github/workflows/ci.infra.yml"

      - name: Pull regression images
        if: steps.filter.outputs.relevant == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          docker pull docker.io/dbeaver/cloudbeaver:26.2.2
          docker pull docker.io/library/postgres:18.4

      - name: CloudBeaver regression tests
        if: steps.filter.outputs.relevant == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          bash -n infra/cluster/cloudbeaver/bootstrap/prepare.sh
          bash -n infra/cluster/cloudbeaver/bootstrap/start.sh
          bash -n infra/cluster/cloudbeaver/bootstrap/ready.sh
          python3 -m unittest discover -s tools/cloudbeaver -v

      - name: Create disposable Kubernetes cluster
        if: steps.filter.outputs.relevant == 'true' || github.event_name == 'workflow_dispatch'
        uses: helm/kind-action@v1
        with:
          version: v0.33.0
          kubectl_version: v1.36.4
          node_image: kindest/node:v1.36.4@sha256:099e049362a1526b2db71494e1947aae99bd16290d7c895f2b7ea312e3cbfaed
          cluster_name: medilab-286-review
          kubeconfig: ${{ runner.temp }}/medilab-286-kind-config

      - name: Load Kubernetes regression images
        if: steps.filter.outputs.relevant == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          docker pull docker.io/library/python:3.12.13-slim
          docker pull docker.io/library/traefik:v3.7.13
          kind load docker-image --name medilab-286-review docker.io/dbeaver/cloudbeaver:26.2.2 docker.io/library/postgres:18.4 docker.io/library/python:3.12.13-slim docker.io/library/traefik:v3.7.13

      - name: Kubernetes lifecycle regression tests
        if: steps.filter.outputs.relevant == 'true' || github.event_name == 'workflow_dispatch'
        env:
          MEDILAB_KUBE_TEST_CONFIG: ${{ runner.temp }}/medilab-286-kind-config
        run: python3 -m unittest discover -s tools/cloudbeaver -p test_kubernetes.py -v

  infrastructure:
    needs: [terraform, ansible, onlyoffice, cloudbeaver]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Check the infrastructure jobs
        env:
          TERRAFORM: ${{ needs.terraform.result }}
          ANSIBLE: ${{ needs.ansible.result }}
          ONLYOFFICE: ${{ needs.onlyoffice.result }}
          CLOUDBEAVER: ${{ needs.cloudbeaver.result }}
        run: |
          if [ "$TERRAFORM" != success ] || [ "$ANSIBLE" != success ] || [ "$ONLYOFFICE" != success ] || [ "$CLOUDBEAVER" != success ]; then
            echo "::error::terraform=$TERRAFORM ansible=$ANSIBLE onlyoffice=$ONLYOFFICE cloudbeaver=$CLOUDBEAVER."
            exit 1
          fi
