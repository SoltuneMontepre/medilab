name: ci-infra

permissions:
  contents: read

concurrency:
  group: medilab-ci-infra-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
  workflow_dispatch:

jobs:
  terraform:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    defaults:
      run:
        working-directory: infra
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Detect relevant changes
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            relevant:
              - "infra/**"
              - ".github/workflows/ci.infra.yml"

      - name: Setup Terraform
        if: steps.filter.outputs.relevant == 'true' || github.event_name == 'workflow_dispatch'
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.15.8
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}

      - name: Terraform fmt check
        if: steps.filter.outputs.relevant == 'true' || github.event_name == 'workflow_dispatch'
        run: terraform fmt -check -diff -recursive

      - name: Terraform init
        if: steps.filter.outputs.relevant == 'true' || github.event_name == 'workflow_dispatch'
        run: terraform init

      - name: Terraform validate
        if: steps.filter.outputs.relevant == 'true' || github.event_name == 'workflow_dispatch'
        run: terraform validate

      - name: Terraform plan
        if: steps.filter.outputs.relevant == 'true' || github.event_name == 'workflow_dispatch'
        run: terraform plan
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}

  ansible:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Detect relevant changes
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            relevant:
              - "infra/ansible/**"
              - "tools/ansible/**"
              - "tools/scripts/check_origin_isolation.sh"
              - "tools/scripts/test_origin_isolation.py"
              - ".github/workflows/ci.infra.yml"

      - name: Set up Docker Build
        if: steps.filter.outputs.relevant == 'true' || github.event_name == 'workflow_dispatch'
        uses: docker/setup-buildx-action@v4

      - name: Build Ansible image
        if: steps.filter.outputs.relevant == 'true' || github.event_name == 'workflow_dispatch'
        uses: docker/build-push-action@v7
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: .
          file: tools/ansible/ansible.dockerfile
          tags: medilab-ansible:local
          load: true
          cache-from: type=gha,scope=ansible
          cache-to: type=gha,mode=max,scope=ansible

      - name: Ansible lint
        if: steps.filter.outputs.relevant == 'true' || github.event_name == 'workflow_dispatch'
        run: docker run --rm -v "$PWD:/work" medilab-ansible:local ansible-lint

      - name: Origin isolation regression tests
        if: steps.filter.outputs.relevant == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          bash -n tools/scripts/check_origin_isolation.sh
          python3 -m unittest discover -s tools/scripts -p test_origin_isolation.py

  cloudbeaver:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Detect relevant changes
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            relevant:
              - "infra/cluster/cloudbeaver/**"
              - "tools/cloudbeaver/**"
              - ".github/workflows/ci.infra.yml"

      - name: Pull regression images
        if: steps.filter.outputs.relevant == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          docker pull docker.io/dbeaver/cloudbeaver:26.2.2
          docker pull docker.io/library/postgres:18.4

      - name: CloudBeaver regression tests
        if: steps.filter.outputs.relevant == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          bash -n infra/cluster/cloudbeaver/bootstrap/prepare.sh
          bash -n infra/cluster/cloudbeaver/bootstrap/start.sh
          bash -n infra/cluster/cloudbeaver/bootstrap/ready.sh
          python3 -m unittest discover -s tools/cloudbeaver -v

  infrastructure:
    needs: [terraform, ansible, cloudbeaver]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Check the infrastructure jobs
        env:
          TERRAFORM: ${{ needs.terraform.result }}
          ANSIBLE: ${{ needs.ansible.result }}
          CLOUDBEAVER: ${{ needs.cloudbeaver.result }}
        run: |
          if [ "$TERRAFORM" != success ] || [ "$ANSIBLE" != success ] || [ "$CLOUDBEAVER" != success ]; then
            echo "::error::terraform=$TERRAFORM ansible=$ANSIBLE cloudbeaver=$CLOUDBEAVER."
            exit 1
          fi
