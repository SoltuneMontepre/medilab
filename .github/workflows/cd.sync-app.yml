name: cd-sync-app

permissions:
  contents: read

concurrency:
  group: medilab-cd-sync-app-${{ github.ref }}
  cancel-in-progress: false

on:
  push:
    tags:
      - "filesync-v*"
  workflow_dispatch:

env:
  SYNC_APP_DIR: src/applications/medilab-sync

jobs:
  package:
    name: package (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: true
      matrix:
        include:
          - label: Windows
            os: windows-2025
            bundles: nsis
            target: ""
            packages: |
              src-tauri/target/release/bundle/nsis/*.exe
          - label: macOS
            os: macos-15
            bundles: dmg
            target: aarch64-apple-darwin
            packages: |
              src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          - label: Linux
            os: ubuntu-24.04
            bundles: deb,rpm
            target: ""
            packages: |
              src-tauri/target/release/bundle/deb/*.deb
              src-tauri/target/release/bundle/rpm/*.rpm
    defaults:
      run:
        shell: bash
        working-directory: ${{ env.SYNC_APP_DIR }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check the Odoo address
        env:
          ODOO_URL: ${{ vars.MEDILAB_SYNC_ODOO_URL }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* && ! "$ODOO_URL" =~ ^https:// ]]; then
            echo "::error::Set the MEDILAB_SYNC_ODOO_URL Actions variable to the production Odoo address, starting with https://."
            exit 1
          fi

      - name: Apply the release version
        if: startsWith(github.ref, 'refs/tags/filesync-v')
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#filesync-v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::Tag $TAG does not end in a semantic version, such as filesync-v1.2.3."
            exit 1
          fi
          jq --arg v "$version" '.version = $v' src-tauri/tauri.conf.json > tauri.conf.json.tmp
          mv tauri.conf.json.tmp src-tauri/tauri.conf.json
          jq --arg v "$version" '.version = $v' package.json > package.json.tmp
          mv package.json.tmp package.json
          awk -v v="$version" '!done && /^version = "/ { print "version = \"" v "\""; done = 1; next } { print }'             src-tauri/Cargo.toml > Cargo.toml.tmp
          mv Cargo.toml.tmp src-tauri/Cargo.toml

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils rpm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "${{ env.SYNC_APP_DIR }}/src-tauri -> target"
          key: ${{ matrix.label }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Build packages
        env:
          MEDILAB_SYNC_ODOO_URL: ${{ vars.MEDILAB_SYNC_ODOO_URL }}
          TARGET: ${{ matrix.target }}
          BUNDLES: ${{ matrix.bundles }}
        run: |
          args=(--bundles "$BUNDLES")
          if [[ -n "$TARGET" ]]; then
            args+=(--target "$TARGET")
          fi
          bun run tauri build "${args[@]}"

      - name: Collect packages
        env:
          PACKAGES: ${{ matrix.packages }}
        run: |
          mkdir -p release-packages
          for pattern in $PACKAGES; do
            found=false
            for file in $pattern; do
              if [[ -f "$file" ]]; then
                cp "$file" release-packages/
                found=true
              fi
            done
            if [[ "$found" != true ]]; then
              echo "::error::No package matches $pattern."
              exit 1
            fi
          done

      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: medilab-sync-${{ matrix.label }}
          path: ${{ env.SYNC_APP_DIR }}/release-packages/*
          if-no-files-found: error
          retention-days: 7

  release:
    needs: package
    if: startsWith(github.ref, 'refs/tags/filesync-v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download packages
        uses: actions/download-artifact@v8
        with:
          pattern: medilab-sync-*
          merge-multiple: true
          path: release-packages

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          flags=()
          if [[ "${TAG#filesync-v}" == *-* ]]; then
            flags+=(--prerelease)
          fi
          gh release create "$TAG" release-packages/* \
            --title "MediLab Sync ${TAG#filesync-v}" \
            --generate-notes \
            --verify-tag \
            "${flags[@]}"
