[defaults]
inventory = inventories/production/hosts.yml
roles_path = roles
collections_path = /usr/share/ansible/collections
interpreter_python = auto_silent
callback_result_format = yaml
host_key_checking = True
forks = 10

[ssh_connection]
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o UserKnownHostsFile=/work/infra/ansible/known_hosts -o StrictHostKeyChecking=yes
