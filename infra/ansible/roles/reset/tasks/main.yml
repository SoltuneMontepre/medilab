- name: Run the reset script
  ansible.builtin.script:
    cmd: reset.sh "{{ reset_namespace }}" "{{ reset_cluster }}" "{{ reset_database }}" "{{ reset_application }}"
    executable: /bin/bash
  register: reset_report
  changed_when: true

- name: Show the report
  ansible.builtin.debug:
    msg: "{{ reset_report.stdout_lines }}"
