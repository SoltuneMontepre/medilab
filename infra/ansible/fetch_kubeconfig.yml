# Copies the cluster's admin kubeconfig to infra/ansible/kubeconfig.yml, for use through an SSH tunnel to 127.0.0.1:6443.
- name: Fetch the kubeconfig
  hosts: k3s_servers
  become: true
  gather_facts: false
  run_once: true
  tasks:
    - name: Copy the admin kubeconfig to the repository
      ansible.builtin.fetch:
        src: /etc/rancher/k3s/k3s.yaml
        dest: "{{ playbook_dir }}/kubeconfig.yml"
        flat: true
