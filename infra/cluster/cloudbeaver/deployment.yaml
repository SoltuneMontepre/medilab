# The workspace keeps CloudBeaver's users and settings. Every start rewrites the shared medilab connection
# with the credentials in medilab-db-app, so a rotated password reaches it on the next restart.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudbeaver
  labels:
    app.kubernetes.io/name: cloudbeaver
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: cloudbeaver
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cloudbeaver
    spec:
      enableServiceLinks: false
      initContainers:
        - name: data-sources
          image: docker.io/dbeaver/cloudbeaver:26.2.2
          command:
            - sh
            - -c
            - |
              mkdir -p /opt/cloudbeaver/workspace/GlobalConfiguration/.dbeaver
              cat > /opt/cloudbeaver/workspace/GlobalConfiguration/.dbeaver/data-sources.json <<JSON
              {
                "connections": {
                  "medilab-postgres": {
                    "provider": "postgresql",
                    "driver": "postgres-jdbc",
                    "name": "MediLab",
                    "save-password": true,
                    "configuration": {
                      "host": "medilab-db-rw",
                      "port": "5432",
                      "database": "medilab",
                      "configurationType": "MANUAL",
                      "auth-model": "native",
                      "auth-properties": {
                        "userName": "$DB_USER",
                        "password": "$DB_PASSWORD"
                      }
                    }
                  }
                }
              }
              JSON
          env:
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: medilab-db-app
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: medilab-db-app
                  key: password
          volumeMounts:
            - name: workspace
              mountPath: /opt/cloudbeaver/workspace
      containers:
        - name: cloudbeaver
          image: docker.io/dbeaver/cloudbeaver:26.2.2
          envFrom:
            - secretRef:
                name: cloudbeaver-admin
          env:
            - name: CB_SERVER_NAME
              value: MediLab
            - name: CB_SERVER_URL
              value: https://cloudbeaver.soltunemontepre.tech
          ports:
            - name: http
              containerPort: 8978
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 1536Mi
          volumeMounts:
            - name: workspace
              mountPath: /opt/cloudbeaver/workspace
      volumes:
        - name: workspace
          persistentVolumeClaim:
            claimName: cloudbeaver-workspace
