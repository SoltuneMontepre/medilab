# The administrator CloudBeaver creates on its first start. Anonymous access stays off, so every user signs in.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudbeaver-admin
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: doppler
  target:
    name: cloudbeaver-admin
  data:
    - secretKey: CB_ADMIN_NAME
      remoteRef:
        key: CLOUDBEAVER_ADMIN_NAME
    - secretKey: CB_ADMIN_PASSWORD
      remoteRef:
        key: CLOUDBEAVER_ADMIN_PASSWORD
