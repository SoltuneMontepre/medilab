apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: medilab
resources:
  - ../onlyoffice
  - bucket-egress.yaml
patches:
  - target:
      kind: Deployment
      name: onlyoffice
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: onlyoffice
      spec:
        template:
          spec:
            containers:
              - name: documentserver
                resources:
                  requests:
                    memory: 3Gi
                  limits:
                    memory: 4Gi
