apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: onlyoffice-alerting
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: doppler
  target:
    name: onlyoffice-alerting
  data:
    - secretKey: webhook
      remoteRef:
        key: ONLYOFFICE_ALERT_WEBHOOK
