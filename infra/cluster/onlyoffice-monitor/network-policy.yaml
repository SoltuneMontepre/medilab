apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: onlyoffice-monitor-isolation
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: onlyoffice-monitor
  policyTypes: [Ingress, Egress]
  ingress: []
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: onlyoffice
      ports:
        - protocol: TCP
          port: 443
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
