# The S3 CSI driver mounts the filestore bucket into Odoo. Its volume and credentials are in odoo/.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: csi-s3
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
spec:
  project: default
  source:
    repoURL: https://yandex-cloud.github.io/k8s-csi-s3/charts
    chart: csi-s3
    targetRevision: 0.43.7
    helm:
      releaseName: csi-s3
      valuesObject:
        storageClass:
          create: false
        secret:
          create: false
  destination:
    server: https://kubernetes.default.svc
    namespace: csi-s3
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
