# The Argo Rollouts controller, which runs Odoo's blue-green release. It tolerates the witness taint, so it keeps
# running when a data site is lost.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argo-rollouts
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  project: default
  source:
    repoURL: https://argoproj.github.io/argo-helm
    chart: argo-rollouts
    targetRevision: 2.43.8
    helm:
      releaseName: argo-rollouts
      valuesObject:
        installCRDs: true
        keepCRDs: true
        controller:
          tolerations:
            - key: node-role.kubernetes.io/witness
              operator: Exists
              effect: NoSchedule
        dashboard:
          enabled: false
  destination:
    server: https://kubernetes.default.svc
    namespace: argo-rollouts
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
