# Every sync backs up the database, upgrades the modules, then releases Odoo blue-green; see odoo/.
# No retry: a failed release is rolled back by cd-core, not synced again.
# Argo Rollouts owns the colour in the Service selectors; the Deployment it replaced is removed only once the Rollout is
# healthy.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: odoo
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: https://github.com/SoltuneMontepre/medilab.git
    targetRevision: main
    path: infra/cluster/odoo
  destination:
    server: https://kubernetes.default.svc
    namespace: medilab
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - PruneLast=true
      - RespectIgnoreDifferences=true
  ignoreDifferences:
    - kind: Service
      jsonPointers:
        - /spec/selector/rollouts-pod-template-hash
