# Every sync backs up the database, upgrades the modules, then rolls out Odoo; see odoo/.
# No retry: a failed release is rolled back by cd-core, not synced again.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: odoo
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: https://github.com/SoltuneMontepre/medilab.git
    targetRevision: main
    path: infra/cluster/onlyoffice-demo-odoo
  destination:
    server: https://kubernetes.default.svc
    namespace: medilab
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
