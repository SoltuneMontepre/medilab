apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cloudbeaver
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: https://github.com/SoltuneMontepre/medilab.git
    targetRevision: main
    path: infra/cluster/cloudbeaver
    kustomize:
      replicas:
        - name: cloudbeaver
          count: 0
  destination:
    server: https://kubernetes.default.svc
    namespace: medilab
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
