apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: onlyoffice-edge
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/SoltuneMontepre/medilab.git
    targetRevision: main
    path: infra/cluster/onlyoffice-edge
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
