# Merge into Ansible's traefik-config.yaml.j2 valuesContent before enabling the callback route.
# Keep this candidate out of the root Application until its acceptance gates pass.
ports:
  onlyofficecallback:
    port: 8443
    expose:
      default: false
    protocol: TCP
    transport:
      respondingTimeouts:
        readTimeout: 22m
        writeTimeout: 22m
        idleTimeout: 22m
    observability:
      accessLogs: false
      tracing: false
logs:
  general:
    filePath: /dev/null
  access:
    enabled: false
