apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: traefik-onlyoffice-callback
  namespace: kube-system
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: traefik
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: medilab
          podSelector:
            matchLabels:
              app.kubernetes.io/name: cloudflared
      ports:
        - protocol: TCP
          port: web
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: medilab
          podSelector:
            matchLabels:
              app.kubernetes.io/name: onlyoffice
      ports:
        - protocol: TCP
          port: 8443
