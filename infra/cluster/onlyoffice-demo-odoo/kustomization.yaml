apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: medilab
resources:
  - ../onlyoffice-integration
patches:
  - target:
      kind: Deployment
      name: odoo
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: odoo
      spec:
        strategy:
          rollingUpdate:
            maxSurge: 0
            maxUnavailable: 1
