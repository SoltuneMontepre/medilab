# Preserve all intended state paths; the pinned image dependency discrepancy is an activation gate in the runbook.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: onlyoffice
  labels:
    app.kubernetes.io/name: onlyoffice
spec:
  replicas: 1
  strategy:
    type: Recreate
  progressDeadlineSeconds: 900
  selector:
    matchLabels:
      app.kubernetes.io/name: onlyoffice
  template:
    metadata:
      labels:
        app.kubernetes.io/name: onlyoffice
    spec:
      hostname: onlyoffice
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 1350
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: prepare-state
          image: docker.io/onlyoffice/documentserver:9.4.0.1@sha256:3ab6ebc7c605e5a32b7ae3ff19daed4925090245acc8100ce2230bd766c88212
          command: ["/bin/bash", "-ec"]
          args:
            - mkdir -p /state/{lib,data,postgres,rabbitmq,redis,fonts}
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: "1"
              memory: 256Mi
          volumeMounts:
            - name: state
              mountPath: /state
      containers:
        - name: documentserver
          image: docker.io/onlyoffice/documentserver:9.4.0.1@sha256:3ab6ebc7c605e5a32b7ae3ff19daed4925090245acc8100ce2230bd766c88212
          command: ["/bin/bash", "/opt/medilab/onlyoffice/start.sh"]
          env:
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: onlyoffice-jwt
                  key: jwt-secret
            - name: NGINX_WORKER_PROCESSES
              value: "2"
          ports:
            - name: https
              containerPort: 443
          startupProbe:
            httpGet:
              scheme: HTTPS
              path: /healthcheck
              port: https
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              scheme: HTTPS
              path: /healthcheck
              port: https
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              scheme: HTTPS
              path: /healthcheck
              port: https
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 10
          resources:
            requests:
              cpu: "2"
              memory: 4Gi
              ephemeral-storage: 1Gi
            limits:
              cpu: "4"
              memory: 6Gi
              ephemeral-storage: 4Gi
          volumeMounts:
            - name: runtime
              mountPath: /opt/medilab/onlyoffice
              readOnly: true
            - name: tls
              mountPath: /run/onlyoffice-tls
              readOnly: true
            - name: ca
              mountPath: /run/onlyoffice-ca
              readOnly: true
            - name: state
              mountPath: /var/lib/onlyoffice
              subPath: lib
            - name: state
              mountPath: /var/www/onlyoffice/Data
              subPath: data
            - name: state
              mountPath: /var/lib/postgresql
              subPath: postgres
            - name: state
              mountPath: /var/lib/rabbitmq
              subPath: rabbitmq
            - name: state
              mountPath: /var/lib/redis
              subPath: redis
            - name: state
              mountPath: /usr/share/fonts/truetype/custom
              subPath: fonts
            - name: logs
              mountPath: /var/log/onlyoffice
      volumes:
        - name: runtime
          configMap:
            name: onlyoffice-runtime
        - name: tls
          secret:
            secretName: onlyoffice-tls
            defaultMode: 0440
        - name: ca
          secret:
            secretName: onlyoffice-tls
            items:
              - key: ca.crt
                path: ca.crt
        - name: state
          persistentVolumeClaim:
            claimName: onlyoffice-state
        - name: logs
          emptyDir:
            medium: Memory
            sizeLimit: 128Mi
