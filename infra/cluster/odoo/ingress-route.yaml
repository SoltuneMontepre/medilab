# cloudflared reaches Traefik over plain HTTP after Cloudflare terminated TLS, so Odoo is told the request was HTTPS.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: odoo-https
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  headers:
    customRequestHeaders:
      X-Forwarded-Proto: https
---
# Signing in to the laboratory files API and the webhooks are limited per client address, which Cloudflare sends as
# Cf-Connecting-IP; network policies let only cloudflared reach Traefik and only Traefik reach Odoo, so nothing else
# sends that header. Traefik answers 429 past the limit.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: odoo-rate-limit
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  rateLimit:
    average: 30
    period: 1m
    burst: 30
    sourceCriterion:
      requestHeaderName: Cf-Connecting-IP
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: odoo
spec:
  entryPoints:
    - web
  routes:
    - kind: Rule
      match: Host(`lims.soltunemontepre.tech`) && PathPrefix(`/websocket`)
      middlewares:
        - name: odoo-https
      services:
        - name: odoo
          port: websocket
    - kind: Rule
      match: >-
        Host(`lims.soltunemontepre.tech`) && (Path(`/medilab/api/v1/sign-in`) || Path(`/medilab/brevo/webhook`) ||
        Path(`/payment/payos/webhook`))
      middlewares:
        - name: odoo-https
        - name: odoo-rate-limit
      services:
        - name: odoo
          port: http
    - kind: Rule
      match: Host(`lims.soltunemontepre.tech`)
      middlewares:
        - name: odoo-https
      services:
        - name: odoo
          port: http
