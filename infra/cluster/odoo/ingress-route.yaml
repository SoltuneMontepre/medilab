# cloudflared reaches Traefik over plain HTTP after Cloudflare terminated TLS, so Odoo is told the request was HTTPS.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: odoo-https
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  headers:
    customRequestHeaders:
      X-Forwarded-Proto: https
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: odoo
spec:
  entryPoints:
    - web
  routes:
    - kind: Rule
      match: Host(`lims.soltunemontepre.tech`) && PathPrefix(`/websocket`)
      middlewares:
        - name: odoo-https
      services:
        - name: odoo
          port: websocket
    - kind: Rule
      match: Host(`lims.soltunemontepre.tech`)
      middlewares:
        - name: odoo-https
      services:
        - name: odoo
          port: http
