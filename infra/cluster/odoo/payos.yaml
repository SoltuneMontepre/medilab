# Odoo's PayOS client id, API key and checksum key, read from Doppler.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: payos
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: doppler
  target:
    name: payos
  data:
    - secretKey: PAYOS_CLIENT_ID
      remoteRef:
        key: PAYOS_CLIENT_ID
    - secretKey: PAYOS_API_KEY
      remoteRef:
        key: PAYOS_API_KEY
    - secretKey: PAYOS_CHECKSUM_KEY
      remoteRef:
        key: PAYOS_CHECKSUM_KEY
