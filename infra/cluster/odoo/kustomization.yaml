# cd-core releases an image by committing its tag to newTag.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: medilab
resources:
  - config.yaml
  - filestore.yaml
  - pre-sync-backup.yaml
  - upgrade-job.yaml
  - deployment.yaml
  - service.yaml
  - ingress-route.yaml
  - network-policy.yaml
images:
  - name: ghcr.io/soltunemontepre/medilab
    newTag: sha-e0c076ab43a0c7625fb2cb52e87f80f3c38025e5
