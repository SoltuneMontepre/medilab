# cd-core releases an image by committing its tag to newTag.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: medilab
resources:
  - config.yaml
  - filestore.yaml
  - pre-sync-backup.yaml
  - upgrade-job.yaml
  - deployment.yaml
  - service.yaml
  - ingress-route.yaml
  - network-policy.yaml
images:
  - name: ghcr.io/soltunemontepre/medilab
    newTag: sha-bad4a41452ad717b72fd54730b9fd081cc8c47c8
