# cd-core releases an image by committing its tag to newTag.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: medilab
resources:
  - config.yaml
  - filestore.yaml
  - pre-sync-backup.yaml
  - upgrade-job.yaml
  - deployment.yaml
  - service.yaml
  - ingress-route.yaml
  - network-policy.yaml
images:
  - name: ghcr.io/soltunemontepre/medilab
    newTag: sha-9d5b7352e2b0e7a6242834531ca22d2a1341eb7e
