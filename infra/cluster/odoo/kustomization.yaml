# cd-core releases an image by committing its tag to newTag.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: medilab
resources:
  - config.yaml
  - filestore.yaml
  - payos.yaml
  - firebase.yaml
  - release-catalog.yaml
  - pre-sync-backup.yaml
  - upgrade-job.yaml
  - deployment.yaml
  - service.yaml
  - ingress-route.yaml
  - network-policy.yaml
images:
  - name: ghcr.io/soltunemontepre/medilab
    newTag: sha-569c82bc064d9625d4caa84f5670cc63837b6b6d
