  - deployment.yaml
  - service.yaml
  - ingress-route.yaml
  - network-policy.yaml
images:
  - name: ghcr.io/soltunemontepre/medilab
    newTag: sha-a2bf9ec81881d2a9c4962aec16b6f4b62df7d2f4
