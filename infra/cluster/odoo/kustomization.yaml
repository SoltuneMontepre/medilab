# cd-core releases an image by committing its tag to newTag.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: medilab
resources:
  - config.yaml
  - filestore.yaml
  - payos.yaml
  - release-catalog.yaml
  - pre-sync-backup.yaml
  - upgrade-job.yaml
  - deployment.yaml
  - service.yaml
  - ingress-route.yaml
  - network-policy.yaml
images:
  - name: ghcr.io/soltunemontepre/medilab
    newTag: sha-0c22dc70aa8429542583e421c6c9cdfff45242ba
