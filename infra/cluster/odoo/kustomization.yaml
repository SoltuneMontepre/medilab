  - deployment.yaml
  - service.yaml
  - ingress-route.yaml
  - network-policy.yaml
images:
  - name: ghcr.io/soltunemontepre/medilab
    newTag: sha-7298a68a66158b1f6a7525b4e44c3c59a253f9af
