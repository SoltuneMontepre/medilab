# cd-core releases an image by committing its tag to newTag.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: medilab
resources:
  - config.yaml
  - filestore.yaml
  - upgrade-rehearsal.yaml
  - pre-sync-backup.yaml
  - upgrade-job.yaml
  - analysis-template.yaml
  - rollout.yaml
  - service.yaml
  - ingress-route.yaml
  - network-policy.yaml
# The upgrade scripts are a hook created before the other hooks, which run before Argo CD applies regular resources.
# The release checks keep their name, as the AnalysisTemplate that mounts them is not a kind Kustomize renames in.
configMapGenerator:
  - name: odoo-upgrade
    files:
      - upgrade/upgrade.sh
      - upgrade/fingerprint.py
    options:
      disableNameSuffixHash: true
      annotations:
        argocd.argoproj.io/hook: PreSync
        argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
        argocd.argoproj.io/sync-wave: "-3"
  - name: odoo-release-checks
    files:
      - checks/smoke.mjs
    options:
      disableNameSuffixHash: true
images:
  - name: ghcr.io/soltunemontepre/medilab
    newTag: sha-326f76d56e64664e366feb760d1b5f61e8026008
