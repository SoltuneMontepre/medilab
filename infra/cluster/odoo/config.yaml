# The production odoo.conf, with the master password from Doppler. The database connection comes from the environment.
# Four worker processes, one cron and the websocket process fit the pod's 4 GiB at their soft memory limit, so two
# colours fit Server A beside Document Server during a release; e-mail goes to Mailpit.
# sol_session loads with the server, so sessions live in the database and both colours of a release serve them.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: odoo-config
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: doppler
  target:
    name: odoo-config
    template:
      engineVersion: v2
      data:
        odoo.conf: |
          [options]
          addons_path = /usr/lib/python3/dist-packages/odoo/addons,/mnt/extra-addons
          data_dir = /var/lib/odoo
          db_name = medilab
          dbfilter = ^medilab$
          list_db = False
          proxy_mode = True
          http_interface = 0.0.0.0
          workers = 4
          max_cron_threads = 1
          server_wide_modules = base,rpc,web,sol_session
          db_maxconn = 8
          limit_memory_soft = 603979776
          limit_memory_hard = 939524096
          limit_request = 8192
          limit_time_cpu = 600
          limit_time_real = 1200
          smtp_server = mailpit
          smtp_port = 1025
          smtp_ssl = False
          admin_passwd = {{ .adminPassword }}
  data:
    - secretKey: adminPassword
      remoteRef:
        key: ODOO_ADMIN_PASSWORD
