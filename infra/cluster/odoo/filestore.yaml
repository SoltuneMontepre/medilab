# Odoo's credentials and endpoint for the medilab-filestore bucket, read from Doppler.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: filestore-bucket
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: doppler
  target:
    name: filestore-bucket
    template:
      engineVersion: v2
      data:
        BUCKET_LABORATORY_ACCESS_KEY: "{{ .accessKey }}"
        BUCKET_LABORATORY_SECRET_KEY: "{{ .secretKey }}"
        BUCKET_LABORATORY_ADDRESS: '{{ if hasPrefix "http" .address }}{{ .address }}{{ else }}https://{{ .address }}{{ end }}'
        BUCKET_LABORATORY_PUBLIC_ADDRESS: '{{ if hasPrefix "http" .address }}{{ .address }}{{ else }}https://{{ .address }}{{ end }}'
  data:
    - secretKey: accessKey
      remoteRef:
        key: BUCKET_MAIN_ACCESS_KEY
    - secretKey: secretKey
      remoteRef:
        key: BUCKET_MAIN_SECRET_KEY
    - secretKey: address
      remoteRef:
        key: BUCKET_ADDRESS
