# Before the switch, the preview colour must answer /web/health with its database reachable three times in a row, and
# the smoke check must find its login page and every asset bundle sound. One failure or error aborts the release and
# keeps the active colour.
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: odoo-health
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  args:
    - name: service
  metrics:
    - name: health
      count: 3
      interval: 20s
      failureLimit: 0
      consecutiveErrorLimit: 0
      successCondition: result.status == "pass"
      provider:
        web:
          url: "http://{{args.service}}.medilab.svc.cluster.local:8069/web/health?db_server_status=1"
          timeoutSeconds: 10
    - name: smoke
      failureLimit: 0
      provider:
        job:
          spec:
            backoffLimit: 0
            activeDeadlineSeconds: 600
            template:
              metadata:
                labels:
                  app.kubernetes.io/name: odoo-release-check
              spec:
                restartPolicy: Never
                enableServiceLinks: false
                automountServiceAccountToken: false
                containers:
                  - name: smoke
                    image: docker.io/library/node:22.23.4-alpine@sha256:fe4f6d74e20370acb04ad889077d14d0f64a9c8ea6a42bc60cddf1e844699914
                    command:
                      - node
                      - /opt/medilab/checks/smoke.mjs
                    env:
                      - name: ODOO_URL
                        value: "http://{{args.service}}.medilab.svc.cluster.local:8069"
                    resources:
                      requests:
                        cpu: 100m
                        memory: 128Mi
                      limits:
                        memory: 512Mi
                    volumeMounts:
                      - name: checks
                        mountPath: /opt/medilab/checks
                        readOnly: true
                volumes:
                  - name: checks
                    configMap:
                      name: odoo-release-checks
---
# After the switch, the new colour's pods may log at most 3 ERROR or CRITICAL lines a minute, measured in Loki each
# minute for 5 minutes. Two bad minutes abort the release: Argo Rollouts sends traffic back to the old colour, which
# is still running, and Argo CD reports the application as degraded.
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: odoo-errors
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  args:
    - name: hash
  metrics:
    - name: errors
      count: 5
      interval: 1m
      failureLimit: 1
      consecutiveErrorLimit: 2
      successCondition: len(result) == 0 || asInt(result[0].value[1]) <= 3
      provider:
        web:
          url: >-
            http://loki.monitoring.svc.cluster.local:3100/loki/api/v1/query?query=sum(count_over_time(%7Bnamespace%3D%22medilab%22%2Capp%3D%22odoo%22%2Cpod%3D~%22odoo-{{args.hash}}-.%2B%22%2Clevel%3D~%22ERROR%7CCRITICAL%22%7D%5B1m%5D))
          jsonPath: "{$.data.result}"
          timeoutSeconds: 10
