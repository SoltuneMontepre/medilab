# Installs the missing modules and upgrades every installed one before the new colour starts, then records the image's
# fingerprint in medilab, so a later sync of the same image skips it. A failure fails the sync.
apiVersion: batch/v1
kind: Job
metadata:
  name: odoo-upgrade
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "-1"
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 1800
  template:
    metadata:
      labels:
        app.kubernetes.io/name: odoo-upgrade
    spec:
      restartPolicy: Never
      enableServiceLinks: false
      containers:
        - name: upgrade
          image: ghcr.io/soltunemontepre/medilab:sha-8e6924723d1121f7e90a11c5074220bac4e23a62
          command:
            - bash
            - /opt/medilab/upgrade/upgrade.sh
            - release
          envFrom:
            - secretRef:
                name: filestore-bucket
          env:
            - name: MEDILAB_MODULES
              value: sol_session,sol_laboratory,sol_commerce,sol_inventory,sol_theme,sol_demo
            - name: HOST
              value: medilab-db-rw
            - name: USER
              valueFrom:
                secretKeyRef:
                  name: medilab-db-app
                  key: username
            - name: PASSWORD
              valueFrom:
                secretKeyRef:
                  name: medilab-db-app
                  key: password
            - name: BUCKET_LABORATORY_NAME
              value: medilab-filestore
            - name: BUCKET_LABORATORY_REGION
              value: us-east-1
            - name: BUCKET_FILESTORE
              value: "1"
          resources:
            requests:
              cpu: "3"
              memory: 2Gi
            limits:
              memory: 4Gi
          volumeMounts:
            - name: config
              mountPath: /etc/odoo
              readOnly: true
            - name: data
              mountPath: /var/lib/odoo
            - name: upgrade
              mountPath: /opt/medilab/upgrade
              readOnly: true
      volumes:
        - name: config
          secret:
            secretName: odoo-config
        - name: data
          emptyDir: {}
        - name: upgrade
          configMap:
            name: odoo-upgrade
