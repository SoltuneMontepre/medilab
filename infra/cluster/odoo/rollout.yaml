# One replica while the cluster runs on Server A alone. A release starts the new image as the preview colour beside the
# active one, checks it through odoo-preview, then switches odoo to it; the old colour stays up 10 minutes for a rollback.
# Sessions and cached attachments live in the emptyDir; attachments are backed by the medilab-filestore bucket.
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: odoo
  labels:
    app.kubernetes.io/name: odoo
spec:
  replicas: 1
  progressDeadlineSeconds: 600
  progressDeadlineAbort: true
  strategy:
    blueGreen:
      activeService: odoo
      previewService: odoo-preview
      autoPromotionEnabled: true
      prePromotionAnalysis:
        templates:
          - templateName: odoo-health
        args:
          - name: service
            value: odoo-preview
      scaleDownDelaySeconds: 600
  selector:
    matchLabels:
      app.kubernetes.io/name: odoo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: odoo
    spec:
      enableServiceLinks: false
      terminationGracePeriodSeconds: 60
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: medilab/site
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: odoo
      containers:
        - name: odoo
          image: ghcr.io/soltunemontepre/medilab:sha-8e6924723d1121f7e90a11c5074220bac4e23a62
          envFrom:
            - secretRef:
                name: filestore-bucket
          env:
            - name: HOST
              value: medilab-db-rw
            - name: USER
              valueFrom:
                secretKeyRef:
                  name: medilab-db-app
                  key: username
            - name: PASSWORD
              valueFrom:
                secretKeyRef:
                  name: medilab-db-app
                  key: password
            - name: BUCKET_LABORATORY_NAME
              value: medilab-filestore
            - name: BUCKET_LABORATORY_REGION
              value: us-east-1
            - name: BUCKET_FILESTORE
              value: "1"
          ports:
            - name: http
              containerPort: 8069
            - name: websocket
              containerPort: 8072
          startupProbe:
            httpGet:
              path: /web/health
              port: http
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /web/health
              port: http
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /web/health
              port: http
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              cpu: "3"
              memory: 4Gi
            limits:
              memory: 5Gi
          volumeMounts:
            - name: config
              mountPath: /etc/odoo
              readOnly: true
            - name: data
              mountPath: /var/lib/odoo
      volumes:
        - name: config
          secret:
            secretName: odoo-config
        - name: data
          emptyDir: {}
