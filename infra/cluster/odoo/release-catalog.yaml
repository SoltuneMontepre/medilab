# The public address of the medilab-release bucket's Medilab Mobile catalog, read from Doppler. The Secret is optional
# to the pod: without it Odoo answers phones update_unavailable and they open without an update.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: release-catalog
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: doppler
  target:
    name: release-catalog
    template:
      engineVersion: v2
      data:
        MOBILE_CATALOG_URL: '{{ trimSuffix "/" .address }}/mobile/catalog.json'
  data:
    - secretKey: address
      remoteRef:
        key: RELEASE_BUCKET_PUBLIC_ADDRESS
