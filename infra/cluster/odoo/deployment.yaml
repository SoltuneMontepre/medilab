# One replica while the cluster runs on Server A alone. A release rolls out one replica at a time.
# Sessions and cached attachments live in the emptyDir; attachments are backed by the medilab-filestore bucket.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: odoo
  labels:
    app.kubernetes.io/name: odoo
spec:
  replicas: 1
  progressDeadlineSeconds: 600
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: odoo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: odoo
    spec:
      enableServiceLinks: false
      terminationGracePeriodSeconds: 60
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: medilab/site
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: odoo
      containers:
        - name: odoo
          image: ghcr.io/soltunemontepre/medilab:sha-8e6924723d1121f7e90a11c5074220bac4e23a62
          envFrom:
            - secretRef:
                name: filestore-bucket
            - secretRef:
                name: payos
          env:
            - name: HOST
              value: medilab-db-rw
            - name: USER
              valueFrom:
                secretKeyRef:
                  name: medilab-db-app
                  key: username
            - name: PASSWORD
              valueFrom:
                secretKeyRef:
                  name: medilab-db-app
                  key: password
            - name: BUCKET_LABORATORY_NAME
              value: medilab-filestore
            - name: BUCKET_LABORATORY_REGION
              value: us-east-1
            - name: BUCKET_FILESTORE
              value: "1"
            - name: MEDILAB_MOBILE_RELEASES_FILE
              value: /var/lib/medilab-release/catalog.json
          ports:
            - name: http
              containerPort: 8069
            - name: websocket
              containerPort: 8072
          startupProbe:
            httpGet:
              path: /web/health
              port: http
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /web/health
              port: http
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /web/health
              port: http
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              cpu: "3"
              memory: 4Gi
            limits:
              memory: 5Gi
          volumeMounts:
            - name: config
              mountPath: /etc/odoo
              readOnly: true
            - name: data
              mountPath: /var/lib/odoo
            - name: release-catalog
              mountPath: /var/lib/medilab-release
              readOnly: true
        # Copies the Medilab Mobile release catalog cd-mobile-app publishes to the file Odoo reads, every minute. A
        # catalog is replaced whole, so Odoo never reads half of one; the last one stays when the bucket cannot answer.
        - name: release-catalog
          image: ghcr.io/soltunemontepre/medilab:sha-8e6924723d1121f7e90a11c5074220bac4e23a62
          command: ["python3", "-c"]
          args:
            - |
              import os, time, urllib.request
              url = os.environ.get("MOBILE_CATALOG_URL")
              target = "/var/lib/medilab-release/catalog.json"
              while True:
                  try:
                      if url:
                          with urllib.request.urlopen(url, timeout=30) as answer:
                              catalog = answer.read(1024 * 1024 + 1)
                          if len(catalog) <= 1024 * 1024:
                              with open(target + ".part", "wb") as part:
                                  part.write(catalog)
                              os.replace(target + ".part", target)
                  except OSError as error:
                      print(f"The release catalog was not copied: {error}", flush=True)
                  time.sleep(60)
          envFrom:
            - secretRef:
                name: release-catalog
                optional: true
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 96Mi
          volumeMounts:
            - name: release-catalog
              mountPath: /var/lib/medilab-release
      volumes:
        - name: config
          secret:
            secretName: odoo-config
        - name: data
          emptyDir: {}
        - name: release-catalog
          emptyDir: {}
