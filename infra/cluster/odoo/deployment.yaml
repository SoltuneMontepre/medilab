# One replica while the cluster runs on Server A alone. A release rolls out one replica at a time.
# Sessions live in the emptyDir, so users log in again when a replica is replaced.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: odoo
  labels:
    app.kubernetes.io/name: odoo
spec:
  replicas: 1
  progressDeadlineSeconds: 600
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: odoo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: odoo
    spec:
      enableServiceLinks: false
      terminationGracePeriodSeconds: 60
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: medilab/site
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: odoo
      containers:
        - name: odoo
          image: ghcr.io/soltunemontepre/medilab
          env:
            - name: HOST
              value: medilab-db-rw
            - name: USER
              valueFrom:
                secretKeyRef:
                  name: medilab-db-app
                  key: username
            - name: PASSWORD
              valueFrom:
                secretKeyRef:
                  name: medilab-db-app
                  key: password
          ports:
            - name: http
              containerPort: 8069
            - name: websocket
              containerPort: 8072
          startupProbe:
            httpGet:
              path: /web/health
              port: http
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /web/health
              port: http
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /web/health
              port: http
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              cpu: "1"
              memory: 2Gi
            limits:
              memory: 5Gi
          volumeMounts:
            - name: config
              mountPath: /etc/odoo
              readOnly: true
            - name: data
              mountPath: /var/lib/odoo
            - name: filestore
              mountPath: /var/lib/odoo/filestore
      volumes:
        - name: config
          secret:
            secretName: odoo-config
        - name: data
          emptyDir: {}
        - name: filestore
          persistentVolumeClaim:
            claimName: filestore
