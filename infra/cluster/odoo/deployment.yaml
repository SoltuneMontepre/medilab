# One replica while the cluster runs on Server A alone. A release rolls out one replica at a time.
# Sessions and cached attachments live in the emptyDir; attachments are backed by the medilab-filestore bucket.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: odoo
  labels:
    app.kubernetes.io/name: odoo
spec:
  replicas: 1
  progressDeadlineSeconds: 600
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: odoo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: odoo
    spec:
      enableServiceLinks: false
      terminationGracePeriodSeconds: 60
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: medilab/site
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: odoo
      containers:
        - name: odoo
          image: ghcr.io/soltunemontepre/medilab:sha-8e6924723d1121f7e90a11c5074220bac4e23a62
          envFrom:
            - secretRef:
                name: filestore-bucket
            - secretRef:
                name: payos
            # Optional: without the Firebase secret Odoo still starts, and the push job only defers pushes.
            - secretRef:
                name: firebase
                optional: true
          env:
            - name: HOST
              value: medilab-db-rw
            - name: USER
              valueFrom:
                secretKeyRef:
                  name: medilab-db-app
                  key: username
            - name: PASSWORD
              valueFrom:
                secretKeyRef:
                  name: medilab-db-app
                  key: password
            - name: BUCKET_LABORATORY_NAME
              value: medilab-filestore
            - name: BUCKET_LABORATORY_REGION
              value: us-east-1
            - name: BUCKET_FILESTORE
              value: "1"
            - name: MEDILAB_MOBILE_RELEASES_FILE
              value: /mnt/releases/mobile-catalog.json
          ports:
            - name: http
              containerPort: 8069
            - name: websocket
              containerPort: 8072
          startupProbe:
            httpGet:
              path: /web/health
              port: http
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /web/health
              port: http
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /web/health
              port: http
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              cpu: "3"
              memory: 4Gi
            limits:
              memory: 5Gi
          volumeMounts:
            - name: config
              mountPath: /etc/odoo
              readOnly: true
            - name: data
              mountPath: /var/lib/odoo
            - name: releases
              mountPath: /mnt/releases
              readOnly: true
        # Copies Medilab Mobile's release catalog every minute. A failed or partial download keeps the last copy, and
        # until the first release publishes one Odoo answers update_unavailable.
        - name: release-catalog
          image: ghcr.io/soltunemontepre/medilab:sha-8e6924723d1121f7e90a11c5074220bac4e23a62
          envFrom:
            - secretRef:
                name: release-catalog
          command:
            - /bin/sh
            - -c
            - |
              while true; do
                if curl -fsS --proto =https --max-time 30 --max-filesize 1048576 \
                  -o /mnt/releases/mobile-catalog.json.part "${RELEASE_BUCKET_PUBLIC_ADDRESS%/}/mobile/catalog.json"; then
                  mv -f /mnt/releases/mobile-catalog.json.part /mnt/releases/mobile-catalog.json
                else
                  rm -f /mnt/releases/mobile-catalog.json.part
                fi
                sleep 60
              done
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
          volumeMounts:
            - name: releases
              mountPath: /mnt/releases
      volumes:
        - name: config
          secret:
            secretName: odoo-config
        - name: data
          emptyDir: {}
        - name: releases
          emptyDir: {}
