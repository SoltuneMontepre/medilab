# Only Traefik reaches Odoo's web and websocket ports, so no other pod sends Odoo a forged Cf-Connecting-IP or
# X-Forwarded-For. The Argo Rollouts controller also reaches the web port to check the preview colour before a switch.
# k3s enforces it with its network policy controller.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: odoo-from-traefik
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: odoo
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - port: http
        - port: websocket
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: argo-rollouts
          podSelector:
            matchLabels:
              app.kubernetes.io/name: argo-rollouts
              app.kubernetes.io/component: rollouts-controller
      ports:
        - port: http
