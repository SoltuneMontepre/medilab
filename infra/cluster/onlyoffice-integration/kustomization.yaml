# Reviewable Odoo variant; switch the Odoo Application path only after acceptance.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: medilab
resources:
  - ../odoo
  - ../onlyoffice-prerequisites
  - callback-ingress.yaml
patches:
  - path: odoo.yaml
    target:
      group: argoproj.io
      kind: Rollout
      name: odoo
  - target:
      group: traefik.io
      version: v1alpha1
      kind: IngressRoute
      name: odoo
    patch: |-
      - op: replace
        path: /spec/routes/2/match
        value: Host(`lims.soltunemontepre.tech`) && !PathPrefix(`/medilab/laboratory-files/callback/`)
replacements:
  - source:
      kind: Rollout
      name: odoo
      fieldPath: spec.template.spec.containers.[name=odoo].image
    targets:
      - select:
          kind: Rollout
          name: odoo
        fieldPaths:
          - spec.template.spec.initContainers.[name=onlyoffice-trust].image
