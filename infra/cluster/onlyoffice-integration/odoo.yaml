# Adds the editor settings and the trusted ONLYOFFICE CA to the odoo Rollout. A Rollout is a custom resource, which
# Kustomize merges without knowing its lists, so the patch adds each entry explicitly.
- op: add
  path: /spec/template/spec/initContainers
  value:
    - name: onlyoffice-trust
      image: ghcr.io/soltunemontepre/medilab:sha-d8edc75d11fa67cfaabc6741de5607b2acd83251
      command: ["python3", "-c"]
      args:
        - |
          from pathlib import Path
          Path('/trust/ca-bundle.pem').write_bytes(
              Path('/etc/ssl/certs/ca-certificates.crt').read_bytes()
              + b'\n' + Path('/ca/ca.crt').read_bytes())
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: "1"
          memory: 128Mi
      volumeMounts:
        - name: onlyoffice-ca
          mountPath: /ca
          readOnly: true
        - name: onlyoffice-trust
          mountPath: /trust
- op: add
  path: /spec/template/spec/containers/0/env/-
  value:
    name: ONLYOFFICE_INTERNAL_URL
    value: https://onlyoffice.medilab.svc.cluster.local
- op: add
  path: /spec/template/spec/containers/0/env/-
  value:
    name: ONLYOFFICE_PUBLIC_URL
    value: https://office.soltunemontepre.tech
- op: add
  path: /spec/template/spec/containers/0/env/-
  value:
    name: ONLYOFFICE_CALLBACK_ORIGIN
    value: https://onlyoffice-callback.kube-system.svc.cluster.local:8443
- op: add
  path: /spec/template/spec/containers/0/env/-
  value:
    name: ONLYOFFICE_JWT_SECRET
    valueFrom:
      secretKeyRef:
        name: onlyoffice-jwt
        key: jwt-secret
- op: add
  path: /spec/template/spec/containers/0/env/-
  value:
    name: REQUESTS_CA_BUNDLE
    value: /run/onlyoffice-trust/ca-bundle.pem
- op: add
  path: /spec/template/spec/containers/0/volumeMounts/-
  value:
    name: onlyoffice-trust
    mountPath: /run/onlyoffice-trust
    readOnly: true
- op: add
  path: /spec/template/spec/volumes/-
  value:
    name: onlyoffice-ca
    secret:
      secretName: onlyoffice-tls
      items:
        - key: ca.crt
          path: ca.crt
- op: add
  path: /spec/template/spec/volumes/-
  value:
    name: onlyoffice-trust
    emptyDir: {}
