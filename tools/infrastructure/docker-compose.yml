# The project names the containers, network and volumes. Each checkout sets its own in the .env next to this file, which
# task dev:setup writes from the checkout's folder name, so a worktree's stack never takes the main checkout's.
name: medilab

services:
  odoo:
    image: ${MEDILAB_ODOO_IMAGE:-medilab-odoo:local}
    build:
      context: ../..
      dockerfile: tools/dockerfiles/prod.dockerfile
    restart: unless-stopped
    environment:
      HOST: postgres
      USER: ${MEDILAB_DB_USER:-root}
      PASSWORD: ${MEDILAB_DB_PASSWORD:-root}
      MEDILAB_DEMO_PASSWORD: ${MEDILAB_DEMO_PASSWORD:-}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${MEDILAB_ODOO_PORT:-8069}:8069"
    volumes:
      - medilab-app:/var/lib/odoo
      - ../../src/core/config:/etc/odoo:z
      - ../../src/core/modules:/mnt/extra-addons:z
      - ../scripts:/opt/medilab/scripts:ro,z

  postgres:
    restart: always
    image: docker.io/library/postgres:18
    environment:
      POSTGRES_USER: ${MEDILAB_DB_USER:-root}
      POSTGRES_PASSWORD: ${MEDILAB_DB_PASSWORD:-root}
      POSTGRES_DB: ${MEDILAB_DB_NAME:-medilab}
      PGDATA: /var/lib/postgresql/data/pgdata
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${MEDILAB_DB_USER:-root} -d ${MEDILAB_DB_NAME:-medilab}",
        ]
      interval: 2s
      timeout: 5s
      retries: 15
    volumes:
      - medilab-db:/var/lib/postgresql
      - ./postgres/init:/docker-entrypoint-initdb.d:z
    ports:
      - "${MEDILAB_DB_PORT:-15432}:5432"

  cloudbeaver:
    image: docker.io/dbeaver/cloudbeaver:latest
    restart: unless-stopped
    environment:
      CB_SERVER_NAME: MediLab
      CB_SERVER_URL: http://localhost:${MEDILAB_CLOUDBEAVER_PORT:-8978}
      CB_ADMIN_NAME: ${CLOUDBEAVER_ADMIN_NAME:-medilab}
      CB_ADMIN_PASSWORD: ${CLOUDBEAVER_ADMIN_PASSWORD:-admin}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${MEDILAB_CLOUDBEAVER_PORT:-8978}:8978"
    volumes:
      - medilab-cloudbeaver:/opt/cloudbeaver/workspace
      - ./cloudbeaver/data-sources.json:/opt/cloudbeaver/workspace/GlobalConfiguration/.dbeaver/data-sources.json:z

volumes:
  medilab-app:
  medilab-db:
  medilab-cloudbeaver:
