services:
  runner:
    environment:
      ONLYOFFICE_PAGE_REAL: "1"
      ONLYOFFICE_PAGE_HOLD_SECONDS: ${ONLYOFFICE_PAGE_HOLD_SECONDS:-3}
      ONLYOFFICE_DESKTOP_PROBE: ${ONLYOFFICE_DESKTOP_PROBE:-0}
  page-browser:
    image: localhost/medilab171-agent4-browser:local
    command: [node, /opt/browser/page_browser.cjs]
    init: true
    shm_size: 1gb
    volumes:
      - ./page_browser.cjs:/opt/browser/page_browser.cjs:ro
      - ./loopback_proxy.cjs:/opt/browser/loopback_proxy.cjs:ro
