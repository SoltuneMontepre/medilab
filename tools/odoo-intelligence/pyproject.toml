[project]
name = "medilab-odoo-tools"
version = "0.1.0"
requires-python = ">=3.12,<3.15"
dependencies = [
    "anyio==4.15.1",
    "filelock==3.25.2",
    "mcp==1.28.1",
    "pydantic-settings==2.10.1",
    "serena-agent @ git+https://github.com/oraios/serena@1bbe53546124c00e4238972f1599a91fbf8c6539",
]

[project.scripts]
medilab-odoo = "odoo_intelligence.cli:main"

[dependency-groups]
dev = ["pytest==9.1.1", "pyyaml==6.0.2", "ruff==0.17.0"]

[build-system]
requires = ["hatchling==1.29.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["odoo_intelligence"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
