version: "3"

vars:
  TF_DIR: infra
  TF_DOPPLER_PROJECT: medilab
  TF_DOPPLER_CONFIG: tf
  TF_RUN: "doppler run --project {{.TF_DOPPLER_PROJECT}} --config {{.TF_DOPPLER_CONFIG}} --name-transformer tf-var -- terraform -chdir={{.TF_DIR}}"
  LOG: tools/scripts/log.sh
  DOPPLER: tools/scripts/doppler.sh

tasks:
  tf:setup:
    desc: "Authenticate Doppler and initialize Terraform"
    silent: true
    interactive: true
    status:
      - doppler whoami
      - test -d {{.TF_DIR}}/.terraform
    cmds:
      - |
        set -e
        . {{.LOG}}
        . {{.DOPPLER}}
        log_step "Terraform"
        doppler_login
        terraform -chdir={{.TF_DIR}} init
        log_ok "Doppler authenticated and Terraform initialized."

  tf:init:
    desc: "Initialize Terraform after changing providers or modules"
    cmds:
      - terraform -chdir={{.TF_DIR}} init

  tf:plan:
    desc: "Preview Terraform changes with the {{.TF_DOPPLER_CONFIG}} secrets"
    cmds:
      - "{{.TF_RUN}} plan"

  tf:apply:
    desc: "Apply Terraform changes with the {{.TF_DOPPLER_CONFIG}} secrets"
    interactive: true
    cmds:
      - "{{.TF_RUN}} apply"

  tf:output:
    desc: "Print the Terraform outputs"
    cmds:
      - "{{.TF_RUN}} output"
