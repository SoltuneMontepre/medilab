version: "3"

vars:
  # When changing the pin, recopy the matching upstream skill and reapply the local installation and usage corrections.
  OFFICECLI_VERSION: 1.0.158

tasks:
  docs:setup:
    desc: "Install OfficeCLI to read and edit the .docx, .xlsx and .pptx files in docs"
    silent: true
    cmds:
      - . tools/scripts/docs_setup.sh {{.OFFICECLI_VERSION}}
