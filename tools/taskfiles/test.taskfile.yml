version: "3"

set: [pipefail]

env:
  COMPOSE_FILE: tools/infrastructure/docker-compose.yml

vars:
  ALL_MODULES:
    sh: 'out=; while IFS= read -r m || [ -n "$m" ]; do m=${m%$''\r''}; [ -z "$m" ] || [ "$m" = base ] || out=${out:+$out,}$m; done < src/core/modules.txt; echo "$out"'
  EXCLUDE: '{{.EXCLUDE | default ""}}'
  MODULES: '{{.MODULES | default (without (splitList "," .ALL_MODULES) .EXCLUDE | join ",")}}'
  TEST_MODULES: '{{.TEST_MODULES | default .MODULES}}'
  TAGS: '{{range $i, $m := splitList "," .TEST_MODULES}}{{if $i}},{{end}}/{{$m}}{{end}}'
  INSTALL_COVERAGE: '{{.INSTALL_COVERAGE | default "true"}}'
  TEST_DB: '{{.MEDILAB_TEST_DB | default "medilab_test"}}'
  RUNNER: "{{.RUNNER | default 1}}"
  RUNNERS: "{{.RUNNERS | default 1}}"
  TEST_SHARDS: 4
  TOTAL_SHARDS: "{{mul .RUNNERS .TEST_SHARDS}}"
  SHARD_NUMBERS: "{{range $i := until .TEST_SHARDS}}{{add (mul (sub $.RUNNER 1) $.TEST_SHARDS) $i 1}} {{end}}"
  TEST_RUN_DIR: /var/lib/odoo/{{.TEST_DB}}-run
  ODOO_SCRIPTS: /opt/medilab/scripts
  TEST_COVERAGE_DIR: .local/core-test-coverage
  TEST_ENV: '-v "{{.ROOT_DIR}}/{{.TEST_COVERAGE_DIR}}:/opt/medilab/test-deps:ro" -e PYTHONPATH=/opt/medilab/test-deps:/opt/python-packages -e "TEST_DB=$TEST_DB" -e "TEST_RUN_DIR=$TEST_RUN_DIR" -e "MODULES=$MODULES" -e "SHARD_NUMBERS=$SHARD_NUMBERS"'
  COVERAGE_IMAGE: docker.io/library/python:3.12-slim
  COVERAGE_DIR: "{{.COVERAGE_DIR}}"
  DB_USER: '{{.MEDILAB_DB_USER | default "root"}}'
  COVERAGE_REPORT: src/core/modules/coverage.xml
  E2E_DIR: src/tests
  E2E_URL: '{{.MEDILAB_URL | default "http://localhost:8069"}}'
  SYNC_APP_DIR: src/applications/medilab-sync
  MOBILE_APP_DIR: src/applications/medilab-mobile
  TYPECHECK_DIR: tools/typecheck
  SCRIPT_TESTS_DIR: tools/scripts/tests
  UV: uv --project src/core
  OPENAPI_DOCUMENT: src/core/modules/sol_laboratory/api/openapi.yaml
  OASDIFF_IMAGE: docker.io/tufin/oasdiff:v1.33.0@sha256:6263a96dd2ef0726c54e21fea9b8e1607eac4841add0079324b424c1f52b819c
  OPENAPI_BASE: '{{.OPENAPI_BASE | default "origin/main"}}'
  LOG: tools/scripts/log.sh

tasks:
  test:
    desc: "Run the Odoo module tests and the application tests"
    cmds:
      - task: test:core
      - task: test:apps

  test:logging:
    desc: "Check Task and Odoo logging colors, streams and prompt behavior"
    cmds:
      - python tools/scripts/test_log.py

  test:core:
    desc: "Run the tests of every module in src/core/modules.txt with coverage, split over parallel shards in throwaway databases; task test:core MODULES=a,b or EXCLUDE=a limits the modules, TEST_MODULES=a runs the tests of only some of them, RUNNER=2 RUNNERS=3 runs this machine's share of the shards, INSTALL_COVERAGE=false installs without coverage"
    silent: true
    env:
      TEST_DB: '{{.TEST_DB}}'
      TEST_RUN_DIR: '{{.TEST_RUN_DIR}}'
      MODULES: '{{.MODULES}}'
      TEST_MODULES: '{{.TEST_MODULES}}'
      TAGS: '{{.TAGS}}'
      INSTALL_COVERAGE: '{{.INSTALL_COVERAGE}}'
      SHARD_NUMBERS: '{{.SHARD_NUMBERS}}'
      TOTAL_SHARDS: '{{.TOTAL_SHARDS}}'
    cmds:
      - python tools/scripts/local_compose.py up -d --wait postgres
      - python tools/scripts/core_test_guard.py prepare
      - defer: { task: test:core:clean }
      - 'uv pip install --target {{.TEST_COVERAGE_DIR}} --python-version 3.12 --python-platform linux --no-deps --only-binary :all: coverage==7.10.7'
      - python tools/scripts/local_compose.py run --rm -T garage-setup
      - . {{.LOG}} && log_step "Splitting the test classes into {{.TOTAL_SHARDS}} shards"
      - python tools/scripts/local_compose.py run --rm -T --entrypoint python3 odoo {{.ODOO_SCRIPTS}}/test_shards.py "$TEST_MODULES" "$TOTAL_SHARDS" "$TEST_RUN_DIR/shards"
      - . {{.LOG}} && log_step "Installing $MODULES"
      - python tools/scripts/local_compose.py run --rm -T --user root {{.TEST_ENV}} -e "TAGS=$TAGS" -e "INSTALL_COVERAGE=$INSTALL_COVERAGE" --entrypoint bash odoo {{.ODOO_SCRIPTS}}/test_core_install.sh
      - python tools/scripts/core_test_guard.py clone
      - . {{.LOG}} && log_step "Running shards {{trim .SHARD_NUMBERS}} of {{.TOTAL_SHARDS}}"
      - task: test:core:shards
      - task: test:core:report

  test:core:shards:
    internal: true
    deps:
      - for: { var: SHARD_NUMBERS }
        task: test:core:shard
        vars: { SHARD: "{{.ITEM}}" }

  test:core:shard:
    internal: true
    silent: true
    env:
      TEST_DB: '{{.TEST_DB}}'
      TEST_RUN_DIR: '{{.TEST_RUN_DIR}}'
      MODULES: '{{.MODULES}}'
      SHARD_NUMBERS: '{{.SHARD_NUMBERS}}'
      SHARD: '{{.SHARD}}'
    cmds:
      - python tools/scripts/local_compose.py run --rm -T --user root {{.TEST_ENV}} -e "SHARD=$SHARD" --entrypoint bash odoo {{.ODOO_SCRIPTS}}/test_core_shard.sh

  test:core:report:
    internal: true
    silent: true
    env:
      TEST_DB: '{{.TEST_DB}}'
      TEST_RUN_DIR: '{{.TEST_RUN_DIR}}'
      MODULES: '{{.MODULES}}'
      SHARD_NUMBERS: '{{.SHARD_NUMBERS}}'
    cmds:
      - cmd: mkdir -p {{.COVERAGE_DIR}}
        if: '[ -n "{{.COVERAGE_DIR}}" ]'
      - cmd: python tools/scripts/local_compose.py run --rm -T --user root -v "{{.ROOT_DIR}}/{{.COVERAGE_DIR}}:/export" --entrypoint cp odoo -a "$TEST_RUN_DIR/coverage/." /export/
        if: '[ -n "{{.COVERAGE_DIR}}" ]'
      - cmd: python tools/scripts/local_compose.py run --rm -T --user root {{.TEST_ENV}} --entrypoint bash odoo {{.ODOO_SCRIPTS}}/test_core_coverage.sh "$TEST_RUN_DIR/coverage"
        if: '[ -z "{{.COVERAGE_DIR}}" ]'
      - cmd: sed -i 's|filename=.|&src/core/modules/|' {{.COVERAGE_REPORT}}
        if: '[ -z "{{.COVERAGE_DIR}}" ]'
      - |
        set -e
        . {{.LOG}}
        failed=$(python tools/scripts/local_compose.py run --rm -T {{.TEST_ENV}} --entrypoint bash odoo {{.ODOO_SCRIPTS}}/test_core_status.sh)
        if [ -n "$failed" ]; then
          log_error "Odoo module tests failed in shard $failed. Search the output for [shard N]."
          exit 1
        fi
        log_ok "Odoo module tests passed in shards {{trim .SHARD_NUMBERS}}. {{if .COVERAGE_DIR}}Coverage data in {{.COVERAGE_DIR}}{{else}}Coverage report in {{.COVERAGE_REPORT}}{{end}}."

  test:core:coverage:
    desc: "Combine the coverage data that test:core runners saved in COVERAGE_DIR into the coverage report"
    silent: true
    preconditions:
      - sh: '[ -n "{{.COVERAGE_DIR}}" ]'
        msg: "Set COVERAGE_DIR to the folder with the coverage data: task test:core:coverage COVERAGE_DIR=.local/coverage"
    cmds:
      - 'uv pip install --target {{.TEST_COVERAGE_DIR}} --python-version 3.12 --python-platform linux --no-deps --only-binary :all: coverage==7.10.7'
      - docker run --rm -v "{{.ROOT_DIR}}/src/core/modules:/mnt/extra-addons" -v "{{.ROOT_DIR}}/tools/scripts:{{.ODOO_SCRIPTS}}:ro" -v "{{.ROOT_DIR}}/{{.COVERAGE_DIR}}:/coverage" -v "{{.ROOT_DIR}}/{{.TEST_COVERAGE_DIR}}:/opt/medilab/test-deps:ro" -e PYTHONPATH=/opt/medilab/test-deps {{.COVERAGE_IMAGE}} bash {{.ODOO_SCRIPTS}}/test_core_coverage.sh /coverage
      - sed -i 's|filename=.|&src/core/modules/|' {{.COVERAGE_REPORT}}
      - . {{.LOG}} && log_ok "Coverage report in {{.COVERAGE_REPORT}}."

  test:core:clean:
    internal: true
    silent: true
    env:
      TEST_DB: '{{.TEST_DB}}'
      TEST_RUN_DIR: '{{.TEST_RUN_DIR}}'
      SHARD_NUMBERS: '{{.SHARD_NUMBERS}}'
    cmds:
      - python tools/scripts/core_test_guard.py clean

  test:uninstall:
    desc: "Install the modules in a throwaway database, uninstall commerce and inventory and check that the Laboratory data is intact"
    silent: true
    vars:
      MODULES: sol_laboratory,sol_commerce,sol_inventory
      STANDALONE_TAG: medilab_uninstall
    env:
      TEST_DB: '{{.TEST_DB}}'
      TEST_RUN_DIR: '{{.TEST_RUN_DIR}}'
      SHARD_NUMBERS: '1'
    cmds:
      - python tools/scripts/local_compose.py guard-uninstall
      - python tools/scripts/local_compose.py up -d --wait postgres
      - python tools/scripts/core_test_guard.py prepare
      - defer: python tools/scripts/core_test_guard.py clean
      - python tools/scripts/local_compose.py run --rm -T odoo -d "$TEST_DB" -i {{.MODULES}} --stop-after-init --log-level=warn
      - |
        python tools/scripts/local_compose.py run --rm -T -e "TEST_DB=$TEST_DB" --entrypoint bash odoo -c '
          set -e -o pipefail
          export PGHOST="$HOST" PGUSER="$USER" PGPASSWORD="$PASSWORD"
          python3 -m odoo.tests.test_module_operations -d "$TEST_DB" standalone {{.STANDALONE_TAG}} 2>&1 | tee /tmp/standalone.log
          ! grep -q "Standalone script .* failed" /tmp/standalone.log'
      - . {{.LOG}} && log_ok "Uninstall test passed."

  test:typecheck:
    desc: "Check that task typecheck resolves the module imports and still fails on missing names and type errors"
    cmds:
      - task: dev:odoo-links
      - "{{.UV}} run python -m unittest discover -s {{.TYPECHECK_DIR}}"

  test:openapi:
    desc: "Lint the OpenAPI document of the laboratory files API, refuse a duplicate key in it, and refuse a change that breaks it against main unless its version changes; task test:openapi OPENAPI_BASE=<revision> compares with another revision"
    cmds:
      - "{{.UV}} run python -m unittest discover -s {{.SCRIPT_TESTS_DIR}} -t tools/scripts"
      - "{{.UV}} run python tools/scripts/test_openapi_keys.py {{.OPENAPI_DOCUMENT}}"
      - "{{.UV}} run openapi-spec-validator {{.OPENAPI_DOCUMENT}}"
      - "{{.UV}} run python tools/scripts/test_openapi.py {{.OPENAPI_DOCUMENT}} {{.OASDIFF_IMAGE}} {{.OPENAPI_BASE}}"

  test:e2e:
    desc: "Run the browser tests against the running Odoo; task test:e2e needs task up first"
    silent: true
    dir: "{{.E2E_DIR}}"
    cmds:
      - |
        set -e
        unset ELECTRON_RUN_AS_NODE
        bun install --frozen-lockfile
        bun run test
        . {{.ROOT_DIR}}/{{.LOG}}
        log_ok "Browser tests passed."

  test:e2e:app:
    desc: "Install every module with the demo data and start Odoo for the browser tests, as ci-core does"
    silent: true
    cmds:
      - python tools/scripts/local_compose.py guard-e2e-app
      - . {{.LOG}} && log_step "Installing {{.ALL_MODULES}}"
      - python tools/scripts/local_compose.py up -d --wait postgres
      - python tools/scripts/local_compose.py run --rm -T garage-setup
      - python tools/scripts/local_compose.py run --rm -T odoo -i {{.ALL_MODULES}} --stop-after-init --log-level=warn
      - . {{.LOG}} && log_step "Starting Odoo"
      - python tools/scripts/local_compose.py up -d odoo
      - |
        set -e
        . {{.LOG}}
        if ! curl -fsS --retry 30 --retry-delay 2 --retry-all-errors -o /dev/null {{.E2E_URL}}/web/health; then
          log_error "Odoo did not answer at {{.E2E_URL}}. Read its log with task logs."
          exit 1
        fi
        log_ok "Odoo is ready at {{.E2E_URL}}."

  test:apps:
    desc: "Run the application tests"
    silent: true
    cmds:
      - . tools/scripts/test_apps.sh {{.SYNC_APP_DIR}} {{.MOBILE_APP_DIR}}
