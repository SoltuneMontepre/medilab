version: "3"

set: [pipefail]

env:
  COMPOSE_FILE: tools/infrastructure/docker-compose.yml

vars:
  TEST_DB: medilab_test
  DB_USER: '{{.MEDILAB_DB_USER | default "root"}}'
  COVERAGE_REPORT: src/core/modules/coverage.xml
  E2E_DIR: src/tests
  SYNC_APP_DIR: src/applications/medilab-sync
  LOG: tools/scripts/log.sh

tasks:
  test:
    desc: "Run the Odoo module tests and the application tests"
    cmds:
      - task: test:core
      - task: test:apps

  test:core:
    desc: "Run the Odoo module tests with coverage in a throwaway database; task test:core MODULES=a,b limits them"
    silent: true
    vars:
      MODULES: '{{.MODULES | default "laboratory"}}'
      TAGS: '{{range $i, $m := splitList "," .MODULES}}{{if $i}},{{end}}/{{$m}}{{end}}'
    cmds:
      - docker compose up -d --wait postgres
      - docker compose exec -T postgres dropdb -U {{.DB_USER}} --if-exists {{.TEST_DB}}
      - defer: docker compose exec -T postgres dropdb -U {{.DB_USER}} --if-exists {{.TEST_DB}}
      - |
        docker compose run --rm -T --user root --entrypoint bash odoo -c '
          pip install -q --root-user-action=ignore --break-system-packages coverage
          cd /mnt/extra-addons
          runuser -u odoo -- python3 -m coverage run --branch --source={{.MODULES}} --omit="*/tests/*" --data-file=/tmp/.coverage -m odoo             --db_host "$HOST" --db_user "$USER" --db_password "$PASSWORD"             -d {{.TEST_DB}} -i {{.MODULES}} --test-enable --test-tags "{{.TAGS}}" --stop-after-init --log-level=test
          status=$?
          python3 -m coverage xml --data-file=/tmp/.coverage -o coverage.xml
          exit $status'
      - |
        sed -i 's|filename=.|&src/core/modules/|' {{.COVERAGE_REPORT}}
      - . {{.LOG}} && log_ok "Odoo module tests passed ({{.MODULES}}). Coverage report in {{.COVERAGE_REPORT}}."

  test:uninstall:
    desc: "Install the modules in a throwaway database, uninstall commerce and inventory and check that the Laboratory data is intact"
    silent: true
    vars:
      MODULES: laboratory,commerce,inventory
      STANDALONE_TAG: medilab_uninstall
    cmds:
      - docker compose up -d --wait postgres
      - docker compose exec -T postgres dropdb -U {{.DB_USER}} --if-exists {{.TEST_DB}}
      - defer: docker compose exec -T postgres dropdb -U {{.DB_USER}} --if-exists {{.TEST_DB}}
      - docker compose run --rm -T odoo -d {{.TEST_DB}} -i {{.MODULES}} --stop-after-init --log-level=warn
      - |
        docker compose run --rm -T --entrypoint bash odoo -c '
          export PGHOST="$HOST" PGUSER="$USER" PGPASSWORD="$PASSWORD"
          python3 -m odoo.tests.test_module_operations -d {{.TEST_DB}} standalone {{.STANDALONE_TAG}} 2>&1 | tee /tmp/standalone.log
          ! grep -q "Standalone script .* failed" /tmp/standalone.log'
      - . {{.LOG}} && log_ok "Uninstall test passed."

  test:e2e:
    desc: "Run the browser tests against the running Odoo; task test:e2e needs task up first"
    silent: true
    dir: "{{.E2E_DIR}}"
    cmds:
      - |
        set -e
        unset ELECTRON_RUN_AS_NODE
        bun install --frozen-lockfile
        bun run test
        . {{.ROOT_DIR}}/{{.LOG}}
        log_ok "Browser tests passed."

  test:apps:
    desc: "Run the application tests"
    silent: true
    cmds:
      - |
        set -e
        . {{.LOG}}
        cd {{.SYNC_APP_DIR}}
        log_step "Medilab Sync frontend"
        bun install --frozen-lockfile
        bun test
        if command -v cargo >/dev/null 2>&1; then
          log_step "Medilab Sync backend"
          cargo test --manifest-path src-tauri/Cargo.toml
        else
          log_info "cargo not found, skipping the Rust tests. Install: winget install Rustlang.Rustup"
        fi
        log_ok "Application tests passed."
