version: "3"

vars:
  AI_PROJECT: tools/odoo-intelligence
  AI_RUN: uv run --locked --project tools/odoo-intelligence medilab-odoo
  LOG: tools/scripts/log.sh

tasks:
  ai:setup:
    aliases: [ai]
    desc: "Install worktree-local Serena, OdooLS and the Odoo source for coding clients"
    silent: true
    cmds:
      - |
        set -e
        . {{.LOG}}
        log_step "AI tooling"
        if ! command -v uv >/dev/null 2>&1; then
          log_error "uv not found. Install: https://docs.astral.sh/uv/getting-started/installation/"
          exit 1
        fi
        if ! command -v npx >/dev/null 2>&1; then
          log_error "npx not found. Install Node.js: https://nodejs.org/en/download"
          exit 1
        fi
        if ! command -v git >/dev/null 2>&1; then
          log_error "git not found. Install: https://git-scm.com/downloads"
          exit 1
        fi
        uv sync --quiet --locked --python 3.13 --project {{.AI_PROJECT}}
      - task: ai:odoo-ls
      - |
        . {{.LOG}}
        log_ok "AI tooling ready in this worktree. Start a new client session to load the project MCP servers."

  ai:odoo-ls:
    desc: "Install the checksummed official OdooLS release, typeshed and pinned Odoo Community source"
    silent: true
    cmds:
      - "{{.AI_RUN}} install"

  ai:test:
    desc: "Run the AI tooling tests and lint checks"
    cmds:
      - uv run --directory {{.AI_PROJECT}} --locked pytest -q
      - uv run --directory {{.AI_PROJECT}} --locked ruff check .
      - uv run --directory {{.AI_PROJECT}} --locked ruff format --check .

  ai:verify:
    desc: "Verify core and custom Odoo model and field navigation through MCP"
    cmds:
      - "{{.AI_RUN}} verify"

  ai:cursor-setup:
    desc: "Install the official Odoo extension into an isolated Cursor profile in this worktree"
    silent: true
    cmds:
      - "{{.AI_RUN}} cursor-setup"
