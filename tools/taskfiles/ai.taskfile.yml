version: "3"

vars:
  AI_PROJECT: tools/odoo-intelligence
  AI_RUN: uv run --locked --project {{.AI_PROJECT}} medilab-odoo
  LOG: tools/scripts/log.sh
  CLOUD_ENV_TEMPLATE: tools/cloud/cloud.env.example
  CLOUD_ENV_FILE: .local/cloud.env
  PLANTUML_SCRIPT: tools/scripts/ai_plantuml.py
  # Upstream publishes no jar, so it is built from this commit; the jar path is the plantuml-java entry of .mcp.json
  PLANTUML_MCP_REPOSITORY: https://github.com/plantuml/plantuml-mcp.git
  PLANTUML_MCP_COMMIT: 80e3322fdc734ac7a75a0249fa2a264cb518c286
  PLANTUML_MCP_DIR: .local/plantuml-mcp
  PLANTUML_MCP_JAR: .local/plantuml-mcp/build/libs/plantuml-mcp-1.0.0.jar
  # The port is PLANTUML_SERVER_URL of the plantuml-infobip entry of .mcp.json
  PLANTUML_SERVER_IMAGE: plantuml/plantuml-server:jetty-v1.2026.8
  PLANTUML_SERVER_NAME: plantuml-server
  PLANTUML_SERVER_PORT: 8090

tasks:
  ai:setup:
    aliases: [ai]
    desc: "Install worktree-local Serena, OdooLS and the Odoo source for coding clients"
    silent: true
    cmds:
      - . tools/scripts/ai_setup.sh {{.AI_PROJECT}}
      - task: ai:odoo-ls
      - |
        . {{.LOG}}
        log_ok "AI tooling ready in this worktree. Start a new client session to load the project MCP servers."

  ai:odoo-ls:
    desc: "Install the checksummed official OdooLS release, typeshed and pinned Odoo Community source"
    silent: true
    cmds:
      - |
        if {{.AI_RUN}} install --quiet-status; then
          . {{.LOG}}
          log_ok "OdooLS and Odoo source ready."
        else
          status=$?
          . {{.LOG}}
          log_error "OdooLS and Odoo source installation failed."
          exit "$status"
        fi

  ai:test:
    desc: "Run the AI tooling tests and lint checks"
    cmds:
      - uv run --locked --directory {{.AI_PROJECT}} pytest -q -rs
      - uv run --locked --directory {{.AI_PROJECT}} ruff check .
      - uv run --locked --directory {{.AI_PROJECT}} ruff format --check .

  ai:verify:
    desc: "Verify core and custom Odoo model and field navigation through MCP"
    cmds:
      - "{{.AI_RUN}} verify"

  ai:env:
    desc: "Write the variables of a Claude Code cloud environment to {{.CLOUD_ENV_FILE}} from Doppler, ready to paste"
    silent: true
    cmds:
      - task: doppler
      - . tools/scripts/ai_env.sh {{.CLOUD_ENV_TEMPLATE}} {{.CLOUD_ENV_FILE}} {{.DOPPLER_PROJECT}} {{.DOPPLER_CONFIG}}

  ai:plantuml:
    desc: "Build the pinned jar of the plantuml-java MCP server; needs Java 21+"
    silent: true
    cmds:
      - |
        set -e
        . {{.LOG}}
        log_step "plantuml-java MCP server"
        log_info "Building plantuml-mcp with Gradle. The first build takes a few minutes."
        message=$(python {{.PLANTUML_SCRIPT}} jar --directory {{.PLANTUML_MCP_DIR}} --repository {{.PLANTUML_MCP_REPOSITORY}} --commit {{.PLANTUML_MCP_COMMIT}} --jar {{.PLANTUML_MCP_JAR}})
        log_ok "$message"

  ai:plantuml-server:
    desc: "Start the local PlantUML server the plantuml-infobip MCP server renders with"
    silent: true
    cmds:
      - |
        set -e
        . {{.LOG}}
        message=$(python {{.PLANTUML_SCRIPT}} server --image {{.PLANTUML_SERVER_IMAGE}} --name {{.PLANTUML_SERVER_NAME}} --port {{.PLANTUML_SERVER_PORT}})
        log_ok "$message"

  ai:cursor-setup:
    desc: "Install the official Odoo extension into an isolated Cursor profile in this worktree"
    silent: true
    cmds:
      - "{{.AI_RUN}} cursor-setup"
