version: "3"

vars:
  AI_PROJECT: tools/odoo-intelligence
  AI_RUN: uv run --locked --project {{.AI_PROJECT}} medilab-odoo
  LOG: tools/scripts/log.sh

tasks:
  ai:setup:
    aliases: [ai]
    desc: "Install worktree-local Serena, OdooLS and the Odoo source for coding clients"
    silent: true
    cmds:
      - . tools/scripts/ai_setup.sh {{.AI_PROJECT}}
      - task: ai:odoo-ls
      - |
        . {{.LOG}}
        log_ok "AI tooling ready in this worktree. Start a new client session to load the project MCP servers."

  ai:odoo-ls:
    desc: "Install the checksummed official OdooLS release, typeshed and pinned Odoo Community source"
    silent: true
    cmds:
      - "{{.AI_RUN}} install"

  ai:test:
    desc: "Run the AI tooling tests and lint checks"
    cmds:
      - uv run --locked --directory {{.AI_PROJECT}} pytest -q -rs
      - uv run --locked --directory {{.AI_PROJECT}} ruff check .
      - uv run --locked --directory {{.AI_PROJECT}} ruff format --check .

  ai:verify:
    desc: "Verify core and custom Odoo model and field navigation through MCP"
    cmds:
      - "{{.AI_RUN}} verify"

  ai:cursor-setup:
    desc: "Install the official Odoo extension into an isolated Cursor profile in this worktree"
    silent: true
    cmds:
      - "{{.AI_RUN}} cursor-setup"
