version: "3"

set: [pipefail]

env:
  COMPOSE_FILE: tools/infrastructure/docker-compose.yml

vars:
  LOG: tools/scripts/log.sh
  # The app reads provider secrets from its environment, so Compose runs under Doppler.
  COMPOSE: "{{.DOPPLER_RUN}} docker compose"

tasks:
  up:
    aliases: [start]
    desc: "Start the local infrastrucure and application"
    silent: true
    cmds:
      - "{{.COMPOSE}} up -d"
      - task: print

  stop:
    desc: "Stop the running container."
    silent: true
    cmds:
      - docker compose down

  restart:
    desc: "Restart Odoo after changing modules or config"
    silent: true
    cmds:
      - "{{.COMPOSE}} restart odoo"

  logs:
    desc: "Follow the app's log"
    cmds:
      - docker compose logs -f odoo

  upgrade:
    desc: "Upgrade installed modules; task upgrade MODULES=a,b installs and upgrades those"
    silent: true
    vars:
      MODULES: '{{.MODULES | default "all"}}'
    cmds:
      - docker compose up -d postgres
      - docker compose stop odoo
      - |
        if [ "{{.MODULES}}" = "all" ]; then
          {{.COMPOSE}} run --rm -T odoo --stop-after-init -u all
        else
          {{.COMPOSE}} run --rm -T odoo --stop-after-init -i "{{.MODULES | replace " " ","}}" -u "{{.MODULES | replace " " ","}}"
        fi
      - "{{.COMPOSE}} up -d"
      - . {{.LOG}} && log_ok "Modules upgraded ({{.MODULES}})."
      - task: print

  reset:
    aliases: [wipe]
    desc: "Delete the database and volumes, then start from scratch"
    silent: true
    cmds:
      - docker compose down -v
      - task: up
      - task: upgrade

  print:
    silent: true
    internal: true
    cmds:
      - |
        . {{.LOG}}
        printf '\n'
        log_ok "Local infrastructure is started:"
        log_link "Odoo" "http://localhost:8069"
        log_link "CloudBeaver" "http://localhost:8978"
