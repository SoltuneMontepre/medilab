version: "3"

set: [pipefail]

env:
  COMPOSE_FILE: tools/infrastructure/docker-compose.yml

vars:
  LOG: tools/scripts/log.sh

tasks:
  up:
    aliases: [start]
    desc: "Build the Odoo image unless MEDILAB_ODOO_IMAGE names another, then start the local infrastructure and application"
    silent: true
    cmds:
      - |
        if [ -n "${MEDILAB_ODOO_IMAGE:-}" ]; then
          docker compose up -d --no-build
        else
          BUILDAH_FORMAT=docker . tools/scripts/run_strict.sh docker compose up -d --build
        fi
      - task: print

  stop:
    desc: "Stop the running container."
    silent: true
    cmds:
      - . tools/scripts/compose_down.sh

  restart:
    desc: "Restart Odoo after changing modules or config"
    silent: true
    cmds:
      - docker compose restart odoo

  logs:
    desc: "Follow the app's log"
    cmds:
      - docker compose logs -f odoo

  upgrade:
    desc: "Upgrade installed modules; task upgrade MODULES=a,b installs and upgrades those"
    silent: true
    vars:
      MODULES: '{{.MODULES | default "all"}}'
    cmds:
      - docker compose up -d postgres
      - |
        project="${COMPOSE_PROJECT_NAME:-medilab}"
        running="$(docker ps -q --filter "label=io.podman.compose.project=${project}" --filter "label=io.podman.compose.service=odoo" --filter status=running)"
        if [[ -n "$running" ]]; then
          docker compose stop odoo
        fi
      - |
        . tools/scripts/odoo_upgrade.sh "{{.MODULES | replace " " ","}}"
      - docker compose up -d
      - . {{.LOG}} && log_ok "Modules upgraded ({{.MODULES}})."
      - task: print

  reset:
    aliases: [wipe]
    desc: "Delete the database and volumes, then start from scratch"
    silent: true
    cmds:
      - . tools/scripts/compose_down.sh -v
      - |
        if [[ -z "${MEDILAB_ODOO_IMAGE:-}" ]]; then
          BUILDAH_FORMAT=docker . tools/scripts/run_strict.sh docker compose build odoo
          docker compose up -d postgres garage garage-setup cloudbeaver
        else
          docker compose up -d --no-build postgres garage garage-setup cloudbeaver
        fi
      - task: upgrade

  print:
    silent: true
    internal: true
    cmds:
      - |
        . {{.LOG}}
        printf '\n'
        log_ok "Local infrastructure is started:"
        log_link "Odoo" "http://localhost:${MEDILAB_ODOO_PORT:-8069}"
        log_link "CloudBeaver" "http://localhost:${MEDILAB_CLOUDBEAVER_PORT:-8978}"
