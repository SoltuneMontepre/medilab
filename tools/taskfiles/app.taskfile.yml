version: "3"

set: [pipefail]

env:
  COMPOSE_FILE: tools/infrastructure/docker-compose.yml

tasks:
  up:
    aliases: [setup, start]
    desc: "Start the local infrastrucure and application"
    silent: true
    cmds:
      - docker compose up -d
      - |
        echo -e "\n[COMPLETED] Local infrastructure is started:"
        echo "  Odoo        http://localhost:8069"
        echo "  CloudBeaver http://localhost:8978"

  stop:
    desc: "Stop the running container."
    silent: true
    cmds:
      - docker compose down

  restart:
    desc: "Restart Odoo after changing modules or config"
    silent: true
    cmds:
      - docker compose restart odoo

  logs:
    desc: "Follow the app's log"
    cmds:
      - docker compose logs -f odoo

  upgrade:
    desc: "Upgrade installed modules (all by default); task upgrade MODULES=a,b installs and upgrades those"
    silent: true
    vars:
      MODULES: '{{.MODULES | default "all"}}'
    cmds:
      - docker compose up -d postgres
      - docker compose stop odoo
      - |
        if [ "{{.MODULES}}" = "all" ]; then
          docker compose run --rm -T odoo --stop-after-init -u all
        else
          docker compose run --rm -T odoo --stop-after-init -i "{{.MODULES | replace " " ","}}" -u "{{.MODULES | replace " " ","}}"
        fi
      - docker compose up -d odoo
      - echo "[COMPLETED] Modules upgraded ({{.MODULES}})."

  reset:
    aliases: [wipe]
    desc: "Delete the database and volumes, then start from scratch"
    silent: true
    cmds:
      - docker compose down -v
      - task: up
