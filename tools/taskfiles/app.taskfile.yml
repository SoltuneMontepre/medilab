version: "3"

set: [pipefail]

env:
  COMPOSE_FILE: tools/infrastructure/docker-compose.yml

vars:
  LOG: tools/scripts/log.sh

tasks:
  up:
    aliases: [start]
    desc: "Build the Odoo image unless MEDILAB_ODOO_IMAGE names another, then start the local infrastructure and application"
    silent: true
    cmds:
      - |
        if [ -n "${MEDILAB_ODOO_IMAGE:-}" ]; then
          python tools/scripts/local_compose.py up -d --no-build
        else
          python tools/scripts/local_compose.py up -d --build
        fi
      - task: print

  stop:
    desc: "Stop the running container."
    silent: true
    cmds:
      - python tools/scripts/local_compose.py down

  restart:
    desc: "Restart Odoo after changing modules or config"
    silent: true
    cmds:
      - python tools/scripts/local_compose.py restart odoo

  logs:
    desc: "Follow the app's log"
    cmds:
      - python tools/scripts/colorize_odoo_logs.py --stdout-color auto --stderr-color auto -- python tools/scripts/local_compose.py logs --no-log-prefix -f odoo

  upgrade:
    desc: "Upgrade installed modules; task upgrade MODULES=a,b installs and upgrades those"
    silent: true
    vars:
      MODULES: '{{.MODULES | default "all"}}'
    cmds:
      - python tools/scripts/local_compose.py up -d postgres
      - python tools/scripts/local_compose.py guard-demo-install "{{.MODULES}}"
      - python tools/scripts/local_compose.py stop odoo
      - |
        . {{.LOG}}
        stdout_color=false
        stderr_color=false
        if log__color_enabled 1; then stdout_color=true; fi
        if log__color_enabled 2; then stderr_color=true; fi
        if [ "{{.MODULES}}" = "all" ]; then
          python tools/scripts/colorize_odoo_logs.py --stdout-color "$stdout_color" --stderr-color "$stderr_color" -- python tools/scripts/local_compose.py run --rm -T odoo --stop-after-init -u all
        else
          python tools/scripts/colorize_odoo_logs.py --stdout-color "$stdout_color" --stderr-color "$stderr_color" -- python tools/scripts/local_compose.py run --rm -T odoo --stop-after-init -i "{{.MODULES | replace " " ","}}" -u "{{.MODULES | replace " " ","}}"
        fi
      - python tools/scripts/local_compose.py up -d
      - . {{.LOG}} && log_ok "Modules upgraded ({{.MODULES}})."
      - task: print

  reset:
    aliases: [wipe]
    desc: "Recreate only a verified fresh local demo environment after owner confirmation"
    silent: true
    interactive: true
    cmds:
      - python tools/scripts/demo_bootstrap.py reset
      - task: setup:fresh

  clean:
    desc: "Delete a verified fresh local demo environment, its image and its selection after owner confirmation, without recreating it"
    silent: true
    interactive: true
    cmds:
      - python tools/scripts/demo_bootstrap.py clean

  print:
    silent: true
    internal: true
    cmds:
      - |
        . {{.LOG}}
        printf '\n'
        log_ok "Local infrastructure is started:"
        log_link "Odoo" "http://localhost:${MEDILAB_ODOO_PORT:-8069}"
        log_link "CloudBeaver" "http://localhost:${MEDILAB_CLOUDBEAVER_PORT:-8978}"
