version: "3"

vars:
  PROJECT_DIR: src/core
  UV: uv --project {{.PROJECT_DIR}}
  ODOO_SOURCE_DIR: .local/odoo-source
  ODOO_SOURCE_REVISION: 7bbce824a1897a912441a7f0511ffec505cbe1d5
  ODOO_ADDONS: [web]
  LINT_TARGET: src/core/modules
  DOPPLER_PROJECT: medilab
  DOPPLER_CONFIG: dev
  LOG: tools/scripts/log.sh
  DOPPLER: tools/scripts/doppler.sh

tasks:
  dev:setup:
    aliases: [setup-dev]
    desc: "Sync the uv environment and fetch the Odoo source for type checking"
    cmds:
      - task: dev:sync
      - task: dev:odoo-source

  doppler:
    desc: "Authenticate Doppler (paste token or browser login) and select the project and config"
    silent: true
    interactive: true
    status:
      - reg query "HKCU\Environment" /v DOPPLER_TOKEN
      - doppler whoami
      - '[ "$(doppler configure get project --plain)" = "{{.DOPPLER_PROJECT}}" ]'
      - '[ "$(doppler configure get config --plain)" = "{{.DOPPLER_CONFIG}}" ]'
    cmds:
      - |
        . {{.LOG}}
        . {{.DOPPLER}}
        log_step "Doppler"
        doppler_login
        doppler setup --no-interactive --project {{.DOPPLER_PROJECT}} --config {{.DOPPLER_CONFIG}}
        doppler_user_token {{.DOPPLER_PROJECT}} {{.DOPPLER_CONFIG}}
        log_ok "Doppler ready. Restart your editor so it picks up DOPPLER_TOKEN."

  dev:sync:
    desc: "Create {{.PROJECT_DIR}}/.venv from pyproject.toml and uv.lock, runtime and dev dependencies"
    silent: true
    cmds:
      - |
        set -e
        . {{.LOG}}
        log_step "Python environment"
        if ! command -v uv >/dev/null 2>&1; then
          log_error "uv not found. Install: winget install astral-sh.uv"
          exit 1
        fi
        {{.UV}} sync
        log_ok "{{.PROJECT_DIR}}/.venv ready. Select it as the interpreter in your editor."

  dev:lock:
    desc: "Re-resolve uv.lock after editing dependencies; task dev:lock UPGRADE=1 upgrades every package"
    cmds:
      - "{{.UV}} lock {{if .UPGRADE}}--upgrade{{end}}"

  dev:odoo-source:
    desc: "Fetch the pinned Odoo 19 source (no Docker) so the editor and pyright can resolve odoo imports"
    silent: true
    cmds:
      - |
        set -e
        . {{.LOG}}
        DIR="{{.ODOO_SOURCE_DIR}}"
        REV="{{.ODOO_SOURCE_REVISION}}"
        log_step "Odoo source"
        if [ ! -d "$DIR" ]; then
          log_info "Downloading Odoo 19.0 at ${REV:0:7}. This takes a minute."
          git clone --quiet --depth 1 --filter=blob:none --sparse --branch 19.0 https://github.com/odoo/odoo.git "$DIR"
          git -C "$DIR" fetch --quiet --depth 1 origin "$REV"
          git -C "$DIR" -c advice.detachedHead=false checkout --quiet --detach "$REV"
        fi
        log_info "Checking out odoo and addons: {{.ODOO_ADDONS | join ", "}}"
        git -C "$DIR" sparse-checkout set odoo {{range .ODOO_ADDONS}}addons/{{.}} {{end}}
        # pyright resolves odoo.addons.<name> only inside odoo/addons, so copy the addons there.
        for ADDON in {{range .ODOO_ADDONS}}{{.}} {{end}}; do
          rm -rf "$DIR/odoo/addons/$ADDON"
          cp -r "$DIR/addons/$ADDON" "$DIR/odoo/addons/$ADDON"
        done
        if [ "$(git -C "$DIR" rev-parse HEAD)" != "$REV" ] || [ ! -f "$DIR/odoo/fields/__init__.py" ]; then
          log_error "$DIR is not at $REV; delete it and run again."
          exit 1
        fi
        log_ok "Odoo source ready in $DIR."

  typecheck:
    desc: "Type check the addons with pyright"
    cmds:
      - "{{.UV}} run pyright"

  lint:
    desc: "Ruff check and pylint-odoo on the addons"
    cmds:
      - "{{.UV}} run ruff check {{.LINT_TARGET}}"
      - "{{.UV}} run pylint --rcfile={{.PROJECT_DIR}}/.pylintrc {{.LINT_TARGET}}/*"

  format:
    desc: "Ruff format the addons"
    cmds:
      - "{{.UV}} run ruff format {{.LINT_TARGET}}"
