version: "3"

vars:
  PROJECT_DIR: src/core
  UV: uv --project {{.PROJECT_DIR}}
  ODOO_SOURCE_DIR: .local/odoo-source
  ODOO_SOURCE_REVISION: 7434faa93558d4f46fdda77acd1be4dfc663ea7c
  ODOO_ADDONS: [web, account, auth_signup, portal]
  MODULES_DIR: src/core/modules
  LINT_TARGET: "{{.MODULES_DIR}}"
  TYPECHECK_DIR: tools/typecheck
  LOG: tools/scripts/log.sh
  DOPPLER: tools/scripts/doppler.sh

tasks:
  dev:setup:
    aliases: [setup-dev]
    desc: "Sync the uv environment and fetch the Odoo source for type checking"
    cmds:
      - task: dev:sync
      - task: dev:odoo-source

  doppler:
    desc: "Authenticate Doppler (paste token or browser login) and select the project and config"
    silent: true
    interactive: true
    status:
      - doppler whoami
      - '[ "$(doppler configure get project --plain)" = "{{.DOPPLER_PROJECT}}" ]'
      - '[ "$(doppler configure get config --plain)" = "{{.DOPPLER_CONFIG}}" ]'
    cmds:
      - |
        . {{.LOG}}
        . {{.DOPPLER}}
        log_step "Doppler"
        doppler_login
        doppler setup --no-interactive --project {{.DOPPLER_PROJECT}} --config {{.DOPPLER_CONFIG}}
        log_ok "Doppler ready."

  dev:sync:
    desc: "Create {{.PROJECT_DIR}}/.venv from pyproject.toml and uv.lock, runtime and dev dependencies"
    silent: true
    cmds:
      - |
        set -e
        . {{.LOG}}
        log_step "Python environment"
        if ! command -v uv >/dev/null 2>&1; then
          log_error "uv not found. Install: https://docs.astral.sh/uv/getting-started/installation/"
          exit 1
        fi
        {{.UV}} sync
        log_ok "{{.PROJECT_DIR}}/.venv ready. Select it as the interpreter in your editor."

  dev:lock:
    desc: "Re-resolve uv.lock after editing dependencies; task dev:lock UPGRADE=1 upgrades every package"
    cmds:
      - "{{.UV}} lock {{if .UPGRADE}}--upgrade{{end}}"

  dev:odoo-source:
    desc: "Fetch the pinned Odoo 20 source (no Docker) and link the addons and modules into it, so the editor and pyright resolve odoo imports"
    silent: true
    cmds:
      - . tools/scripts/odoo_source.sh {{.ODOO_SOURCE_DIR}} {{.ODOO_SOURCE_REVISION}} {{.ODOO_ADDONS | join " "}}
      - task: dev:odoo-links
      - . {{.LOG}} && log_ok "Odoo source ready in {{.ODOO_SOURCE_DIR}}."

  dev:odoo-links:
    internal: true
    silent: true
    cmds:
      - "{{.UV}} run python {{.TYPECHECK_DIR}}/link_addons.py {{.ODOO_SOURCE_DIR}} {{.MODULES_DIR}} {{.ODOO_ADDONS | join \" \"}}"

  typecheck:
    desc: "Type check the modules with pyright"
    cmds:
      - task: dev:odoo-links
      - "{{.UV}} run python {{.TYPECHECK_DIR}}/typecheck.py"

  lint:
    desc: "Ruff check and pylint-odoo on the addons"
    cmds:
      - "{{.UV}} run ruff check {{.LINT_TARGET}}"
      - "{{.UV}} run pylint --rcfile={{.PROJECT_DIR}}/.pylintrc {{.LINT_TARGET}}/*/"

  format:
    desc: "Ruff format the addons"
    cmds:
      - "{{.UV}} run ruff format {{.LINT_TARGET}}"
