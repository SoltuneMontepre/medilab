[project]
name = "medilab"
version = "0.0.0"
description = "MediLab LIMS — Odoo 20 addons"
requires-python = ">=3.12"
dependencies = [
    "a2wsgi==1.10.10",
    "boto3==1.43.94",
    "docxtpl==0.20.2",
    "fastapi==0.141.1",
    "html2text==2025.4.15",
    "httpx2==2.13.0",
    "ipython==9.17.1",
    "packaging==26.3",
    "parse-accept-language==0.1.2",
    "pillow==12.3.0",
    "python-docx==1.2.0",
    "python-multipart==0.0.32",
    "qrcode==8.2",
    "requests==2.31.0",
    "ujson==6.0.0",
]

[dependency-groups]
dev = [
    "pylint-odoo>=10.0.12",
    "pyright>=1.1.400",
    "ruff>=0.15.0",
]

# The addons are loaded by Odoo from addons_path, not installed as a package,
# so uv only manages the environment and the lock file.
[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 120
src = ["modules"]
extend-exclude = [
    "**/static/lib/**",
    "**/.venv/**",
    "**/venv/**",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.ruff.lint]
preview = true
external = ["OLS"]
select = [
    "BLE",
    "C",
    "COM",
    "E",
    "EM",
    "EXE",
    "F",
    "FA",
    "FLY",
    "G",
    "I",
    "ICN",
    "INT",
    "ISC",
    "LOG",
    "PGH",
    "PIE",
    "PLC",
    "PLE",
    "PLW",
    "PYI",
    "RET",
    "RUF",
    "SIM",
    "SLOT",
    "T",
    "TC",
    "TID",
    "TRY",
    "UP",
    "W",
    "YTT",
]
ignore = [
    "C408",
    "C420",
    "C901",
    "BLE001",
    "COM812",
    "E266",
    "E402",
    "E501",
    "E713",
    "EM101",
    "EM102",
    "FA100",
    "G002",
    "G003",
    "G004",
    "PGH003",
    "PIE790",
    "PIE808",
    "PLC0415",
    "PLC2701",
    "PLW0642",
    "PLW0717",
    "PLW1510",
    "PLW2901",
    "RUF001",
    "RUF005",
    "RUF012",
    "RUF067",
    "RUF100",
    "SIM102",
    "SIM108",
    "SIM113",
    "SIM117",
    "TID252",
    "TRY003",
    "TRY300",
    "TRY400",
    "UP022",
    "UP030",
    "UP031",
]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401"]

[tool.ruff.lint.isort]
section-order = [
    "future",
    "standard-library",
    "third-party",
    "first-party",
    "local-folder",
]
known-first-party = ["odoo"]
known-local-folder = ["odoo.addons"]
