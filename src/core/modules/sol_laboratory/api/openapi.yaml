  /tasks:
    get:
      operationId: listTasks
      tags: [Tasks]
      summary: Lists the person's open tasks, their finished tasks or the tasks waiting in their queues.
      description: |
        The same tasks in the same order as the web's lists: `open`, the tasks assigned to the person and not
        finished, soonest deadline first and those without one last; `finished`, their done tasks, latest first;
        `queue`, the unassigned tasks of the queues they can claim from, soonest deadline first. `next_after` is the
        `after` of the next page, or empty after the last one.
