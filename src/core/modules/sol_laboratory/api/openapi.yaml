          $ref: "#/components/responses/MethodNotAllowed"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/Unavailable"
    post:
      operationId: addFolderRule
      summary: Adds a sync rule; a rule of the same kind and pattern answers with the one the folder has.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewRule"
      responses:
        "200":
          description: The sync rule.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OneRule"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/Unavailable"
  /folders/{folder_id}/rules/{rule_id}:
    parameters:
        - name: folder_id
          in: path
          required: true
          schema:
            type: integer
        - name: rule_id
          in: path
          required: true
          schema:
            type: integer
    patch:
      operationId: changeFolderRule
      summary: Changes a sync rule.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RuleChange"
      responses:
        "200":
          description: The sync rule.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OneRule"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/Unavailable"
    delete:
      operationId: removeFolderRule
      summary: Removes a sync rule; a rule already removed is gone.
      responses:
        "204":
          description: The rule is not in the folder any more.
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/Unavailable"
  /folders/{folder_id}/uploads:
    parameters:
      - name: folder_id
        in: path
        required: true
        schema:
          type: integer
    post:
      operationId: prepareUpload
      summary: Prepares the upload of a file's content to the path of the folder, from the version it was based on.
      description: |
        The person must be able to write the file: a lock someone else holds refuses it before any byte is sent. When
        the file's current version has the claimed SHA-256, nothing is uploaded and the upload is `unchanged`.
        Otherwise the content goes to an object of its own, in parts of `part_size` bytes but the last, through the
        addresses of `uploadParts`, even when the same content is stored already. The size and SHA-256 are claims:
        the server reads the object and verifies them once the upload is finalized. Repeating the request with its
        `Idempotency-Key` answers with the same upload.
      parameters:
        - $ref: "#/components/parameters/RequiredIdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewUpload"
      responses:
        "200":
          description: The upload.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OneUpload"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "409":
          $ref: "#/components/responses/UploadConflict"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/StorageUnavailable"
  /folders/{folder_id}/uploads/{upload_id}:
    parameters:
      - name: folder_id
        in: path
        required: true
        schema:
          type: integer
      - name: upload_id
        in: path
        required: true
        schema:
          type: integer
    get:
      operationId: getUpload
      summary: Gives an upload the computer prepared, which it reads until the upload ends.
      responses:
        "200":
          description: The upload.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OneUpload"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/StorageUnavailable"
  /folders/{folder_id}/uploads/{upload_id}/parts:
    parameters:
      - name: folder_id
        in: path
        required: true
        schema:
          type: integer
      - name: upload_id
        in: path
        required: true
        schema:
          type: integer
    post:
      operationId: uploadParts
      summary: Gives the presigned addresses that upload the parts of the numbers with a PUT.
      description: |
        Each address writes one part of this upload only, and nothing once the upload is completed or aborted. The
        addresses stop working at `expires_at`; ask again for the parts not uploaded by then.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PartRequest"
      responses:
        "200":
          description: The addresses of the parts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PartAddresses"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "409":
          $ref: "#/components/responses/UploadConflict"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/StorageUnavailable"
  /folders/{folder_id}/uploads/{upload_id}/finalize:
    parameters:
      - name: folder_id
        in: path
        required: true
        schema:
          type: integer
      - name: upload_id
        in: path
        required: true
        schema:
          type: integer
    post:
      operationId: finalizeUpload
      summary: Finalizes an upload once every part is uploaded; the server then verifies and stores it.
      description: |
        The upload is `verifying` until the server has read its object: then it is `completed`, `conflict` when it was
        made from a version that is no longer current, `unchanged` when the file already had the content, `failed`
        when the content is not the one claimed, or `refused` with the code of what refused it, such as `locked`; a
        refused upload is finalized again once that is gone, until it expires. Finalizing an upload past finalizing
        answers with it.
      responses:
        "202":
          description: The upload, being verified.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OneUpload"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "409":
          $ref: "#/components/responses/UploadConflict"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/StorageUnavailable"
  /folders/{folder_id}/files/{file_id}/lock:
    parameters:
      - name: folder_id
        in: path
        required: true
        schema:
          type: integer
      - name: file_id
        in: path
        required: true
        schema:
          type: integer
    post:
      operationId: lockFile
      summary: Locks a file the person edits in their own program, so nobody else saves it meanwhile.
      description: |
        Locking a file the person already holds a lock in force on renews that lock. Only files that are neither raw
        data nor Office documents, in folders of working documents, of results or of no category, are locked.
      responses:
        "200":
          description: The person's lock.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OneLock"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/Unavailable"
    delete:
      operationId: unlockFile
      summary: Unlocks the person's lock on a file; a person holding none has nothing to unlock.
      responses:
        "204":
          description: The person holds no lock on the file any more.
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/Unavailable"
  /folders/{folder_id}/files/{file_id}/lock/renew:
    parameters:
      - name: folder_id
        in: path
        required: true
        schema:
          type: integer
      - name: file_id
        in: path
        required: true
        schema:
          type: integer
    post:
      operationId: renewFileLock
      summary: Renews the person's lock in force for the lock duration from now.
      description: A lock that expired is not renewed, as someone may have saved the file meanwhile; it is locked again.
      responses:
        "200":
          description: The person's lock.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OneLock"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/Unavailable"
  /folders/{folder_id}/files:
    parameters:
      - name: folder_id
        in: path
        required: true
        schema:
          type: integer
    get:
      operationId: listFiles
      summary: Gives the folder's files with their current versions and locks, in the order of their ids.
      description: |
        A computer hydrates a folder it binds from these and checks them against its own files. Files are never renamed
        or deleted, so a file listed once stays listed. `next_after` is the `after` of the next page, or empty after the
        last one.
      parameters:
        - name: after
          in: query
          required: false
          description: The id of the last one the computer has; 0 or none from the start.
          schema:
            type: string
            pattern: "^[0-9]{1,18}$"
        - name: limit
          in: query
          required: false
          description: How many to give, from 1 to 100; 50 by default.
          schema:
            type: string
            pattern: "^(100|[1-9][0-9]?)$"
      responses:
        "200":
          description: The files.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileList"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/Unavailable"
  /folders/{folder_id}/files/{file_id}/versions:
    parameters:
      - name: folder_id
        in: path
        required: true
        schema:
          type: integer
      - name: file_id
        in: path
        required: true
        schema:
          type: integer
    get:
      operationId: listVersions
      summary: Gives the history of a file, every version newest first.
      responses:
        "200":
          description: The versions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VersionList"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/Unavailable"
  /folders/{folder_id}/files/{file_id}/versions/{version_id}/download:
    parameters:
      - name: folder_id
        in: path
        required: true
        schema:
          type: integer
      - name: file_id
        in: path
        required: true
        schema:
          type: integer
      - name: version_id
        in: path
        required: true
        schema:
          type: integer
    post:
      operationId: downloadVersion
      summary: Gives a presigned address that downloads the version's content straight from the bucket with a GET.
      description: |
        The address reads that version's content only, writes nothing, and stops working at `expires_at`. The download
        is recorded in the audit trail. A version's content is reached only this way, never by its SHA-256.
      responses:
        "200":
          description: The download address.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Download"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/Unavailable"
  /folders/{folder_id}/files/{file_id}/versions/{version_id}/restore:
    parameters:
      - name: folder_id
        in: path
        required: true
        schema:
          type: integer
      - name: file_id
        in: path
        required: true
        schema:
          type: integer
      - name: version_id
        in: path
        required: true
        schema:
          type: integer
    post:
      operationId: restoreVersion
      summary: Restores the version as the file's new current version, with its content; no byte is copied.
      description: |
        A restore always adds a version. Repeating the request with its `Idempotency-Key` answers with the version it
        added.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: The version added.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OneVersion"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/Unavailable"
  /folders/{folder_id}/changes:
    parameters:
      - name: folder_id
        in: path
        required: true
        schema:
          type: integer
    get:
      operationId: listChanges
      summary: Gives the changes to the current versions of the folder's files after the last one the computer saw.
      description: |
        Changes are given in the order of their ids, and a change never commits after one of a higher id in the same
        folder, so a computer that asks from the last id it saw misses none. Renaming and deleting are never passed
        between computers. `next_after` is the `after` of the next page, or empty after the last one.
      parameters:
        - name: after
          in: query
          required: false
          description: The id of the last one the computer has; 0 or none from the start.
          schema:
            type: string
            pattern: "^[0-9]{1,18}$"
        - name: limit
          in: query
          required: false
          description: How many to give, from 1 to 100; 50 by default.
          schema:
            type: string
            pattern: "^(100|[1-9][0-9]?)$"
      responses:
        "200":
          description: The changes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChangeList"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/Unavailable"
components:
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: A key the computer generates for the request, unique for the computer.
      schema:
        type: string
        pattern: "^[A-Za-z0-9._:-]{1,200}$"
    RequiredIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: A key the computer generates for the request, unique for the computer.
      schema:
        type: string
        pattern: "^[A-Za-z0-9._:-]{1,200}$"
  securitySchemes:
    deviceKey:
      type: http
      scheme: bearer
      description: The key a computer got by signing in. A browser session never takes its place.
  headers:
    Allow:
      description: The methods the route takes.
      required: true
      schema:
        type: string
    RetryAfter:
      description: Seconds to wait before calling again.
      required: true
      schema:
        type: integer
        minimum: 1
    WwwAuthenticate:
      description: The key a call needs.
      required: true
      schema:
        type: string
  schemas:
    Name:
      description: One name, never a path on a computer.
      type: string
      minLength: 1
      pattern: "^[^/\\\\:]+$"
    Health:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          const: pass
    Readiness:
      type: object
      additionalProperties: false
      required: [status, checks]
      properties:
        status:
          enum: [pass, fail]
        checks:
          description: Each check by name, such as `database`, and whether it passes.
          type: object
          additionalProperties:
            enum: [pass, fail]
    SignIn:
      type: object
      additionalProperties: false
      required: [login, password, client_uid, name, platform]
      properties:
        login:
          type: string
          minLength: 1
        password:
          description: The password, or an Odoo API key for a person with two-factor authentication. It is never kept.
          type: string
          minLength: 1
        client_uid:
          description: The id the application generates once per installation.
          $ref: "#/components/schemas/Name"
        name:
          description: The name of the computer, or the phone's model.
          $ref: "#/components/schemas/Name"
        platform:
          $ref: "#/components/schemas/Platform"
    Platform:
      description: "`linux` or `windows` for a computer running Medilab Sync, `android` or `ios` for a phone running Medilab Mobile."
      enum: [linux, windows, android, ios]
    Device:
      type: object
      additionalProperties: false
      required: [id, name, platform, status, last_seen_at, revoked_at, current]
      properties:
        id:
          type: integer
        name:
          type: string
        platform:
          $ref: "#/components/schemas/Platform"
        status:
          enum: [signed_in, signed_out, revoked]
        last_seen_at:
          description: When the device last called the API, to the minute.
          type: [string, "null"]
          format: date-time
        revoked_at:
          type: [string, "null"]
          format: date-time
        current:
          description: Whether this is the device of the key.
          type: boolean
    SignedIn:
      type: object
      additionalProperties: false
      required: [key, device]
      properties:
        key:
          description: The device's key, for the Authorization header. It does not expire.
          type: string
        device:
          $ref: "#/components/schemas/Device"
    DeviceList:
      type: object
      additionalProperties: false
      required: [devices]
      properties:
        devices:
          type: array
          items:
            $ref: "#/components/schemas/Device"
    RevokedDevice:
      type: object
      additionalProperties: false
      required: [device]
      properties:
        device:
          $ref: "#/components/schemas/Device"
    PushToken:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token:
          description: The registration token Firebase Cloud Messaging gave the app.
          type: string
          minLength: 1
          maxLength: 4096
    ModuleList:
      type: object
      additionalProperties: false
      required: [modules]
      properties:
        modules:
          type: array
          items:
            type: string
    NotificationList:
      type: object
      additionalProperties: false
      required: [notifications, next_after]
      properties:
        notifications:
          type: array
          items:
            $ref: "#/components/schemas/Notification"
        next_after:
          type: [integer, "null"]
    Notification:
      type: object
      additionalProperties: false
      required: [id, event, title, date, read, document]
      properties:
        id:
          description: The id of the notification's message, which `readNotification` takes.
          type: integer
        event:
          description: The code of the notification's event, such as `task.reminder`; null for a message of no event.
          type: [string, "null"]
        title:
          description: The event's name in the person's language.
          type: string
        date:
          type: string
          format: date-time
        read:
          type: boolean
        document:
          oneOf:
            - $ref: "#/components/schemas/DocumentReference"
            - type: "null"
    DocumentReference:
      type: object
      additionalProperties: false
      required: [model, id, code]
      properties:
        model:
          type: string
        id:
          type: integer
        code:
          description: The document's code, such as a sample's lab code; empty when it has none.
          type: string
    NotificationPreferenceList:
      type: object
      additionalProperties: false
      required: [preferences]
      properties:
        preferences:
          type: array
          items:
            $ref: "#/components/schemas/NotificationPreference"
    NotificationPreference:
      type: object
      additionalProperties: false
      required: [event, name, mandatory, push]
      properties:
        event:
          description: The event's code, which `setNotificationPreference` takes.
          type: string
        name:
          description: The event's name in the person's language.
          type: string
        mandatory:
          description: True when the event's push cannot be turned off.
          type: boolean
        push:
          description: Whether the event is pushed to the person's phones.
          type: boolean
    PushChoice:
      type: object
      additionalProperties: false
      required: [push]
      properties:
        push:
          type: boolean
    Document:
      type: object
      additionalProperties: false
      required: [model, id, code, title, screen, url]
      properties:
        model:
          type: string
        id:
          type: integer
        code:
          description: The document's code, such as a sample's lab code; empty when it has none.
          type: string
        title:
          description: The document's code, or its name when it has no code.
          type: string
        screen:
          description: The app's screen for the document; `web` for one it shows only with its address on the web.
          enum: [task, sample, sample_test, test_result, handover_record, support_request, container, conversation, web]
        url:
          description: The document's address on the web.
          type: string
    ConversationList:
      type: object
      additionalProperties: false
      required: [conversations]
      properties:
        conversations:
          type: array
          items:
            $ref: "#/components/schemas/Conversation"
    Conversation:
      type: object
      additionalProperties: false
      required: [id, type, name, unread, muted, members, last_message]
      properties:
        id:
          type: integer
        type:
          description: "`chat` for a direct conversation, `group` for a group."
          enum: [chat, group]
        name:
          description: A group's name, or the other people's names.
          type: string
        unread:
          description: How many messages the person has not read.
          type: integer
        muted:
          description: Whether the person muted it, so its messages are not pushed to them.
          type: boolean
        members:
          type: array
          items:
            $ref: "#/components/schemas/PersonName"
        last_message:
          oneOf:
            - $ref: "#/components/schemas/Message"
            - type: "null"
    PersonName:
      type: object
      additionalProperties: false
      required: [id, name]
      properties:
        id:
          description: The person's user.
          type: integer
        name:
          type: string
    PeopleList:
      type: object
      additionalProperties: false
      required: [people]
      properties:
        people:
          type: array
          items:
            $ref: "#/components/schemas/PersonName"
    NewConversation:
      type: object
      additionalProperties: false
      properties:
        person_id:
          description: The user of the person of a direct conversation.
          type: integer
        name:
          description: The group's name.
          type: string
          maxLength: 100
        member_ids:
          description: The users of the people of a group, besides the person.
          type: array
          minItems: 1
          maxItems: 50
          items:
            type: integer
      oneOf:
        - required: [person_id]
        - required: [member_ids]
    MessageList:
      type: object
      additionalProperties: false
      required: [messages]
      properties:
        messages:
          type: array
          items:
            $ref: "#/components/schemas/Message"
    Message:
      type: object
      additionalProperties: false
      required: [id, author, mine, date, text, note, attachments]
      properties:
        id:
          type: integer
        author:
          description: The author's name.
          type: string
        mine:
          description: Whether the person wrote it.
          type: boolean
        date:
          type: string
          format: date-time
        text:
          description: The message's text, without its formatting.
          type: string
        note:
          description: Whether it is an internal note of a document's chatter.
          type: boolean
        attachments:
          type: array
          items:
            $ref: "#/components/schemas/MessageAttachment"
    MessageAttachment:
      type: object
      additionalProperties: false
      required: [id, name, mimetype]
      properties:
        id:
          description: The attachment, downloaded from `/attachments/{attachment_id}`.
          type: integer
        name:
          type: string
        mimetype:
          type: string
    NewMessage:
      type: object
      additionalProperties: false
      properties:
        text:
          type: string
          maxLength: 10000
        mentions:
          $ref: "#/components/schemas/Mentions"
        files:
          type: array
          maxItems: 10
          items:
            $ref: "#/components/schemas/NewFile"
    NewNote:
      type: object
      additionalProperties: false
      required: [text]
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 10000
        mentions:
          $ref: "#/components/schemas/Mentions"
    Mentions:
      description: The users of the people of the laboratory the message mentions with @.
      type: array
      maxItems: 50
      items:
        type: integer
    NewFile:
      type: object
      additionalProperties: false
      required: [name, mimetype, data]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        mimetype:
          type: string
          maxLength: 100
        data:
          description: The file's content in base64.
          type: string
          contentEncoding: base64
    SeenMessage:
      type: object
      additionalProperties: false
      required: [message_id]
      properties:
        message_id:
          description: The newest message the person read.
          type: integer
    MuteChoice:
      type: object
      additionalProperties: false
      required: [muted]
      properties:
        muted:
          type: boolean
    Me:
      type: object
      additionalProperties: false
      required: [name, login, department, roles, can]
      properties:
        name:
          type: string
        login:
          type: string
        department:
          description: The person's department; empty when they have none.
          type: string
        roles:
          type: array
          items:
            type: string
        can:
          type: object
          additionalProperties: false
          required: [create_tasks, assign_tasks, read_handover_records, scan_samples, sign_results]
          properties:
            create_tasks:
              description: Whether the person creates tasks by hand.
              type: boolean
            assign_tasks:
              description: Whether the person assigns and reassigns tasks.
              type: boolean
            read_handover_records:
              description: Whether the person reads handover records.
              type: boolean
            scan_samples:
              description: Whether the person records receipts or hands samples over, which both edit sample handovers.
              type: boolean
            sign_results:
              description: Whether results can wait for the person's signature after the tester sent them.
              type: boolean
            take_support_requests:
              description: Whether the person takes and answers support requests; given only with E-commerce installed.
              type: boolean
    TaskDay:
      type: object
      additionalProperties: false
      required:
        - person
        - day_start
        - day_end
        - open_count
        - overdue_count
        - due_today_count
        - finished_count
        - finished_week_count
        - claimable_count
        - next_up
        - planned_today
        - claimable
      properties:
        person:
          type: string
        day_start:
          type: string
          format: date-time
        day_end:
          type: string
          format: date-time
        open_count:
          type: integer
        overdue_count:
          type: integer
        due_today_count:
          type: integer
        finished_count:
          type: integer
        finished_week_count:
          description: The tasks the person finished in the last 7 days.
          type: integer
        claimable_count:
          type: integer
        next_up:
          description: The next open tasks to do, overdue first.
          type: array
          items:
            $ref: "#/components/schemas/Task"
        planned_today:
          type: array
          items:
            $ref: "#/components/schemas/Task"
        claimable:
          description: The first tasks waiting in the person's queues.
          type: array
          items:
            $ref: "#/components/schemas/Task"
    TaskList:
      type: object
      additionalProperties: false
      required: [tasks, next_after]
      properties:
        tasks:
          type: array
          items:
            $ref: "#/components/schemas/Task"
        next_after:
          type: [integer, "null"]
    Task:
      type: object
      required:
        - id
        - name
        - type
        - status
        - action
        - deadline
        - planned_start
        - planned_end
        - done_at
        - department
        - assignee
        - location
        - closed_by_system
        - document
      properties:
        id:
          type: integer
        name:
          type: string
        type:
          description: The task type's name.
          type: string
        status:
          enum: [open, assigned, in_progress, done, cancelled]
        action:
          description: The action the task opens its document at, such as `test`; empty when it has none.
          type: string
        deadline:
          type: [string, "null"]
          format: date-time
        planned_start:
          type: [string, "null"]
          format: date-time
        planned_end:
          type: [string, "null"]
          format: date-time
        done_at:
          type: [string, "null"]
          format: date-time
        department:
          description: The department whose queue holds the task; empty when it has none.
          type: string
        assignee:
          description: The person who does the task; empty while it waits in a queue.
          type: string
        location:
          description: |
            Where the sample of a testing task was taken, or where the samples of a collection task are taken from;
            empty for any other task.
          type: string
        closed_by_system:
          description: Whether the system marks the task done once its work is done, rather than the assignee.
          type: boolean
        document:
          oneOf:
            - $ref: "#/components/schemas/TaskDocument"
            - type: "null"
    TaskDocument:
      type: object
      additionalProperties: false
      required: [model, id, code, screen]
      properties:
        model:
          type: string
        id:
          type: integer
        code:
          description: The document's code, such as a sample's lab code; empty when it has none.
          type: string
        screen:
          description: The app's screen for the document; `web` for one it shows only with its address on the web.
          enum: [task, sample, sample_test, test_result, handover_record, support_request, container, conversation, web]
    TaskDetail:
      allOf:
        - $ref: "#/components/schemas/Task"
        - type: object
          required: [note, reassign_reason, assigned_by, steps, samples, actions]
          properties:
            note:
              type: string
            reassign_reason:
              description: Why the task was last moved to another person or department.
              type: string
            assigned_by:
              type: string
            steps:
              description: The steps of a testing task's method, in order; empty for any other task.
              type: array
              items:
                $ref: "#/components/schemas/TaskStep"
            samples:
              description: The samples a collection task is for, as the person may read them; empty for any other task.
              type: array
              items:
                $ref: "#/components/schemas/CollectionSample"
            actions:
              $ref: "#/components/schemas/TaskActions"
    CollectionSample:
      type: object
      additionalProperties: false
      required: [id, code, sampling_location]
      properties:
        id:
          type: integer
        code:
          description: The sample's lab code.
          type: string
        sampling_location:
          description: Where the sample is taken from; empty when it is not set.
          type: string
    TaskStep:
      type: object
      additionalProperties: false
      required: [minutes, instruction, note, location]
      properties:
        minutes:
          type: integer
        instruction:
          type: string
        note:
          type: string
        location:
          type: string
    TaskActions:
      description: The actions the web's form shows the person on the task.
      type: object
      additionalProperties: false
      required: [claim, start, done, assign]
      properties:
        claim:
          type: boolean
        start:
          type: boolean
        done:
          type: boolean
        assign:
          type: boolean
    NewTask:
      type: object
      additionalProperties: false
      required: [name, assignee_id, deadline]
      properties:
        name:
          type: string
          maxLength: 200
          pattern: "\\S"
        note:
          type: string
          maxLength: 5000
        assignee_id:
          description: The id of the person, as `searchTaskAssignees` gives it.
          type: integer
        deadline:
          type: string
          format: date-time
    TaskAssignment:
      type: object
      additionalProperties: false
      properties:
        assignee_id:
          description: The person who does the task; none or null leaves it in the department's queue.
          type: [integer, "null"]
        department_id:
          description: The department whose queue holds the task; when left out, the task's, or the assignee's.
          type: [integer, "null"]
        reason:
          description: Why the task moves away from its person or department.
          type: string
          maxLength: 2000
    AssigneeList:
      type: object
      additionalProperties: false
      required: [people, departments]
      properties:
        people:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [id, name, department]
            properties:
              id:
                type: integer
              name:
                type: string
              department:
                type: string
        departments:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [id, name]
            properties:
              id:
                type: integer
              name:
                type: string
    Sample:
      description: |
        A sample as the person may see it. `customer` and `customer_sample_name` are null for a person who may not
        read every test request, such as a tester.
      type: object
      additionalProperties: false
      required:
        - id
        - code
        - status
        - sample_type
        - physical_state
        - form
        - container
        - received_at
        - storage_location
        - sampling_location
        - note
        - customer
        - customer_sample_name
        - handover
        - tasks
        - can_add_photos
        - tests_samples
      properties:
        id:
          type: integer
        code:
          description: The lab code on the sample's label.
          type: string
        status:
          description: The sample's status as the web shows it, in the person's language.
          type: string
        sample_type:
          type: string
        physical_state:
          type: string
        form:
          type: string
        container:
          type: string
        received_at:
          description: When the laboratory received the sample.
          type: [string, "null"]
          format: date-time
        storage_location:
          type: string
        sampling_location:
          type: string
        note:
          type: string
        customer:
          type: [string, "null"]
        customer_sample_name:
          type: [string, "null"]
        handover:
          oneOf:
            - $ref: "#/components/schemas/SampleHandover"
            - type: "null"
        tasks:
          description: The sample's unassigned testing tasks in the person's own department's queue.
          type: array
          items:
            $ref: "#/components/schemas/Task"
        can_add_photos:
          description: Whether the person reads the sample's photos and may attach one; never for a tester.
          type: boolean
        tests_samples:
          description: Whether the person is in a department and authorized to test a parameter, so receives samples and claims their testing tasks.
          type: boolean
    SamplePhotoList:
      type: object
      additionalProperties: false
      required: [photos]
      properties:
        photos:
          type: array
          items:
            $ref: "#/components/schemas/SamplePhoto"
    SamplePhoto:
      type: object
      additionalProperties: false
      required: [id, name, mimetype, created_at, created_by]
      properties:
        id:
          description: The attachment, downloaded from `/attachments/{attachment_id}`.
          type: integer
        name:
          type: string
        mimetype:
          type: string
        created_at:
          type: string
          format: date-time
        created_by:
          description: The person who took the photo.
          type: string
    NewSamplePhoto:
      type: object
      additionalProperties: false
      required: [name, mimetype, data]
      properties:
        name:
          $ref: "#/components/schemas/Name"
        mimetype:
          enum: [image/jpeg, image/png]
        data:
          description: The photo in base64, at most 10 MiB once decoded.
          type: string
          minLength: 1
    SampleHandover:
      description: The sample's handover to the person's department.
      type: object
      additionalProperties: false
      required: [department, received_at, received_by, can_receive]
      properties:
        department:
          type: string
        received_at:
          description: When the department recorded receiving the sample; null while it is on its way.
          type: [string, "null"]
          format: date-time
        received_by:
          description: The person who recorded the receipt; empty while it is on its way.
          type: string
        can_receive:
          description: Whether the person may record the receipt now, the handover being not received yet.
          type: boolean
    SampleLabel:
      type: object
      additionalProperties: false
      required: [code]
      properties:
        code:
          description: The lab code read from the sample's label, or typed when the label cannot be read.
          type: string
          minLength: 1
          maxLength: 64
          pattern: "\\S"
    SampleTaskClaim:
      type: object
      additionalProperties: false
      required: [task_ids]
      properties:
        task_ids:
          description: The testing tasks to claim, among the sample's `tasks`.
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: integer
    SampleTest:
      description: A sample test at the bench, as the person may see it.
      type: object
      additionalProperties: false
      required:
        - id
        - code
        - parameter
        - way
        - due_date
        - status
        - unit
        - decimals
        - regulation
        - comparison_requested
        - can_enter_result
        - result
      properties:
        id:
          type: integer
        code:
          description: The sample's lab code.
          type: string
        parameter:
          type: string
        way:
          description: The way of testing chosen for the test; empty until one is chosen.
          type: string
        due_date:
          type: [string, "null"]
          format: date-time
        status:
          description: The test's status as the web shows it, in the person's language.
          type: string
        unit:
          description: The unit a result is entered in, that of the way of testing on the sample's type.
          type: string
        decimals:
          description: The decimals a result shows unless the tester sets others.
          type: integer
        regulation:
          description: The sample's regulation; empty when it has none.
          type: string
        comparison_requested:
          description: Whether a result is assessed against the regulation, so it needs a conclusion before it is sent.
          type: boolean
        can_enter_result:
          description: Whether the person may enter a result now; a draft reported result is changed instead.
          type: boolean
        result:
          description: The test's reported result; null before one is entered.
          oneOf:
            - $ref: "#/components/schemas/Result"
            - type: "null"
    ResultChange:
      description: The values of a result to set; a value left out stays as it is.
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        value:
          description: The measured value in the unit; kept beside a text, such as a value below the LOD.
          type: number
        value_text:
          description: The result as a text when it is not a number, such as "Not detected"; null clears it.
          type: [string, "null"]
          maxLength: 500
        decimals:
          description: The decimals the value shows.
          type: integer
          minimum: 0
          maximum: 15
        conclusion:
          description: The assessment against the regulation limit, only for a requested comparison; null clears it.
          enum: [pass, fail, insufficient, null]
    NewResult:
      description: A result entered as a number or as a text.
      allOf:
        - $ref: "#/components/schemas/ResultChange"
        - anyOf:
            - required: [value]
            - required: [value_text]
    ResultSignature:
      type: object
      additionalProperties: false
      required: [confirmed]
      properties:
        confirmed:
          description: Sent only from the app's confirmation step.
          const: true
        warnings_acknowledged:
          description: The person read the warnings of the sanity check and sends the result all the same.
          type: boolean
    ResultRejection:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason:
          description: Why the result is rejected; the person who entered it receives it.
          type: string
          maxLength: 2000
    ResultList:
      type: object
      additionalProperties: false
      required: [results, next_after]
      properties:
        results:
          type: array
          items:
            $ref: "#/components/schemas/ResultSummary"
        next_after:
          type: [integer, "null"]
    ResultStatus:
      description: draft (`none`), awaiting approval (`requested`), approved or rejected.
      enum: [none, requested, approved, rejected]
    ResultSummary:
      type: object
      additionalProperties: false
      required: [id, code, parameter, value_display, unit, status, entered_by, entered_at, warned]
      properties:
        id:
          type: integer
        code:
          description: The sample's lab code.
          type: string
        parameter:
          type: string
        value_display:
          description: The result as shown, its text or its value with its decimals and its unit.
          type: string
        unit:
          type: string
        status:
          $ref: "#/components/schemas/ResultStatus"
        entered_by:
          type: string
        entered_at:
          type: [string, "null"]
          format: date-time
        warned:
          description: Whether the result was sent with a warning of the sanity check.
          type: boolean
    Result:
      description: A result with its limit, its warnings and what the person may do with it.
      type: object
      additionalProperties: false
      required:
        - id
        - code
        - parameter
        - value_display
        - unit
        - status
        - entered_by
        - entered_at
        - warned
        - sample_test_id
        - way
        - value
        - value_text
        - decimals
        - comparison_requested
        - conclusion
        - conclusion_label
        - limit
        - limit_missing
        - status_label
        - warnings
        - rejection_reason
        - actions
      properties:
        id:
          type: integer
        code:
          description: The sample's lab code.
          type: string
        parameter:
          type: string
        value_display:
          type: string
        unit:
          type: string
        status:
          $ref: "#/components/schemas/ResultStatus"
        entered_by:
          type: string
        entered_at:
          type: [string, "null"]
          format: date-time
        warned:
          type: boolean
        sample_test_id:
          type: integer
        way:
          type: string
        value:
          description: The measured value; null for a text result.
          type: [number, "null"]
        value_text:
          type: string
        decimals:
          type: integer
        comparison_requested:
          type: boolean
        conclusion:
          enum: [pass, fail, insufficient, null]
        conclusion_label:
          description: The conclusion in the person's language; empty without one.
          type: string
        limit:
          description: The copied regulation limit with its unit; empty without one.
          type: string
        limit_missing:
          description: The regulation sets no limit on the sample's type, so only insufficient basis can be concluded.
          type: boolean
        status_label:
          description: The status in the person's language.
          type: string
        warnings:
          description: |
            Why the sanity check finds a draft's value unusual now, or found it unusual when the result was sent.
          type: array
          items:
            type: string
        rejection_reason:
          description: Why the result was rejected; empty unless it was.
          type: string
        actions:
          $ref: "#/components/schemas/ResultActions"
    ResultActions:
      description: What the web's form lets the person do with the result now.
      type: object
      additionalProperties: false
      required: [edit, sign, reject]
      properties:
        edit:
          type: boolean
        sign:
          description: Send the draft for approval, or approve the result awaiting the person's signature.
          type: boolean
        reject:
          type: boolean
    HandoverRecordList:
      type: object
      additionalProperties: false
      required: [records, next_after]
      properties:
        records:
          type: array
          items:
            $ref: "#/components/schemas/HandoverRecordSummary"
        next_after:
          type: [integer, "null"]
    HandoverRecordStatus:
      description: Waiting for the customer's signature (`draft`) or signed.
      enum: [draft, signed]
    HandoverRecordSummary:
      type: object
      additionalProperties: false
      required: [id, code, request, handed_over_at, handed_over_by, status, signed_at]
      properties:
        id:
          type: integer
        code:
          type: string
        request:
          description: The test request whose samples are handed over.
          type: string
        handed_over_at:
          type: string
          format: date-time
        handed_over_by:
          description: The customer's person who hands the samples over and signs.
          type: string
        status:
          $ref: "#/components/schemas/HandoverRecordStatus"
        signed_at:
          type: [string, "null"]
          format: date-time
    HandoverRecord:
      description: A record with the samples it lists, the phone it was signed on and whether the customer may sign it now.
      type: object
      additionalProperties: false
      required:
        - id
        - code
        - request
        - handed_over_at
        - handed_over_by
        - status
        - signed_at
        - received_by
        - signed_device
        - samples
        - can_sign
      properties:
        id:
          type: integer
        code:
          type: string
        request:
          description: The test request whose samples are handed over.
          type: string
        handed_over_at:
          type: string
          format: date-time
        handed_over_by:
          description: The customer's person who hands the samples over and signs.
          type: string
        status:
          $ref: "#/components/schemas/HandoverRecordStatus"
        signed_at:
          type: [string, "null"]
          format: date-time
        received_by:
          description: The sample delivery staff who take the samples.
          type: string
        signed_device:
          description: The name of the phone the customer signed on; empty while the record is a draft.
          type: string
        samples:
          type: array
          items:
            $ref: "#/components/schemas/HandoverRecordSample"
        can_sign:
          description: Whether the record waits for the customer's signature and the person may have them sign it.
          type: boolean
    HandoverRecordSample:
      description: A sample on the record, with what was handed over against what was expected.
      type: object
      additionalProperties: false
      required:
        - code
        - sample_type
        - customer_sample_name
        - expected_count
        - actual_count
        - quantity
        - excess_material
        - condition
        - condition_note
      properties:
        code:
          type: string
        sample_type:
          type: string
        customer_sample_name:
          description: The customer's name for the sample; null for a person who may not read every test request.
          type: [string, "null"]
        expected_count:
          description: Physical samples expected; 0 when none were calculated.
          type: integer
        actual_count:
          description: Physical samples actually handed over.
          type: integer
        quantity:
          description: The amount handed over, such as "2 bottles of 1 L".
          type: string
        excess_material:
          type: string
        condition:
          description: The condition as handed over, in the person's language.
          type: string
        condition_note:
          type: string
    HandoverSignature:
      type: object
      additionalProperties: false
      required: [signature, confirmed]
      properties:
        signature:
          description: The customer's handwritten signature as a PNG in base64, at most 1 MiB once decoded.
          type: string
          minLength: 1
        confirmed:
          description: Sent only from the app's confirmation step.
          const: true
    SupportRequestList:
      type: object
      additionalProperties: false
      required: [requests]
      properties:
        requests:
          type: array
          items:
            $ref: "#/components/schemas/SupportRequest"
    SupportRequest:
      type: object
      required: [id, code, subject, status, customer, order, handled_by, opened_at]
      properties:
        id:
          type: integer
        code:
          type: string
        subject:
          type: string
        status:
          enum: [open, answered, closed]
        customer:
          type: string
        order:
          description: The code of the order the request is about; empty when it is about none.
          type: string
        handled_by:
          description: The salesperson handling the request; empty while nobody has taken it.
          type: string
        opened_at:
          type: string
          format: date-time
    SupportRequestDetail:
      allOf:
        - $ref: "#/components/schemas/SupportRequest"
        - type: object
          required: [messages, actions]
          properties:
            messages:
              description: The messages of the customer and of sales, oldest first; internal notes are left out.
              type: array
              items:
                $ref: "#/components/schemas/SupportMessage"
            actions:
              description: What the person may do with the request, as the web shows it.
              type: object
              additionalProperties: false
              required: [take, answer]
              properties:
                take:
                  type: boolean
                answer:
                  type: boolean
    SupportMessage:
      type: object
      additionalProperties: false
      required: [id, author, body, date, from_customer]
      properties:
        id:
          type: integer
        author:
          type: string
        body:
          description: The message as plain text.
          type: string
        date:
          type: string
          format: date-time
        from_customer:
          type: boolean
    SupportAnswer:
      type: object
      additionalProperties: false
      required: [body]
      properties:
        body:
          description: The answer as plain text, with at least one character that is not a space.
          type: string
          maxLength: 10000
          pattern: "\\S"
    Folder:
      type: object
      additionalProperties: false
      required: [id, name, root, sync_mode, status, role, category, sample, retention_until, can_share]
      properties:
        id:
          type: integer
        name:
          type: string
        root:
          description: The name the folder was created with, unique for its owner; it never changes.
          type: string
        sync_mode:
          enum: [upload_only, two_way]
        status:
          enum: [in_use, turned_off, archived]
        role:
          description: The person's role in the folder.
          enum: [owner, member]
        category:
          description: The category of a sample's folder; empty for a folder of no sample.
          enum: [raw, working, result, report, null]
        sample:
          oneOf:
            - type: "null"
            - type: object
              additionalProperties: false
              required: [id, lab_code, open]
              properties:
                id:
                  type: integer
                lab_code:
                  type: string
                open:
                  description: False once the sample is completed or cancelled, which makes the folder read-only.
                  type: boolean
        retention_until:
          description: The date until which an archived folder keeps its files; empty while it is in use.
          type: [string, "null"]
          format: date
        can_share:
          description: Whether the person renames the folder and changes its members and rules.
          type: boolean
    OneFolder:
      type: object
      additionalProperties: false
      required: [folder]
      properties:
        folder:
          $ref: "#/components/schemas/Folder"
    FolderList:
      type: object
      additionalProperties: false
      required: [folders]
      properties:
        folders:
          type: array
          items:
            $ref: "#/components/schemas/Folder"
    NewFolder:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          $ref: "#/components/schemas/Name"
    FolderChange:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          $ref: "#/components/schemas/Name"
    Member:
      type: object
      additionalProperties: false
      required: [id, user, role]
      properties:
        id:
          type: integer
        user:
          type: object
          additionalProperties: false
          required: [id, name]
          properties:
            id:
              type: integer
            name:
              type: string
        role:
          enum: [owner, member]
    OneMember:
      type: object
      additionalProperties: false
      required: [member]
      properties:
        member:
          $ref: "#/components/schemas/Member"
    MemberList:
      type: object
      additionalProperties: false
      required: [members]
      properties:
        members:
          type: array
          items:
            $ref: "#/components/schemas/Member"
    NewMember:
      type: object
      additionalProperties: false
      required: [user_id]
      properties:
        user_id:
          type: integer
    Candidate:
      type: object
      additionalProperties: false
      required: [id, name, login]
      properties:
        id:
          type: integer
        name:
          type: string
        login:
          type: string
    CandidateList:
      type: object
      additionalProperties: false
      required: [candidates]
      properties:
        candidates:
          type: array
          maxItems: 10
          items:
            $ref: "#/components/schemas/Candidate"
    Rule:
      type: object
      additionalProperties: false
      required: [id, kind, pattern, recursive, enabled]
      properties:
        id:
          type: integer
        kind:
          $ref: "#/components/schemas/RuleKind"
        pattern:
          type: string
        recursive:
          description: Whether files in subfolders count too.
          type: boolean
        enabled:
          type: boolean
    RuleKind:
      description: A name prefix, a name pattern with `*`, or an extension.
      enum: [prefix, glob, extension]
    OneRule:
      type: object
      additionalProperties: false
      required: [rule]
      properties:
        rule:
          $ref: "#/components/schemas/Rule"
    RuleList:
      type: object
      additionalProperties: false
      required: [rules]
      properties:
        rules:
          type: array
          items:
            $ref: "#/components/schemas/Rule"
    NewRule:
      type: object
      additionalProperties: false
      required: [kind, pattern]
      properties:
        kind:
          $ref: "#/components/schemas/RuleKind"
        pattern:
          description: One name or extension, never a path on a computer.
          $ref: "#/components/schemas/Name"
        recursive:
          type: boolean
          default: true
    RuleChange:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        kind:
          $ref: "#/components/schemas/RuleKind"
        pattern:
          $ref: "#/components/schemas/Name"
        recursive:
          type: boolean
        enabled:
          type: boolean
    Lock:
      type: object
      additionalProperties: false
      required: [id, file_id, user, device_id, status, expires_at]
      properties:
        id:
          type: integer
        file_id:
          type: integer
        user:
          type: object
          additionalProperties: false
          required: [id, name]
          properties:
            id:
              type: integer
            name:
              type: string
        device_id:
          description: The computer the person locked the file from.
          type: [integer, "null"]
        status:
          enum: [active, released, expired]
        expires_at:
          type: string
          format: date-time
    FileLock:
      description: The lock in force on a file as every member sees it, without the computer it was taken from.
      type: object
      additionalProperties: false
      required: [user, expires_at]
      properties:
        user:
          $ref: "#/components/schemas/Person"
        expires_at:
          type: string
          format: date-time
    OneLock:
      type: object
      additionalProperties: false
      required: [lock]
      properties:
        lock:
          $ref: "#/components/schemas/Lock"
    Sha256:
      description: A SHA-256 in lowercase hexadecimal.
      type: string
      pattern: "^[0-9a-f]{64}$"
    Person:
      type: object
      additionalProperties: false
      required: [id, name]
      properties:
        id:
          type: integer
        name:
          type: string
    Version:
      type: object
      additionalProperties: false
      required: [id, number, source, size, sha256, content_available, parent_version_id, restored_from_id, saved_by, device, created_at]
      properties:
        id:
          type: integer
        number:
          type: integer
        source:
          enum: [synced, conflict, restored, edited_online, generated]
        size:
          type: integer
          minimum: 0
        sha256:
          $ref: "#/components/schemas/Sha256"
        content_available:
          description: False when approved retention removal preserved this version's history but removed its bytes.
          type: boolean
        parent_version_id:
          description: The version that was current when this one was made.
          type: [integer, "null"]
        restored_from_id:
          description: The version a restore copied.
          type: [integer, "null"]
        saved_by:
          $ref: "#/components/schemas/Person"
        device:
          description: The computer it came from; empty for a version made online or by a restore in the back office.
          oneOf:
            - $ref: "#/components/schemas/Person"
            - type: "null"
        created_at:
          type: string
          format: date-time
    NewUpload:
      type: object
      additionalProperties: false
      required: [path, size, sha256]
      properties:
        path:
          description: The path of the file relative to its folder, such as `HPLC/run-01.csv`.
          type: string
          minLength: 1
        size:
          description: The size the computer claims, in bytes.
          type: integer
          minimum: 0
          maximum: 5368709120
        sha256:
          description: The SHA-256 the computer claims; the server verifies it.
          $ref: "#/components/schemas/Sha256"
        base_version_id:
          description: The version the computer's file was based on; empty for a new file.
          type: [integer, "null"]
    Upload:
      type: object
      additionalProperties: false
      required: [id, path, status, failure_code, size, sha256, base_version_id, part_size, part_count, expires_at, version]
      properties:
        id:
          type: integer
        path:
          type: string
        status:
          enum: [prepared, verifying, completed, conflict, unchanged, refused, failed, expired]
        failure_code:
          description: |
            Why the upload failed, `size_mismatch`, `sha256_mismatch` or `missing_object`, or the code of the refusal of
            a refused upload.
          type: [string, "null"]
        size:
          type: integer
        sha256:
          $ref: "#/components/schemas/Sha256"
        base_version_id:
          type: [integer, "null"]
        part_size:
          description: The size of every part but the last.
          type: integer
        part_count:
          description: The number of parts; 0 when nothing is uploaded in parts, such as an empty file.
          type: integer
        expires_at:
          description: When an upload not finalized by then expires.
          type: string
          format: date-time
        version:
          description: The version stored, or the current version of an unchanged upload.
          oneOf:
            - $ref: "#/components/schemas/Version"
            - type: "null"
    OneUpload:
      type: object
      additionalProperties: false
      required: [upload]
      properties:
        upload:
          $ref: "#/components/schemas/Upload"
    PartRequest:
      type: object
      additionalProperties: false
      required: [part_numbers]
      properties:
        part_numbers:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: integer
            minimum: 1
    PartAddresses:
      type: object
      additionalProperties: false
      required: [parts, expires_at]
      properties:
        parts:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [number, url]
            properties:
              number:
                type: integer
              url:
                description: The presigned address that uploads the part with a PUT of its bytes.
                type: string
        expires_at:
          type: string
          format: date-time
    OneVersion:
      type: object
      additionalProperties: false
      required: [version]
      properties:
        version:
          $ref: "#/components/schemas/Version"
    VersionList:
      type: object
      additionalProperties: false
      required: [versions]
      properties:
        versions:
          type: array
          items:
            $ref: "#/components/schemas/Version"
    File:
      type: object
      additionalProperties: false
      required: [id, path, current_version, lock]
      properties:
        id:
          type: integer
        path:
          description: The path relative to the folder, in the letter case it was first saved with.
          type: string
        current_version:
          oneOf:
            - $ref: "#/components/schemas/Version"
            - type: "null"
        lock:
          description: The lock in force on the file; empty when nobody holds one.
          oneOf:
            - $ref: "#/components/schemas/FileLock"
            - type: "null"
    FileList:
      type: object
      additionalProperties: false
      required: [files, next_after]
      properties:
        files:
          type: array
          items:
            $ref: "#/components/schemas/File"
        next_after:
          type: [integer, "null"]
    Download:
      type: object
      additionalProperties: false
      required: [url, expires_at]
      properties:
        url:
          description: The presigned address that reads the content with a GET.
          type: string
        expires_at:
          type: string
          format: date-time
    Change:
      type: object
      additionalProperties: false
      required: [id, file, version]
      properties:
        id:
          type: integer
        file:
          type: object
          additionalProperties: false
          required: [id, path]
          properties:
            id:
              type: integer
            path:
              type: string
        version:
          description: The file's new current version.
          $ref: "#/components/schemas/Version"
    ChangeList:
      type: object
      additionalProperties: false
      required: [changes, next_after]
      properties:
        changes:
          type: array
          items:
            $ref: "#/components/schemas/Change"
        next_after:
          type: [integer, "null"]
    Error:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code:
              enum:
                - invalid_request
                - invalid_credentials
                - invalid_key
                - permission_denied
                - device_revoked
                - not_found
                - method_not_allowed
                - folder_archived
                - folder_disabled
                - folder_sample_closed
                - folder_exists
                - locked
                - not_locked
                - not_eligible
                - not_lockable
                - not_editable
                - idempotency_conflict
                - mandatory_event
                - too_large
                - action_refused
                - already_claimed
                - already_taken
                - result_warning
                - too_many_attempts
                - internal_error
                - try_again
                - editing_unavailable
                - upload_incomplete
                - upload_closed
                - storage_unavailable
            message:
              description: What happened, in the person's language.
              type: string
            id:
              description: The id the server logged an internal error under.
              type: string
  responses:
    InvalidRequest:
      description: The request does not match this document.
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Error"
              - properties:
                  error:
                    properties:
                      code:
                        enum: [invalid_request]
    Unauthenticated:
      description: The login or the computer's key is refused.
      headers:
        WWW-Authenticate:
          $ref: "#/components/headers/WwwAuthenticate"
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Error"
              - properties:
                  error:
                    properties:
                      code:
                        enum: [invalid_credentials, invalid_key]
    Forbidden:
      description: The person may not do this.
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Error"
              - properties:
                  error:
                    properties:
                      code:
                        enum: [permission_denied, device_revoked]
    NotFound:
      description: Nothing is found, or nothing the person may read; the two answer the same.
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Error"
              - properties:
                  error:
                    properties:
                      code:
                        enum: [not_found]
    Conflict:
      description: The folder, or its state, refuses the change.
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Error"
              - properties:
                  error:
                    properties:
                      code:
                        enum: [folder_archived, folder_disabled, folder_sample_closed, folder_exists, locked, not_locked]
    Unprocessable:
      description: The request names something that cannot be done.
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Error"
              - properties:
                  error:
                    properties:
                      code:
                        enum: [not_eligible, not_lockable, not_editable, idempotency_conflict]
    ActionRefused:
      description: The model refused the action; the message says why.
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Error"
              - properties:
                  error:
                    properties:
                      code:
                        enum: [action_refused]
    ClaimRefused:
      description: Someone else claimed the task first, or it waits in a queue the person does not belong to.
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Error"
              - properties:
                  error:
                    properties:
                      code:
                        enum: [already_claimed, action_refused]
    SigningRefused:
      description: The person did not acknowledge the result's warnings, or the approval refused the signature.
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Error"
              - properties:
                  error:
                    properties:
                      code:
                        enum: [result_warning, action_refused]
    TooLarge:
      description: A file over its limit.
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Error"
              - properties:
                  error:
                    properties:
                      code:
                        enum: [too_large]
    TakeRefused:
      description: Someone else took the request first, or it is closed.
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Error"
              - properties:
                  error:
                    properties:
                      code:
                        enum: [already_taken, action_refused]
    MandatoryEvent:
      description: The push of a mandatory event cannot be turned off.
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Error"
              - properties:
                  error:
                    properties:
                      code:
                        enum: [mandatory_event]
    MethodNotAllowed:
      description: The route does not take this method.
      headers:
        Allow:
          $ref: "#/components/headers/Allow"
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Error"
              - properties:
                  error:
                    properties:
                      code:
                        enum: [method_not_allowed]
    TooManyAttempts:
      description: Signing in with this login, or from this address, is slowed after failed attempts.
      headers:
        Retry-After:
          $ref: "#/components/headers/RetryAfter"
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Error"
              - properties:
                  error:
                    properties:
                      code:
                        enum: [too_many_attempts]
    InternalError:
      description: The server failed; it logged the details under the answer's id.
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Error"
              - required: [error]
                properties:
                  error:
                    required: [id]
                    properties:
                      code:
                        enum: [internal_error]
    UploadConflict:
      description: The folder, a lock or the state of the upload refuses it.
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Error"
              - properties:
                  error:
                    properties:
                      code:
                        enum: [folder_archived, folder_disabled, folder_sample_closed, locked, upload_incomplete, upload_closed]
    StorageUnavailable:
      description: The request still failed on concurrency after the server's last try, or the bucket cannot be reached.
      headers:
        Retry-After:
          $ref: "#/components/headers/RetryAfter"
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Error"
              - properties:
                  error:
                    properties:
                      code:
                        enum: [try_again, storage_unavailable]
    Unavailable:
      description: The request still failed on concurrency after the server's last try.
      headers:
        Retry-After:
          $ref: "#/components/headers/RetryAfter"
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Error"
              - properties:
                  error:
                    properties:
                      code:
                        enum: [try_again]
