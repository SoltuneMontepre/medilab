    post:
      operationId: signHandoverRecord
      tags: [Handover records]
      summary: Records the customer's handwritten signature on the draft record.
      description: |
        `confirmed` is sent only from the app's confirmation step, so signing is a deliberate action. The phone of the
        key is recorded as the device the record was signed on, the signed PDF is attached and emailed to the customer,
        and the record can no longer change. A signature over 1 MiB once decoded is refused with `too_large` before
