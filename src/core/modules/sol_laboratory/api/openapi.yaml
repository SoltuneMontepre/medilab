openapi: 3.1.0
info:
  title: MediLab laboratory files API
  version: 1.17.0
  description: |
    The API Medilab Sync signs computers in with and reaches laboratory files through, and Medilab Mobile signs phones
    in with. Every refusal answers `{"error": {"code", "message"}}` with the HTTP status of its code; a device acts on
    the code, never on the message, which is in the person's language. A request with an `Accept-Language` of a
    language MediLab has installed, such as `vi` or `en`, is answered in that language.

    A route that creates something takes an optional `Idempotency-Key` header, a key the computer generates for the
    request and that is unique for the computer: repeating the request with the same key, such as after a lost answer,
    answers with what the first one created; the same key with another request is refused with
    `idempotency_conflict`. Other changes are idempotent by their own rules.

    | Code | Status |
    | ---- | ------ |
    | `invalid_request` | 400 |
    | `invalid_credentials`, `invalid_key` | 401 |
    | `permission_denied`, `device_revoked` | 403 |
    | `not_found` | 404 |
    | `method_not_allowed` | 405 |
    | `folder_archived`, `folder_disabled`, `folder_sample_closed`, `folder_exists`, `locked`, `not_locked`, `upload_incomplete`, `upload_closed`, `action_refused`, `already_claimed`, `already_taken`, `result_warning` | 409 |
    | `too_large` | 413 |
    | `not_eligible`, `not_lockable`, `not_editable`, `idempotency_conflict`, `mandatory_event` | 422 |
    | `too_many_attempts` | 429 |
    | `internal_error` | 500 |
    | `try_again`, `editing_unavailable`, `storage_unavailable` | 503 |
servers:
  - url: /medilab/api/v1
security:
  - deviceKey: []
tags:
  - name: Push tokens
    description: The Firebase token of a phone signed in on Medilab Mobile.
  - name: Modules
    description: The installed MediLab modules.
  - name: Notifications
    description: The person's inbox notifications, the same as the web's inbox.
  - name: Notification preferences
    description: Which events are pushed to the person's phones.
  - name: Documents
    description: The documents pushes, notifications and tasks open.
  - name: Me
    description: The person signed in and what they may do.
  - name: Tasks
    description: The person's day, to-do list and queues, and the actions on tasks.
  - name: Samples
    description: Scanning a sample's label to record its receipt or claim its testing tasks, and its photos.
  - name: Attachments
    description: The files the app shows, downloaded with the person's rights.
  - name: Results
    description: Testing at the bench, entering results and signing or rejecting them.
  - name: Handover records
    description: The handover records of samples collected from customers, and the customer's signature on them.
  - name: Conversations
    description: The person's direct and group conversations, the same as Discuss on the web.
  - name: Chatter
    description: The messages and notes of a task's or a test request's chatter.
  - name: Support requests
    description: The customers' support requests sales handle, taken and answered as on the web. Declared by
      `sol_commerce`, so they exist only with E-commerce installed.
paths:
  /health:
    get:
      operationId: health
      summary: Answers once Odoo serves requests.
      security: []
      responses:
        "200":
          description: Odoo serves requests.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "500":
          $ref: "#/components/responses/InternalError"
  /ready:
    get:
      operationId: ready
      summary: Answers whether the API can serve laboratory files. The editing service is never part of it.
      security: []
      responses:
        "200":
          description: Every check passes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Readiness"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          description: A check fails.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Readiness"
  /sign-in:
    post:
      operationId: signIn
      summary: Signs a computer or a phone in with the person's MediLab login and gives it a key of its own.
      description: |
        A computer signs in for a person with the laboratory files permission; a phone, of platform `android` or `ios`,
        for any internal user, never for a portal user. A person with two-factor authentication signs in with one of
        their Odoo API keys in place of the password. Signing in again replaces the device's key. After 5 failed attempts for a login within 15 minutes, every
        further attempt waits a delay that doubles from 1 second up to 60 seconds after the last failure; an attempt
        before its delay has passed is refused before the password is checked.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignIn"
      responses:
        "200":
          description: The device is signed in. The key is given only in this answer.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignedIn"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "429":
          $ref: "#/components/responses/TooManyAttempts"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/Unavailable"
  /sign-out:
    post:
      operationId: signOut
      summary: Signs the device of the key out; it can sign in again.
      description: |
        The key stops at once, so repeating a sign-out whose answer was lost is refused with `invalid_key`. A phone's
        push token is turned off with it.
      responses:
        "204":
          description: The device is signed out.
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "409":
          $ref: "#/components/responses/ActionRefused"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/Unavailable"
  /devices:
    get:
      operationId: listDevices
      summary: Lists the person's computers and phones.
      responses:
        "200":
          description: The person's computers and phones, the one of the key included.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceList"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/Unavailable"
  /devices/{device_id}/revoke:
    post:
      operationId: revokeDevice
      summary: Revokes one of the person's computers or phones for good.
      description: |
        Its key stops at once, a phone's push token is turned off, and it cannot sign in again; the person's folders and
        other devices stay. Revoking a device already revoked changes nothing.
      parameters:
        - name: device_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: The computer is revoked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RevokedDevice"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "409":
          $ref: "#/components/responses/ActionRefused"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/Unavailable"
  /push-token:
    put:
      operationId: registerPushToken
      tags: [Push tokens]
      summary: Registers the Firebase token of the phone of the key, or replaces its old one, and turns it on.
      description: |
        A phone has one token. A token registered for another phone, such as after the app is reinstalled, moves to
        this phone, so a token is never pushed to two phones. Only a phone registers a token; a computer is refused
        with `invalid_request`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PushToken"
      responses:
        "204":
          description: The token is registered and on.
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "409":
          $ref: "#/components/responses/ActionRefused"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/Unavailable"
    delete:
      operationId: unregisterPushToken
      tags: [Push tokens]
      summary: Turns the token of the phone of the key off.
      description: Turning off a token already off, or a phone without one, changes nothing.
      responses:
        "204":
          description: The phone gets no more pushes.
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "409":
          $ref: "#/components/responses/ActionRefused"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/Unavailable"
  /modules:
    get:
      operationId: listModules
      tags: [Modules]
      summary: Lists the installed MediLab modules, so an application shows only the screens of those installed.
      responses:
        "200":
          description: The technical names of the installed MediLab modules, such as `sol_laboratory`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModuleList"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "409":
          $ref: "#/components/responses/ActionRefused"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/Unavailable"
  /notifications:
    get:
      operationId: listNotifications
      tags: [Notifications]
      summary: Lists the person's inbox notifications, unread first, then newest first.
      description: |
        The notifications the web's inbox shows the person. Each names its event, the event's name, its date, its
        document and whether it is read, never its text: the app reads the document with the person's rights.
        `next_after` is the `after` of the next page, or empty after the last one.
      parameters:
        - name: after
          in: query
          required: false
          description: The `next_after` of the page before; 0 or none from the start.
          schema:
            type: string
            pattern: "^[0-9]{1,18}$"
        - name: limit
          in: query
          required: false
          description: How many to give, from 1 to 100; 50 by default.
          schema:
            type: string
            pattern: "^(100|[1-9][0-9]?)$"
      responses:
        "200":
          description: The notifications.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationList"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "409":
          $ref: "#/components/responses/ActionRefused"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/Unavailable"
  /notifications/{message_id}/read:
    parameters:
      - name: message_id
        in: path
        required: true
        schema:
          type: integer
    post:
      operationId: readNotification
      tags: [Notifications]
      summary: Marks the person's notification of the message read, as opening it in the web's inbox does.
      description: Marking a notification already read changes nothing.
      responses:
        "204":
          description: The notification is read, on the web as well.
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "409":
          $ref: "#/components/responses/ActionRefused"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/Unavailable"
  /notification-preferences:
    get:
      operationId: listNotificationPreferences
      tags: [Notification preferences]
      summary: Lists every event with whether its push reaches the person's phones.
      description: |
        A push is on until the person turns it off, and always on for a mandatory event. An event the administrator
        turned off notifies nobody and is not listed.
      responses:
        "200":
          description: The events and their pushes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationPreferenceList"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "409":
          $ref: "#/components/responses/ActionRefused"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/Unavailable"
  /notification-preferences/{event_code}:
    parameters:
      - name: event_code
        in: path
        required: true
        schema:
          type: string
    put:
      operationId: setNotificationPreference
      tags: [Notification preferences]
      summary: Turns the push of the event on or off for the person, the same choice the web's preferences show.
      description: Turning off the push of a mandatory event is refused with `mandatory_event`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PushChoice"
      responses:
        "200":
          description: The event with its push as it now is.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationPreference"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/MandatoryEvent"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "409":
          $ref: "#/components/responses/ActionRefused"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/Unavailable"
  /documents/{model}/{record_id}:
    parameters:
      - name: model
        in: path
        required: true
        schema:
          type: string
      - name: record_id
        in: path
        required: true
        schema:
          type: integer
    get:
      operationId: getDocument
      tags: [Documents]
      summary: Gives the document a push, a notification or a task opens, as the person may read it.
      description: |
        A document the person can no longer read, or that no longer exists, answers `not_found`, and the app says so.
        A document the app has no screen for answers the screen `web` with its address on the web.
      responses:
        "200":
          description: The document.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Document"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "409":
          $ref: "#/components/responses/ActionRefused"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/Unavailable"
  /conversations:
    get:
      operationId: listConversations
      tags: [Conversations]
      summary: Lists the person's direct and group conversations, the latest first.
      description: |
        The conversations Discuss on the web shows the person, each with its unread count, whether the person muted
        it, its members and its last message.
      responses:
        "200":
          description: The conversations.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationList"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "409":
          $ref: "#/components/responses/ActionRefused"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/Unavailable"
    post:
      operationId: openConversation
      tags: [Conversations]
      summary: Opens the direct conversation with one person, or creates a group with a name and members.
      description: |
        `person_id` opens the direct conversation with that person, the same one Discuss on the web opens, creating it
        the first time. `member_ids` creates a group of those people and the person, with an optional name; with an
        `Idempotency-Key`, repeating the request answers with the group it created. Only active people of the
        laboratory take part in conversations: anyone else is refused with `invalid_request`.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewConversation"
      responses:
        "200":
          description: The conversation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Conversation"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "409":
          $ref: "#/components/responses/ActionRefused"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/Unavailable"
  /conversations/{channel_id}/messages:
    parameters:
      - name: channel_id
        in: path
        required: true
        schema:
          type: integer
    get:
      operationId: listConversationMessages
      tags: [Conversations]
      summary: Lists a page of the conversation's messages, newest first.
      description: |
        `before` pages back from the oldest message the app has; `after` gives the messages newer than the newest it
        has, which the app asks for while the conversation is open. A conversation the person is not a member of
        answers `not_found`.
      parameters:
        - name: before
          in: query
          required: false
          description: The id of the oldest message the app has; the page gives the messages before it.
          schema:
            type: string
            pattern: "^[0-9]{1,18}$"
        - name: after
          in: query
          required: false
          description: The id of the newest message the app has; the page gives the messages after it.
          schema:
            type: string
            pattern: "^[0-9]{1,18}$"
        - name: limit
          in: query
          required: false
          description: How many to give, from 1 to 100; 30 by default.
          schema:
            type: string
            pattern: "^(100|[1-9][0-9]?)$"
      responses:
        "200":
          description: The messages.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageList"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "409":
          $ref: "#/components/responses/ActionRefused"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/Unavailable"
    post:
      operationId: postConversationMessage
      tags: [Conversations]
      summary: Posts a message with its text, mentions and files, as Discuss on the web posts it.
      description: |
        The message is pushed at once to the phones of the conversation's members, except its author and those who
        muted it, and the people it mentions are notified on each channel they keep on. A file over 10 MiB, or files
        over 25 MiB together, once decoded, are refused with `too_large` before anything is stored. With an
        `Idempotency-Key`, repeating the request answers with the message it posted.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewMessage"
      responses:
        "200":
          description: The message posted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "409":
          $ref: "#/components/responses/ActionRefused"
        "413":
          $ref: "#/components/responses/TooLarge"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/Unavailable"
  /conversations/{channel_id}/seen:
    parameters:
      - name: channel_id
        in: path
        required: true
        schema:
          type: integer
    post:
      operationId: markConversationSeen
      tags: [Conversations]
      summary: Marks the conversation read up to the message, as Discuss on the web does.
      description: Marking it read up to an older message changes nothing.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SeenMessage"
      responses:
        "204":
          description: The conversation is read up to the message, on the web as well.
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "409":
          $ref: "#/components/responses/ActionRefused"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/Unavailable"
  /conversations/{channel_id}/mute:
    parameters:
      - name: channel_id
        in: path
        required: true
        schema:
          type: integer
    put:
      operationId: muteConversation
      tags: [Conversations]
      summary: Mutes or unmutes the conversation for the person, as Discuss on the web does.
      description: A muted conversation's messages are not pushed to the person, unless a message mentions them.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MuteChoice"
      responses:
        "200":
          description: The conversation as it now is.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Conversation"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "409":
          $ref: "#/components/responses/ActionRefused"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/Unavailable"
  /people:
    get:
      operationId: searchPeople
      tags: [Conversations]
      summary: Finds the active people of the laboratory by name, for new conversations and mentions.
      description: The person is left out; at most 20 people are given.
      parameters:
        - name: q
          in: query
          required: false
          description: Part of the name.
          schema:
            type: string
            maxLength: 100
      responses:
        "200":
          description: The people.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PeopleList"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
