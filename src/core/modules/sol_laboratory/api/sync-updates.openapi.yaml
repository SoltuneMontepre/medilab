    trace:
      operationId: refuseLegacyPathTrace
      parameters: *id014
      security: []
      responses:
        '410':
          description: Retired API; no authentication or mutation. Safe configured
            download link is optional. HEAD has no body.
          headers: *id001
          content:
            application/json:
              schema:
