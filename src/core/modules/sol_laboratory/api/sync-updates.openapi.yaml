    x-legacy-all-methods: true
components:
  schemas:
    Manifest:
      type: object
      required:
      - version
      - url
      - signature
      additionalProperties: false
      properties:
        version: &id015
          type: string
          minLength: 5
          maxLength: 128
        url: &id016
          type: string
          format: uri
          maxLength: 2048
        signature: &id017
          type: string
          minLength: 1
          maxLength: 16384
        notes: &id018
          type: string
          maxLength: 32768
        pub_date: &id019
          type: string
          format: date-time
    Error:
      type: object
      required:
      - error
      additionalProperties: false
      properties:
        error:
          type: object
          required:
          - code
          - message
          additionalProperties: false
          properties:
            code:
              enum:
              - invalid_request
              - method_not_allowed
              - update_unavailable
              - client_update_required
              - not_found
              - internal_error
            message:
              type: string
            download_url:
              type: string
              format: uri
    Catalog:
      type: object
      required:
      - releases
      additionalProperties: false
      properties:
        releases:
          type: array
          maxItems: 1000
          items:
            type: object
            additionalProperties: false
            required:
            - version
            - url
            - signature
            - target
            - arch
            - channel
            - trust
            properties:
              version: *id015
              url: *id016
              signature: *id017
              notes: *id018
              pub_date: *id019
              target:
                enum:
                - linux
                - windows
                - darwin
              arch:
                enum:
                - x86_64
                - aarch64
              channel:
                type: string
                pattern: ^[a-z][a-z0-9-]{0,31}$
              trust:
                enum:
                - current
                - legacy
