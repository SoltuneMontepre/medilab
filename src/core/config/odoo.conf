[options]
addons_path = /usr/lib/python3/dist-packages/odoo/addons,/mnt/extra-addons
http_interface = 0.0.0.0
db_name = medilab
list_db = False
workers = 0
admin_passwd = admin
dev_mode = xml

# Docker keeps the log without a terminal, where Odoo would otherwise leave every level uncolored.
[colors]
loglevel = always
