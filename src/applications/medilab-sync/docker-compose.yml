# Merge with tools/infrastructure/docker-compose.yml, using a unique project name and worktree ports.
services:
  onlyoffice:
    image: docker.io/onlyoffice/documentserver:9.4.0.1@sha256:3ab6ebc7c605e5a32b7ae3ff19daed4925090245acc8100ce2230bd766c88212
    hostname: onlyoffice
    restart: unless-stopped
    command: []
    entrypoint: ["/bin/bash", "/opt/medilab/onlyoffice/start.sh"]
    ports:
      - "127.0.0.1:${ONLYOFFICE_PORT:-29843}:443"
    environment:
      JWT_SECRET: ${ONLYOFFICE_JWT_SECRET:?Set an isolated random JWT secret of at least 32 base64url characters}
      JWT_ENABLED: "true"
      JWT_HEADER: Medilab-Editor-Token
      JWT_IN_BODY: "false"
      USE_UNAUTHORIZED_STORAGE: "false"
      NGINX_WORKER_PROCESSES: "2"
    networks:
      - onlyoffice
    volumes:
      - ../../tools/infrastructure/onlyoffice:/opt/medilab/onlyoffice:ro
      - ${ONLYOFFICE_TLS_DIR:?Set the directory containing tls.crt and tls.key}:/run/onlyoffice-tls:ro
      - ${ONLYOFFICE_CA_DIR:?Set the directory containing ca.crt}:/run/onlyoffice-ca:ro
      - onlyoffice-lib:/var/lib/onlyoffice
      - onlyoffice-data:/var/www/onlyoffice/Data
      - onlyoffice-postgres:/var/lib/postgresql
      - onlyoffice-rabbitmq:/var/lib/rabbitmq
      - onlyoffice-redis:/var/lib/redis
      - onlyoffice-fonts:/usr/share/fonts/truetype/custom
    tmpfs:
      - /var/log/onlyoffice:size=134217728
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent --cacert /run/onlyoffice-ca/ca.crt https://onlyoffice/healthcheck | grep -qx true"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 120s
    stop_grace_period: 1350s
    cpus: 4
    mem_limit: 6g
    mem_reservation: 4g

networks:
  onlyoffice:
    internal: true

volumes:
  onlyoffice-lib:
  onlyoffice-data:
  onlyoffice-postgres:
  onlyoffice-rabbitmq:
  onlyoffice-redis:
  onlyoffice-fonts:
