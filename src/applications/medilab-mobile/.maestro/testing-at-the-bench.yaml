# demo.tester signs in, scans the label of the sample handed over to Chemistry, claims its lead task, enters the result
# and signs it, on a release build made for the MediLab at localhost:8069, which it reaches through adb reverse.
# LAB_CODE is the lab code of sol_demo.demo_sample_label_scan.
appId: com.medilab.mobile
name: Testing at the bench
env:
  LOGIN: demo.tester
  PASSWORD: demo
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "English"
    timeout: 60000
- tapOn: "English"
- tapOn:
    id: "sign-in-login"
- inputText: ${LOGIN}
- tapOn:
    id: "sign-in-password"
- inputText: ${PASSWORD}
- hideKeyboard
- tapOn: "Sign in"
- extendedWaitUntil:
    visible: "Scan a sample label"
    timeout: 60000
- tapOn: "Scan a sample label"
- tapOn:
    text: "Don.t allow"
    optional: true
- tapOn:
    id: "scan-code"
- inputText: ${LAB_CODE}
- hideKeyboard
- tapOn: "Open the sample"
- extendedWaitUntil:
    visible: '.*Lead \(Pb\).*'
    timeout: 30000
- tapOn: '.*Lead \(Pb\).*'
- tapOn: 'Claim the chosen tasks \(1\)'
- assertVisible: "Tasks claimed: 1."
- repeat:
    while:
      notVisible: "To-do list"
    commands:
      - back
- tapOn: "To-do list"
- tapOn: '${LAB_CODE}: Lead \(Pb\).*'
- extendedWaitUntil:
    visible: "Enter the result"
    timeout: 30000
- assertVisible: "Method steps"
- tapOn: "Enter the result"
- tapOn:
    id: "result-value"
- inputText: "0.008"
- hideKeyboard
- tapOn:
    text: "Pass"
    optional: true
- tapOn: "Save the result"
- extendedWaitUntil:
    visible: "Send for approval"
    timeout: 30000
- tapOn: "Send for approval"
- tapOn:
    text: "I checked the warnings and send the result anyway."
    optional: true
- tapOn: "Sign"
- extendedWaitUntil:
    visible: "The result is approved or waits for someone else's signature, so you can only read it."
    timeout: 30000
