# demo.tester signs in, scans the label of the sample handed over to Chemistry, claims its lead task, enters the result
# and signs it, on a release build made for the MediLab at localhost:8069, which it reaches through adb reverse.
# LAB_CODE is the lab code of sol_demo.demo_sample_label_scan.
appId: com.medilab.mobile
name: Testing at the bench
env:
  LOGIN: demo.tester
  PASSWORD: demo
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: "language-en"
    timeout: 60000
- tapOn:
    id: "language-en"
- tapOn:
    id: "sign-in-login"
- inputText: ${LOGIN}
- hideKeyboard
- tapOn:
    id: "sign-in-password"
- inputText: ${PASSWORD}
- hideKeyboard
- tapOn:
    id: "sign-in-submit"
- extendedWaitUntil:
    visible:
      id: "home"
    timeout: 60000
- scrollUntilVisible:
    element:
      id: "home-scan"
    direction: DOWN
    timeout: 30000
- tapOn:
    id: "home-scan"
# Android asks for the camera; the flow types the label's code instead.
- tapOn:
    text: "Don.t allow"
    optional: true
- tapOn:
    id: "scan-code"
- inputText: ${LAB_CODE}
- hideKeyboard
- tapOn:
    id: "scan-open"
- scrollUntilVisible:
    element:
      id: "claimable-task"
      text: '.*Lead \(Pb\).*'
    direction: DOWN
    timeout: 30000
- tapOn:
    id: "claimable-task"
    text: '.*Lead \(Pb\).*'
- scrollUntilVisible:
    element:
      id: "sample-claim"
    direction: DOWN
    timeout: 10000
- tapOn:
    id: "sample-claim"
- scrollUntilVisible:
    element:
      text: "Tasks claimed: 1."
    direction: DOWN
    timeout: 30000
- repeat:
    while:
      notVisible:
        id: "home"
    commands:
      - back
- scrollUntilVisible:
    element:
      id: "home-todo"
    direction: DOWN
    timeout: 30000
- tapOn:
    id: "home-todo"
- scrollUntilVisible:
    element:
      id: "task-row"
      text: '.*Lead \(Pb\), ${LAB_CODE},.*'
    direction: DOWN
    timeout: 30000
- tapOn:
    id: "task-row"
    text: '.*Lead \(Pb\), ${LAB_CODE},.*'
- scrollUntilVisible:
    element:
      id: "task-enter-result"
    direction: DOWN
    timeout: 30000
- tapOn:
    id: "task-enter-result"
- scrollUntilVisible:
    element:
      id: "result-value"
    direction: DOWN
    timeout: 30000
- tapOn:
    id: "result-value"
- inputText: "0.008"
- hideKeyboard
- scrollUntilVisible:
    element:
      id: "result-save"
    direction: DOWN
    timeout: 10000
- tapOn:
    id: "choice-pass"
    optional: true
- tapOn:
    id: "result-save"
- scrollUntilVisible:
    element:
      id: "result-send"
    direction: DOWN
    timeout: 30000
- tapOn:
    id: "result-send"
- scrollUntilVisible:
    element:
      id: "result-sign"
    direction: DOWN
    timeout: 10000
- tapOn:
    id: "result-acknowledge"
    optional: true
- tapOn:
    id: "result-sign"
- scrollUntilVisible:
    element:
      id: "result-read-only"
    direction: DOWN
    timeout: 30000
